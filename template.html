<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算机专业名词大全 · 学生通关版</title>
<meta name="description" content="689 个计算机核心名词，四层助记：人话翻译、生活类比、学习点拨、易混淆辨析。面向本科生/硕士生的免费查词工具。">
<style>
:root {
  --bg:#f6f7fb; --bg-grad:#eef2ff; --card:#ffffff; --text:#171c26; --text2:#5c6474;
  --line:#e6e8f0; --accent:#4f6ef7; --accent-deep:#3b55d9; --accent-soft:#eef1ff;
  --tag-bg:#f1f3f9; --tag-text:#4b5563; --radius:14px;
  --shadow-sm:0 1px 2px rgba(23,28,38,.05),0 2px 8px rgba(23,28,38,.04);
  --shadow-md:0 4px 12px rgba(23,28,38,.08),0 2px 4px rgba(23,28,38,.05);
  --shadow-lg:0 12px 32px rgba(79,110,247,.14);
  /* 章节按钮配色（淡底深字） */
  --ch0-bg:#fff4e5; --ch0-fg:#b45309;
  --ch1-bg:#e8f4fd; --ch1-fg:#0369a1;
  --ch2-bg:#eaf7ee; --ch2-fg:#15803d;
  --ch3-bg:#f3effc; --ch3-fg:#6d28d9;
  --ch4-bg:#fbece9; --ch4-fg:#b91c1c;
  --ch5-bg:#e8ebfd; --ch5-fg:#4338ca;
  --ch6-bg:#e7f1fe; --ch6-fg:#1d4ed8;
}
[data-theme="dark"] {
  --bg:#0f1220; --bg-grad:#171c33; --card:#1a1f33; --text:#eef0f8; --text2:#9aa3bc;
  --line:#2a3048; --accent:#7c93ff; --accent-deep:#9db0ff; --accent-soft:#222a4d;
  --tag-bg:#272e4a; --tag-text:#c2c9e0;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  /* 章节按钮配色（暗色深底亮字） */
  --ch0-bg:#3a2c12; --ch0-fg:#f2b15c;
  --ch1-bg:#13293d; --ch1-fg:#5bc0f0;
  --ch2-bg:#14321f; --ch2-fg:#5ad08a;
  --ch3-bg:#2a1f4a; --ch3-fg:#b39dff;
  --ch4-bg:#3a1d18; --ch4-fg:#f08a72;
  --ch5-bg:#1e2452; --ch5-fg:#a5b4fc;
  --ch6-bg:#14273f; --ch6-fg:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  background-image:radial-gradient(60% 40% at 15% 0%,var(--bg-grad),transparent);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
/* ===== 顶栏 ===== */
header{
  position:sticky;top:0;z-index:100;
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:14px 20px;
}
.header-inner{max-width:920px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-size:19px;font-weight:800;white-space:nowrap;letter-spacing:.3px}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.search-box{flex:1 1 280px;position:relative}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.search-box input{
  width:100%;padding:11px 16px 11px 40px;
  border:1.5px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--text);font-size:15px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search-box input::placeholder{color:var(--text2);opacity:.7}
.icon-btn{
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:12px;padding:9px 13px;cursor:pointer;font-size:16px;
  transition:border-color .2s,transform .15s;
}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.h-btns{display:flex;gap:8px}
/* ===== 主体 ===== */
main{max-width:920px;margin:0 auto;padding:20px 20px 60px}
/* ===== 章节走廊（唯一分类） ===== */
.rail-wrap{position:relative;margin-bottom:16px}
.rail-label{font-size:12px;color:var(--text2);margin:0 2px 6px;display:flex;align-items:center;justify-content:space-between}
.rail{
  display:flex;gap:3px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 1px 8px;
  scrollbar-width:none;-ms-overflow-style:none;flex-wrap:wrap;
}
.rail::-webkit-scrollbar{display:none}
.rail-pill{
  flex-shrink:0;scroll-snap-align:start;border:1.5px solid var(--line);background:var(--card);
  color:var(--text2);border-radius:999px;padding:6px 7px;font-size:12px;cursor:pointer;
  transition:all .15s;font-weight:500;white-space:nowrap;
}
.rail-pill:hover{border-color:var(--accent);color:var(--accent)}
/* 章节按钮彩色（淡底深字；激活态被下方 .active 渐变覆盖） */
.rail-pill[data-ch="ch0"]{background:var(--ch0-bg);color:var(--ch0-fg)}
.rail-pill[data-ch="ch0"]:hover{background:color-mix(in srgb,var(--ch0-bg) 86%,var(--ch0-fg));border-color:var(--ch0-fg);color:var(--ch0-fg)}
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  .rail-pill[data-ch="ch0"]:hover{border-color:var(--ch0-fg);color:var(--ch0-fg)}
  .rail-pill[data-ch="ch1"]:hover{border-color:var(--ch1-fg);color:var(--ch1-fg)}
  .rail-pill[data-ch="ch2"]:hover{border-color:var(--ch2-fg);color:var(--ch2-fg)}
  .rail-pill[data-ch="ch3"]:hover{border-color:var(--ch3-fg);color:var(--ch3-fg)}
  .rail-pill[data-ch="ch4"]:hover{border-color:var(--ch4-fg);color:var(--ch4-fg)}
  .rail-pill[data-ch="ch5"]:hover{border-color:var(--ch5-fg);color:var(--ch5-fg)}
  .rail-pill[data-ch="ch6"]:hover{border-color:var(--ch6-fg);color:var(--ch6-fg)}
}
.rail-pill[data-ch="ch1"]{background:var(--ch1-bg);color:var(--ch1-fg)}
.rail-pill[data-ch="ch1"]:hover{background:color-mix(in srgb,var(--ch1-bg) 86%,var(--ch1-fg));border-color:var(--ch1-fg);color:var(--ch1-fg)}
.rail-pill[data-ch="ch2"]{background:var(--ch2-bg);color:var(--ch2-fg)}
.rail-pill[data-ch="ch2"]:hover{background:color-mix(in srgb,var(--ch2-bg) 86%,var(--ch2-fg));border-color:var(--ch2-fg);color:var(--ch2-fg)}
.rail-pill[data-ch="ch3"]{background:var(--ch3-bg);color:var(--ch3-fg)}
.rail-pill[data-ch="ch3"]:hover{background:color-mix(in srgb,var(--ch3-bg) 86%,var(--ch3-fg));border-color:var(--ch3-fg);color:var(--ch3-fg)}
.rail-pill[data-ch="ch4"]{background:var(--ch4-bg);color:var(--ch4-fg)}
.rail-pill[data-ch="ch4"]:hover{background:color-mix(in srgb,var(--ch4-bg) 86%,var(--ch4-fg));border-color:var(--ch4-fg);color:var(--ch4-fg)}
.rail-pill[data-ch="ch5"]{background:var(--ch5-bg);color:var(--ch5-fg)}
.rail-pill[data-ch="ch5"]:hover{background:color-mix(in srgb,var(--ch5-bg) 86%,var(--ch5-fg));border-color:var(--ch5-fg);color:var(--ch5-fg)}
.rail-pill[data-ch="ch6"]{background:var(--ch6-bg);color:var(--ch6-fg)}
.rail-pill[data-ch="ch6"]:hover{background:color-mix(in srgb,var(--ch6-bg) 86%,var(--ch6-fg));border-color:var(--ch6-fg);color:var(--ch6-fg)}
.rail-pill.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent;
  box-shadow:0 2px 8px rgba(79,110,247,.3);
}
.rail-select{
  flex-shrink:0;border:1.5px solid var(--line);background:var(--card);color:var(--text2);
  border-radius:999px;padding:5px 7px;font-size:12px;cursor:pointer;outline:none;
  transition:border-color .15s;max-width:150px;font-weight:500;
}
.rail-select:focus{border-color:var(--accent);color:var(--text)}
/* 键盘导航焦点样式 */
.rail-pill:focus-visible,.rail-select:focus-visible,.view-btn:focus-visible,.pg-btn:focus-visible,
.modal-nav button:focus-visible,.icon-btn:focus-visible,#backTop:focus-visible,
.modal-close:focus-visible,.scene-bar button:focus-visible,.page-size select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
/* 辨析功能新用户引导气泡 */
.tip-bubble{
  position:absolute;z-index:60;pointer-events:none;opacity:0;transition:opacity .3s;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;
  font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;
  box-shadow:0 4px 14px rgba(79,110,247,.35);white-space:nowrap;
  animation:tipBob 1.5s ease-in-out infinite;
}
.tip-bubble::after{
  content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--accent-deep);border-bottom:none;
}
.tip-bubble.tip-hide{opacity:0;animation:none}
@keyframes tipBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* 辨析卡片网格（「更多章节」→ 易混淆名词辨析） */
.conf-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:4px}
.conf-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 13px 11px;
  transition:border-color .18s,box-shadow .18s;
}
.conf-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}
.conf-head{display:flex;gap:7px;align-items:center}
.conf-side{
  flex:1;text-align:center;font-size:13px;font-weight:800;padding:8px 4px;
  background:var(--accent-soft);border-radius:8px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.conf-side+.conf-side{background:var(--tag-bg)}
.conf-vs{
  flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;
  font-size:9.5px;font-weight:800;letter-spacing:.3px;
}
.conf-desc{font-size:12.5px;color:var(--text2);margin-top:9px;line-height:1.7}
/* 场景筛选提示条（点卡片标签触发） */
.scene-bar{
  display:none;align-items:center;gap:8px;margin-bottom:14px;padding:10px 16px;
  background:linear-gradient(135deg,var(--accent-soft),var(--card));
  border:1px solid var(--line);border-radius:var(--radius);
  font-size:13px;color:var(--text);
}
.scene-bar.show{display:flex}
.scene-bar b{color:var(--accent)}
.scene-bar button{
  margin-left:auto;border:1.5px solid var(--line);background:var(--card);color:var(--text2);
  border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;transition:all .15s;
}
.scene-bar button:hover{border-color:var(--accent);color:var(--accent)}
/* 结果条 */
.summary{
  font-size:13px;color:var(--text2);margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.summary b{color:var(--accent);font-weight:800}
.summary .sum-num{font-size:15px}
.page-size{display:flex;align-items:center;gap:6px}
.page-size select{
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:8px;padding:4px 8px;font-size:12.5px;cursor:pointer;outline:none;
}
/* 视图切换（列表/卡片） */
.view-toggle{display:flex;gap:4px;background:var(--tag-bg);border-radius:9px;padding:3px}
.view-btn{border:none;background:transparent;color:var(--text2);border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:600;transition:all .15s}
.view-btn.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow-sm)}
/* 词条卡片（列表视图） */
.term-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px 14px 22px;margin-bottom:10px;cursor:pointer;
  transition:border-color .18s,box-shadow .18s,transform .18s;
  overflow:hidden;
}
.term-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));
  opacity:0;transition:opacity .18s;
}
.term-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.term-card:hover::before{opacity:1}
.term-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.term-name{font-size:16px;font-weight:700}
.term-name .en{font-weight:500;color:var(--text2);font-size:12.5px;margin-left:8px;letter-spacing:.4px}
.term-ch{font-size:11px;color:var(--text2);white-space:nowrap;flex-shrink:0;background:var(--tag-bg);padding:2px 8px;border-radius:6px}
.term-plain{font-size:14px;color:var(--text2);margin-top:5px}
.term-detail{
  display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
  animation:fadeIn .2s ease;
}
.term-card.open{box-shadow:var(--shadow-md)}
.term-card.open .term-detail{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.detail-row{font-size:13.5px;margin-bottom:9px}
.detail-row b{
  display:inline-block;min-width:2.6em;color:var(--accent);font-weight:700;
  margin-right:8px;font-size:12.5px;
}
.tags{display:inline-flex;gap:5px;margin-top:8px}
.tag{font-size:11px;background:var(--tag-bg);color:var(--tag-text);border-radius:6px;padding:2px 8px;font-weight:500;cursor:pointer;transition:box-shadow .15s,transform .15s}
.tag:hover{box-shadow:0 0 0 1.5px currentColor;transform:translateY(-1px)}
.tag.scene-面试{background:#eef2ff;color:#4f6ef7}
.tag.scene-升学科研{background:#f0fdf4;color:#16a34a}
.tag.scene-职场{background:#fff7ed;color:#ea580c}
.tag.scene-前沿{background:#fdf4ff;color:#c026d3}
.tag.scene-入门{background:#fef3c7;color:#a16207}
[data-theme="dark"] .tag.scene-面试{background:#232b4d;color:#9db0ff}
[data-theme="dark"] .tag.scene-升学科研{background:#173a2a;color:#4ade80}
[data-theme="dark"] .tag.scene-职场{background:#3d2a14;color:#fb923c}
[data-theme="dark"] .tag.scene-前沿{background:#341435;color:#e879f9}
[data-theme="dark"] .tag.scene-入门{background:#3d3313;color:#facc15}
/* ===== 卡片视图（知识卡片网格 + spotlight 光斑） ===== */
.spot{position:relative}
.spot::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(79,110,247,.09),transparent 65%);
}
.spot:hover::before{opacity:1}
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;position:relative;z-index:1}
.grid-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px 14px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow-sm);
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
.grid-card::before{
  content:"";position:absolute;left:0;top:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-deep));opacity:.85;
}
.grid-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-3px)}
.grid-card .term-name{font-size:15px;font-weight:800;display:block}
.grid-card .term-name .en{font-weight:500;color:var(--text2);font-size:11px;margin-left:6px;letter-spacing:.3px}
.grid-card .term-plain{font-size:13px;color:var(--text2);margin-top:7px;line-height:1.6}
.grid-card .term-ch{font-size:10.5px;color:var(--text2);position:absolute;top:15px;right:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-card .tags{margin-top:10px}
.grid-card .tags .tag{font-size:10.5px}
/* ===== 错峰入场 ===== */
.reveal{opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease;transition-delay:var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
/* ===== 词条弹层（旋转渐变边框） ===== */
@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}
.modal-mask{
  position:fixed;inset:0;background:rgba(13,17,32,.5);backdrop-filter:blur(4px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .16s ease;
}
.modal{
  position:relative;background:var(--card);border-radius:16px;
  max-width:720px;width:100%;max-height:88vh;overflow-y:auto;overflow-x:hidden;
  padding:28px 30px 24px;box-shadow:var(--shadow-lg);animation:popIn .18s ease;
  overflow-wrap:break-word;
}
.modal::before{
  content:"";position:absolute;inset:0;border-radius:16px;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--angle),transparent 0 70%,var(--accent) 82%,var(--accent-deep) 93%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;animation:spinAngle 6s linear infinite;z-index:-1;
}
@keyframes spinAngle{to{--angle:360deg}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal::before{animation:none}}
.modal-close{
  position:absolute;right:16px;top:16px;width:32px;height:32px;border:none;border-radius:8px;
  background:var(--tag-bg);color:var(--text2);font-size:15px;cursor:pointer;transition:all .15s;line-height:1;
}
.modal-close:hover{background:var(--accent-soft);color:var(--accent)}
.modal-term{font-size:21px;font-weight:800;padding-right:40px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.modal-term .en{font-size:13px;color:var(--text2);font-weight:500;letter-spacing:.5px}
.modal-meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.modal-ch{font-size:11.5px;color:var(--text2);background:var(--tag-bg);padding:3px 9px;border-radius:6px}
.modal-plain{font-size:15px;line-height:1.8;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.modal-rows .detail-row{font-size:14px;margin-bottom:11px}
.modal-rows .detail-row b{min-width:3em}
.modal-conf{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--text2)}
.modal-conf .mc-item{margin-top:8px;padding:9px 12px;background:var(--accent-soft);border-radius:10px;line-height:1.7}
.modal-conf .mc-item b{color:var(--accent);font-size:13.5px;margin-right:6px}
.modal-nav{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.modal-nav button{
  flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;transition:all .15s;
}
.modal-nav button:hover{border-color:var(--accent);color:var(--accent)}
.modal-nav button:disabled{opacity:.35;cursor:not-allowed}
/* 分页 */
.pagination{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin:22px 0 6px;flex-wrap:wrap;
}
.pg-btn{
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer;
  transition:all .15s;min-width:38px;text-align:center;
}
.pg-btn:hover:not(:disabled):not(.active){border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent}
.pg-btn:disabled{opacity:.38;cursor:not-allowed}
.pg-ellipsis{color:var(--text2);padding:0 2px}
.empty{
  text-align:center;color:var(--text2);padding:60px 0;
  font-size:14px;line-height:2;
}
.empty b{color:var(--accent)}
.hl{background:#fde68a;color:#1f2329;border-radius:3px;padding:0 1px}
[data-theme="dark"] .hl{background:#854d0e;color:#fef9c3}
/* 底部公众号卡片 */
footer{max-width:920px;margin:48px auto 0;padding:0 20px 60px}
.wx-card{
  position:relative;max-width:460px;margin:0 auto;
  background:linear-gradient(160deg,#f2fbf5,var(--card) 58%);
  border:1px solid var(--line);border-radius:18px;
  padding:22px 24px 20px;box-shadow:var(--shadow-sm);
  overflow:hidden;
}
[data-theme="dark"] .wx-card{background:linear-gradient(160deg,#10241a,#101418 62%)}
.wx-card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,#07c160,#10b981,transparent 85%);
}
.wx-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wx-ico{
  position:relative;width:36px;height:36px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,#07c160,#12b76a);
  box-shadow:0 4px 10px rgba(7,193,96,.35);
}
.wx-ico::before{
  content:"";position:absolute;left:7px;top:9px;width:22px;height:18px;
  background:#fff;border-radius:7px;
  background-image:radial-gradient(circle,#07c160 1.9px,transparent 2.3px);
  background-size:8px 8px;background-position:6px 5px,15px 5px;background-repeat:no-repeat;
}
.wx-ico::after{
  content:"";position:absolute;right:5px;bottom:5px;width:13px;height:11px;
  background:#fff;border-radius:5px;
  background-image:radial-gradient(circle,#07c160 1.7px,transparent 2.1px);
  background-size:7px 7px;background-position:3px 3px;background-repeat:no-repeat;
}
.wx-head b{font-size:16.5px;color:var(--text)}
.wx-tag{
  margin-left:auto;font-size:11px;color:#07c160;font-weight:600;
  background:rgba(7,193,96,.12);border:1px solid rgba(7,193,96,.35);
  padding:2px 9px;border-radius:99px;
}
.wx-desc{font-size:12.5px;line-height:1.8;color:var(--text2);margin:0 0 16px}
.wx-body{display:flex;align-items:center;gap:18px}
.wx-qr{
  width:108px;height:108px;flex:none;border-radius:12px;overflow:hidden;
  background:#fff;padding:6px;box-shadow:var(--shadow-sm);
  border:1px solid rgba(7,193,96,.25);
}
.wx-qr img{width:100%;height:100%;object-fit:contain;display:block}
.wx-hint{display:flex;flex-direction:column;gap:5px}
.wx-hint-main{font-size:14.5px;font-weight:600;color:var(--text)}
.wx-hint-sub{font-size:12px;color:var(--text2)}
.wx-hint-sub b{color:#07c160;font-weight:600}
.wx-card.no-qr .wx-qr{display:none}
.wx-note{margin-top:16px;text-align:center;font-size:11.5px;color:var(--text2);opacity:.7}
/* 轻提示 */
.toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(6px);
  background:#1f2329;color:#fff;padding:9px 18px;border-radius:99px;
  font-size:13px;z-index:200;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;box-shadow:var(--shadow-md);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[data-theme="dark"] .toast{background:#fff;color:#1f2329}
/* 打印 */
@media print{
  header,.rail-wrap,.scene-bar,.view-toggle,.pagination,#backTop,#modalMask,.tip-bubble,footer,.toast,.icon-btn{display:none!important}
  body{background:#fff;color:#000}
  main{max-width:none;padding:0}
  .summary{background:#fff;color:#000;border-color:#ddd;box-shadow:none}
  .term-card,.grid-card{border:none;box-shadow:none;background:#fff;color:#000;page-break-inside:avoid}
  .term-ch{color:#555;border-color:#ccc}
  .tag{display:none}
  .empty{background:#fff;border-color:#ddd;color:#333}
}
/* 回到顶部 */
#backTop{
  position:fixed;right:22px;bottom:26px;z-index:90;
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer;
  box-shadow:var(--shadow-md);display:none;transition:all .2s;
}
#backTop.show{display:block}
#backTop:hover{border-color:var(--accent);transform:translateY(-2px)}
/* 移动端 */
@media (max-width:640px){
  .summary{flex-direction:column;align-items:flex-start;gap:6px}
  .term-name{font-size:15px}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">计算机专业名词<span>大全</span></div>
    <div class="search-box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="搜词：并发 / MVCC / cxsj / suanfa" autocomplete="off">
    </div>
    <div class="h-btns">
      <button class="icon-btn" id="shareBtn" title="复制当前视图链接">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="切换主题">&#127769;</button>
    </div>
  </div>
</header>
<main>
  <div class="rail-wrap">
    <div class="rail-label">按章节 <span style="opacity:.7">悬停按钮可看完整标题；下拉可看剩余章节与易混淆辨析</span></div>
    <div class="rail" id="chapterRail">
      <button class="rail-pill active" data-ch="all">全部</button>
      <select class="rail-select" id="moreChapters" title="更多章节">
        <option value="all">更多章节 &#9662;</option>
      </select>
    </div>
  </div>

  <div class="scene-bar" id="sceneBar">
    <span>按场景筛选：<b id="sceneBarName"></b></span>
    <button id="sceneBarClear">&#10005; 清除</button>
  </div>

  <div class="summary" id="summary">
    <span id="summaryText"></span>
    <span style="display:flex;gap:10px;align-items:center">
      <span class="view-toggle" id="viewToggle" title="切换视图">
        <button class="view-btn" data-view="list">列表</button>
        <button class="view-btn active" data-view="grid">卡片</button>
      </span>
      <span class="page-size">每页
        <select id="pageSizeSelect">
          <option value="15" selected>15 条</option>
          <option value="30">30 条</option>
          <option value="50">50 条</option>
          <option value="0">全部</option>
        </select>
      </span>
    </span>
  </div>
  <div id="results" class="spot"></div>
  <div class="pagination" id="pagination"></div>
</main>
<div class="modal-mask" id="modalMask" style="display:none">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" title="关闭">&#10005;</button>
    <div id="modalBody"></div>
    <div class="modal-nav">
      <button id="modalPrev" title="上一个词条">&#8249; 上一个</button>
      <button id="modalNext" title="下一个词条">下一个 &#8250;</button>
    </div>
  </div>
</div>
<button id="backTop" title="回到顶部">&#8593;</button>
<footer>
  <div class="wx-card">
    <div class="wx-head">
      <span class="wx-ico" aria-hidden="true"></span>
      <b>计算机突围</b>
      <span class="wx-tag">公众号</span>
    </div>
    <p class="wx-desc">专注计算机专业学习规划、求职、考研、公考、职业发展规划，结合亲身经历，持续分享真实思路和实用经验方法，欢迎关注！</p>
    <div class="wx-body">
      <div class="wx-qr"><img id="wxQr" alt="「计算机突围」公众号二维码" src="__WXQR__"></div>
      <div class="wx-hint">
        <span class="wx-hint-main">微信扫码，立刻关注</span>
        <span class="wx-hint-sub">或搜索公众号 <b>「计算机突围」</b></span>
      </div>
    </div>
  </div>
  <div class="wx-note">本页词条均整理自公开资料 · 发现错漏欢迎在公众号「计算机突围」留言指正</div>
</footer>
<div class="toast" id="toast"></div>
<script id="appData" type="application/json">__DATA__</script>
</body>
</html>
