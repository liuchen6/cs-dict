n","searchText":"cnn（卷积神经网络）  专门处理网格数据（如图像）的神经网络，用卷积核提取局部特征 就像用放大镜在图片上滑动看，先看边缘纹理，再看眼睛鼻子，最后认出来是猫 经典cnn：lenet→alexnet→vgg→googlenet→resnet。resnet的残差连接让深度网络能训练到上百层"},{"id":"t0377","term":"RNN/LSTM","en":null,"chapter":"ch9","section":null,"plain":"处理序列数据（文本、时间序列）的循环网络，LSTM解决了长序列遗忘问题","analogy":"就像读书，看到第三句时记得第一句说了什么","tip":"RNN已逐渐被Transformer取代，但LSTM在某些小数据时序场景还有用","level":2,"tags":[],"py":"rnnl","pyFull":"rnnlstm","searchText":"rnn/lstm  处理序列数据（文本、时间序列）的循环网络，lstm解决了长序列遗忘问题 就像读书，看到第三句时记得第一句说了什么 rnn已逐渐被transformer取代，但lstm在某些小数据时序场景还有用"},{"id":"t0378","term":"Transformer","en":null,"chapter":"ch9","section":null,"plain":"基于自注意力机制的架构，现在NLP/CV/语音都是Transformer的天下","analogy":"就像读文章时，每个词都注意到其他所有词，重点关注相关的词","tip":"Transformer是GPT/BERT/ViT等所有大模型的基础架构，必须深入理解","level":2,"tags":[],"py":"tran","pyFull":"transformer","searchText":"transformer  基于自注意力机制的架构，现在nlp/cv/语音都是transformer的天下 就像读文章时，每个词都注意到其他所有词，重点关注相关的词 transformer是gpt/bert/vit等所有大模型的基础架构，必须深入理解"},{"id":"t0379","term":"注意力机制（Attention）","en":null,"chapter":"ch9","section":null,"plain":"让模型在处理每个位置时动态关注输入中最相关的部分","analogy":"就像看一幅画，你不会均匀看每个像素，而是重点看脸和关键物体","tip":"注意力权重就是「关注度」，权重越高越关注。自注意力（Self-Attention）是序列内部互相关注","level":2,"tags":[],"py":"zhuy","pyFull":"zhuyilijizhi","searchText":"注意力机制（attention）  让模型在处理每个位置时动态关注输入中最相关的部分 就像看一幅画，你不会均匀看每个像素，而是重点看脸和关键物体 注意力权重就是「关注度」，权重越高越关注。自注意力（self-attention）是序列内部互相关注"},{"id":"t0380","term":"GPT","en":null,"chapter":"ch9","section":null,"plain":"Generative Pre-trained Transformer，生成式预训练模型，用自回归方式预测下一个token","analogy":"就像超级智能的「词语接龙」，给个开头，它按概率一个词一个词往下接","tip":"GPT-1/2/3/4/o1/o3一路进化，参数从亿级到万亿级，能力从文本生成到推理/多模态","level":2,"tags":[],"py":"gpt","pyFull":"gpt","searchText":"gpt  generative pre-trained transformer，生成式预训练模型，用自回归方式预测下一个token 就像超级智能的「词语接龙」，给个开头，它按概率一个词一个词往下接 gpt-1/2/3/4/o1/o3一路进化，参数从亿级到万亿级，能力从文本生成到推理/多模态"},{"id":"t0381","term":"大语言模型（LLM）","en":null,"chapter":"ch9","section":null,"plain":"参数规模巨大的Transformer语言模型，通过海量文本预训练获得通用能力","analogy":"就像读了互联网上所有文字的「超级学霸」，什么话题都能聊，但不一定都对","tip":"LLM能力包括：语言理解、文本生成、代码编写、逻辑推理、知识问答","level":2,"tags":[],"py":"dayu","pyFull":"dayuyanmoxing","searchText":"大语言模型（llm）  参数规模巨大的transformer语言模型，通过海量文本预训练获得通用能力 就像读了互联网上所有文字的「超级学霸」，什么话题都能聊，但不一定都对 llm能力包括：语言理解、文本生成、代码编写、逻辑推理、知识问答"},{"id":"t0382","term":"预训练（Pre-training）","en":null,"chapter":"ch9","section":null,"plain":"先用海量通用数据训练一个基础模型，学习通用语言/世界知识","analogy":"就像上大学通识课，什么都学一点，打基础","tip":"预训练成本极高（GPT-4训练成本超1亿美元），所以大家都在开源预训练模型基础上做","level":2,"tags":[],"py":"yuxu","pyFull":"yuxunlian","searchText":"预训练（pre-training）  先用海量通用数据训练一个基础模型，学习通用语言/世界知识 就像上大学通识课，什么都学一点，打基础 预训练成本极高（gpt-4训练成本超1亿美元），所以大家都在开源预训练模型基础上做"},{"id":"t0383","term":"微调（Fine-tuning）","en":null,"chapter":"ch9","section":null,"plain":"在预训练模型基础上，用特定领域数据继续训练，适配具体任务","analogy":"就像大学毕业后的职业培训，有了通识基础，再学专业技能","tip":"全参数微调成本高，现在常用LoRA/QLoRA等参数高效微调（PEFT）","level":2,"tags":[],"py":"weit","pyFull":"weitiao","searchText":"微调（fine-tuning）  在预训练模型基础上，用特定领域数据继续训练，适配具体任务 就像大学毕业后的职业培训，有了通识基础，再学专业技能 全参数微调成本高，现在常用lora/qlora等参数高效微调（peft）"},{"id":"t0384","term":"Prompt","en":null,"chapter":"ch9","section":null,"plain":"给大模型的输入指令，Prompt的写法直接影响输出质量","analogy":"就像给下属布置任务，说清楚要什么、怎么要、什么格式，结果好很多","tip":"Prompt Engineering是2023-2025年的热门技能，但随着模型变强会越来越不重要","level":2,"tags":[],"py":"prom","pyFull":"prompt","searchText":"prompt  给大模型的输入指令，prompt的写法直接影响输出质量 就像给下属布置任务，说清楚要什么、怎么要、什么格式，结果好很多 prompt engineering是2023-2025年的热门技能，但随着模型变强会越来越不重要"},{"id":"t0385","term":"Token","en":null,"chapter":"ch9","section":null,"plain":"大模型处理文本的基本单位，不是一个字也不是一个词，而是子词","analogy":"就像拼音偏旁，「计算机」可能被分成「计算」和「机」两个token","tip":"1个汉字约1-2个token，1个英文单词约1-3个token。上下文窗口大小就是能处理的token数","level":2,"tags":[],"py":"toke","pyFull":"token","searchText":"token  大模型处理文本的基本单位，不是一个字也不是一个词，而是子词 就像拼音偏旁，「计算机」可能被分成「计算」和「机」两个token 1个汉字约1-2个token，1个英文单词约1-3个token。上下文窗口大小就是能处理的token数"},{"id":"t0386","term":"上下文窗口","en":null,"chapter":"ch9","section":null,"plain":"模型一次能「看到」的最大token数量，决定了能处理多长的文本","analogy":"就像人的短期记忆，窗口内能记住所有内容，窗口外就忘了","tip":"2026年主流模型窗口：GPT-4o是128K，Claude 3.5是200K，部分模型支持1M+（约75万字）","level":2,"tags":[],"py":"shan","pyFull":"shangxiawenchuangkou","searchText":"上下文窗口  模型一次能「看到」的最大token数量，决定了能处理多长的文本 就像人的短期记忆，窗口内能记住所有内容，窗口外就忘了 2026年主流模型窗口：gpt-4o是128k，claude 3.5是200k，部分模型支持1m+（约75万字）"},{"id":"t0387","term":"生成式AI（AIGC）","en":null,"chapter":"ch9","section":null,"plain":"能自动生成新内容的AI：生成文本、图片、视频、代码、音乐","analogy":"就像AI当创作者，不是只会回答问题，还能画画、写文章、做视频","tip":"AIGC代表：ChatGPT（文本）、Midjourney/Stable Diffusion（图片）、Sora/可灵（视频）、Suno（音乐）","level":2,"tags":[],"py":"shen","pyFull":"shengchengshiai","searchText":"生成式ai（aigc）  能自动生成新内容的ai：生成文本、图片、视频、代码、音乐 就像ai当创作者，不是只会回答问题，还能画画、写文章、做视频 aigc代表：chatgpt（文本）、midjourney/stable diffusion（图片）、sora/可灵（视频）、suno（音乐）"},{"id":"t0388","term":"RAG（检索增强生成）","en":null,"chapter":"ch9","section":null,"plain":"让大模型先从知识库搜相关资料，再基于资料回答，减少幻觉","analogy":"就像开卷考试，先翻书找到相关内容，再结合书本内容答题","tip":"RAG是2024-2026年企业AI应用最主流的方案，成本低、可更新、可溯源","level":2,"tags":[],"py":"rag","pyFull":"rag","searchText":"rag（检索增强生成）  让大模型先从知识库搜相关资料，再基于资料回答，减少幻觉 就像开卷考试，先翻书找到相关内容，再结合书本内容答题 rag是2024-2026年企业ai应用最主流的方案，成本低、可更新、可溯源"},{"id":"t0389","term":"AI Agent（智能体）","en":null,"chapter":"ch9","section":null,"plain":"能自主感知环境、规划任务、调用工具、执行动作完成目标的AI系统","analogy":"就像一个AI实习生，你给个目标「帮我订下周三去北京的机票」，它自己查时间、比价、订票","tip":"Agent核心模块：规划（Planning）、记忆（Memory）、工具调用（Tool Use）、行动（Action）","level":2,"tags":[],"py":"aiag","pyFull":"aiagent","searchText":"ai agent（智能体）  能自主感知环境、规划任务、调用工具、执行动作完成目标的ai系统 就像一个ai实习生，你给个目标「帮我订下周三去北京的机票」，它自己查时间、比价、订票 agent核心模块：规划（planning）、记忆（memory）、工具调用（tool use）、行动（action）"},{"id":"t0390","term":"MCP（Model Context Protocol）","en":null,"chapter":"ch9","section":null,"plain":"模型上下文协议，让AI模型能统一调用各种工具和数据源的开放协议","analogy":"就像AI的「USB接口标准」，以前每个工具要单独适配，现在统一接口插上就能用","tip":"MCP由Anthropic提出，2025-2026年快速普及，是AI Agent环境的基础设施","level":2,"tags":[],"py":"mcp","pyFull":"mcp","searchText":"mcp（model context protocol）  模型上下文协议，让ai模型能统一调用各种工具和数据源的开放协议 就像ai的「usb接口标准」，以前每个工具要单独适配，现在统一接口插上就能用 mcp由anthropic提出，2025-2026年快速普及，是ai agent环境的基础设施"},{"id":"t0391","term":"A2A（Agent-to-Agent）","en":null,"chapter":"ch9","section":null,"plain":"智能体之间互相通信协作的协议，让多个Agent分工合作","analogy":"就像公司里部门间协作，每个Agent负责一块，互相发消息配合完成大任务","tip":"Google提出的Agent互操作协议，是多Agent系统的关键标准","level":2,"tags":[],"py":"aa","pyFull":"aa","searchText":"a2a（agent-to-agent）  智能体之间互相通信协作的协议，让多个agent分工合作 就像公司里部门间协作，每个agent负责一块，互相发消息配合完成大任务 google提出的agent互操作协议，是多agent系统的关键标准"},{"id":"t0392","term":"幻觉（Hallucination）","en":null,"chapter":"ch9","section":null,"plain":"大模型一本正经地编造不存在的事实、数据、引用","analogy":"就像一个人吹牛不打草稿，说得头头是道，但可能全是编的","tip":"幻觉是大模型的核心缺陷之一，RAG、事实核查、思维链能缓解但不能完全解决","level":2,"tags":[],"py":"huan","pyFull":"huanjue","searchText":"幻觉（hallucination）  大模型一本正经地编造不存在的事实、数据、引用 就像一个人吹牛不打草稿，说得头头是道，但可能全是编的 幻觉是大模型的核心缺陷之一，rag、事实核查、思维链能缓解但不能完全解决"},{"id":"t0393","term":"思维链（CoT）","en":null,"chapter":"ch9","section":null,"plain":"让大模型「一步步想」的推理技术，显著提升数学/逻辑/推理题正确率","analogy":"就像做数学题要写步骤，不要直接给答案，把推理过程写出来正确率更高","tip":"「Let's think step by step」就是最简单的CoT提示。o1/o3等推理模型内置了长思维链","level":2,"tags":[],"py":"siwe","pyFull":"siweilian","searchText":"思维链（cot）  让大模型「一步步想」的推理技术，显著提升数学/逻辑/推理题正确率 就像做数学题要写步骤，不要直接给答案，把推理过程写出来正确率更高 「let's think step by step」就是最简单的cot提示。o1/o3等推理模型内置了长思维链"},{"id":"t0394","term":"MoE（混合专家模型）","en":null,"chapter":"ch9","section":null,"plain":"模型有多个「专家」子网络，每次推理只激活部分专家，用稀疏方式扩参数","analogy":"就像医院会诊，不是所有医生都来看病，而是根据病情派相关的几个专家","tip":"GPT-4、Claude、DeepSeek-V3、Llama 4都用MoE架构，参数大但推理成本相对低","level":2,"tags":[],"py":"moe","pyFull":"moe","searchText":"moe（混合专家模型）  模型有多个「专家」子网络，每次推理只激活部分专家，用稀疏方式扩参数 就像医院会诊，不是所有医生都来看病，而是根据病情派相关的几个专家 gpt-4、claude、deepseek-v3、llama 4都用moe架构，参数大但推理成本相对低"},{"id":"t0395","term":"多模态（Multimodal）","en":null,"chapter":"ch9","section":null,"plain":"模型能同时处理和理解多种类型数据：文本、图片、视频、音频、代码","analogy":"就像人能看能听能说，不是只会读书，还能看图、听声音、看视频","tip":"GPT-4o、Gemini、Claude 3.5都是多模态模型，能看图说话、看图写代码、视频理解","level":2,"tags":[],"py":"duom","pyFull":"duomotai","searchText":"多模态（multimodal）  模型能同时处理和理解多种类型数据：文本、图片、视频、音频、代码 就像人能看能听能说，不是只会读书，还能看图、听声音、看视频 gpt-4o、gemini、claude 3.5都是多模态模型，能看图说话、看图写代码、视频理解"},{"id":"t0396","term":"Embedding（嵌入/向量化）"," :"shujucangku","searchText":"数据仓库（dw）  专门用于分析决策的数据库，存历史结构化数据，支持olap查询 就像图书馆，按主题归档，用来查阅研究不用来日常借还 数据仓库是olap（分析），业务数据库是oltp（事务）。hive、snowflake、bigquery"},{"id":"t0472","term":"ETL","en":null,"chapter":"ch13","section":null,"plain":"Extract（抽取）→Transform（转换）→Load（加载），数据处理的流水线","analogy":"就像食材处理，从菜市场采购（抽取）→洗切配（转换）→放进冰箱/上菜（加载）","tip":"ETL是数据工程师的日常，工具有DataX、Sqoop、Airflow、dbt","level":2,"tags":[],"py":"etl","pyFull":"etl","searchText":"etl  extract（抽取）→transform（转换）→load（加载），数据处理的流水线 就像食材处理，从菜市场采购（抽取）→洗切配（转换）→放进冰箱/上菜（加载） etl是数据工程师的日常，工具有datax、sqoop、airflow、dbt"},{"id":"t0473","term":"Hadoop","en":null,"chapter":"ch13","section":null,"plain":"大数据环境的基础框架：HDFS（分布式存储）+MapReduce（分布式计算）+YARN（调度）","analogy":"就像大数据界的操作系统，提供存储和计算的基础能力","tip":"Hadoop是第一代大数据框架，现在计算层基本用Spark/Flink了","level":2,"tags":[],"py":"hado","pyFull":"hadoop","searchText":"hadoop  大数据环境的基础框架：hdfs（分布式存储）+mapreduce（分布式计算）+yarn（调度） 就像大数据界的操作系统，提供存储和计算的基础能力 hadoop是第一代大数据框架，现在计算层基本用spark/flink了"},{"id":"t0474","term":"Spark","en":null,"chapter":"ch13","section":null,"plain":"基于内存的分布式计算引擎，比MapReduce快10-100倍","analogy":"就像在灶台上做菜，食材就在手边（内存），不用每次跑仓库拿（磁盘）","tip":"Spark支持批处理、流处理（Spark Streaming）、SQL、机器学习，是大数据标配","level":2,"tags":[],"py":"spar","pyFull":"spark","searchText":"spark  基于内存的分布式计算引擎，比mapreduce快10-100倍 就像在灶台上做菜，食材就在手边（内存），不用每次跑仓库拿（磁盘） spark支持批处理、流处理（spark streaming）、sql、机器学习，是大数据标配"},{"id":"t0475","term":"Flink","en":null,"chapter":"ch13","section":null,"plain":"真正的流计算引擎，实时处理数据流，低延迟高吞吐","analogy":"就像自来水处理，水流进来实时净化，不是攒一桶再处理","tip":"Flink是实时计算首选，双11实时大屏、实时推荐、风控都用Flink","level":2,"tags":[],"py":"flin","pyFull":"flink","searchText":"flink  真正的流计算引擎，实时处理数据流，低延迟高吞吐 就像自来水处理，水流进来实时净化，不是攒一桶再处理 flink是实时计算首选，双11实时大屏、实时推荐、风控都用flink"},{"id":"t0476","term":"Kafka","en":null,"chapter":"ch13","section":null,"plain":"高吞吐分布式消息队列/日志收集系统，大数据管道","analogy":"就像数据的高速公路，各种数据都在Kafka上传输","tip":"Kafka吞吐极高（百万级/s），作为数据总线连接各种系统","level":2,"tags":[],"py":"kafk","pyFull":"kafka","searchText":"kafka  高吞吐分布式消息队列/日志收集系统，大数据管道 就像数据的高速公路，各种数据都在kafka上传  sd 卡全用它们。看接口名字能判断用什么时序"},{"id":"t0539","term":"ADC","en":null,"chapter":"ch16","section":null,"plain":"模数转换：把电压模拟量变成数字量","analogy":"就像温度计：把体温（连续）变成 36.5（数字）","tip":"读传感器必经之路。反过来 DAC 是数字转模拟","level":2,"tags":[],"py":"adc","pyFull":"adc","searchText":"adc  模数转换：把电压模拟量变成数字量 就像温度计：把体温（连续）变成 36.5（数字） 读传感器必经之路。反过来 dac 是数字转模拟"},{"id":"t0540","term":"RTOS","en":null,"chapter":"ch16","section":null,"plain":"实时操作系统：保证「说好什么时候响应就什么时候响应」","analogy":"就像急诊室：病人进来必须马上处理，不能排队","tip":"FreeRTOS、μC/OS 是代表。嵌入式开发与桌面开发的分水岭","level":2,"tags":[],"py":"rtos","pyFull":"rtos","searchText":"rtos  实时操作系统：保证「说好什么时候响应就什么时候响应」 就像急诊室：病人进来必须马上处理，不能排队 freertos、μc/os 是代表。嵌入式开发与桌面开发的分水岭"},{"id":"t0541","term":"交叉编译","en":null,"chapter":"ch16","section":null,"plain":"在 PC 上编译出 ARM/单片机才能跑的程序","analogy":"就像在 A 国用 B 国的语言写书，印刷出来给 B 国人读","tip":"开发板不能装编译器，都在 PC 上交叉编译再烧录","level":2,"tags":[],"py":"jiao","pyFull":"jiaochabianyi","searchText":"交叉编译  在 pc 上编译出 arm/单片机才能跑的程序 就像在 a 国用 b 国的语言写书，印刷出来给 b 国人读 开发板不能装编译器，都在 pc 上交叉编译再烧录"},{"id":"t0542","term":"光栅化","en":null,"chapter":"ch16","section":null,"plain":"把三角形等几何图形「铺」成屏幕像素","analogy":"就像用马赛克拼出画面：把形状变成一个个小方块","tip":"GPU 渲染的最基本动作，游戏、前端 canvas 都绕不开","level":2,"tags":[],"py":"guan","pyFull":"guangshanhua","searchText":"光栅化  把三角形等几何图形「铺」成屏幕像素 就像用马赛克拼出画面：把形状变成一个个小方块 gpu 渲染的最基本动作，游戏、前端 canvas 都绕不开"},{"id":"t0543","term":"渲染管线","en":null,"chapter":"ch16","section":null,"plain":"3D 场景变成 2D 画面的整条流水线","analogy":"就像动画片制作流水线：建模→打光→贴图→合成","tip":"理解 GPU 与 OpenGL/WebGL 的总框架，图形学核心概念","level":2,"tags":[],"py":"xuan","pyFull":"xuanranguanxian","searchText":"渲染管线  3d 场景变成 2d 画面的整条流水线 就像动画片制作流水线：建模→打光→贴图→合成 理解 gpu 与 opengl/webgl 的总框架，图形学核心概念"},{"id":"t0544","term":"Z-Buffer","en":null,"chapter":"ch16","section":null,"plain":"深度缓冲：判断「谁挡着谁」，画得对不对全靠它","analogy":"就像画家先画远的再画近的，Z-Buffer 自动解决遮挡","tip":"光栅化正确性的核心机制，面试图形学入门第一问","level":2,"tags":[],"py":"zbuf","pyFull":"zbuffer","searchText":"z-buffer  深度缓冲：判断「谁挡着谁」，画得对不对全靠它 就像画家先画远的再画近的，z-buffer 自动解决遮挡 光栅化正确性的核心机制，面试图形学入门第一问"},{"id":"t0545","term":"着色器（Shader）","en":null,"chapter":"ch16","section":null,"plain":"跑在 GPU 上的小段程序，决定每个像素/顶点长什么样","analogy":"就像给画上色的「滤镜程序」","tip":"游戏、WebGL、Three.js 高频词。顶点着色器+片元着色器","level":2,"tags":[],"py":"zhuo","pyFull":"zhuoseqi","searchText":"着色器（shader）  跑在 gpu 上的小段程序，决定每个像素/顶点长什么样 就像给画上色的「滤镜程序」 游戏、webgl、three.js 高频词。顶点着色器+片元着色器"},{"id":"t0546","term":"贝塞尔曲线","en":null,"chapter":"ch16","section":null,"plain":"用几个控制点拉出的平滑曲线","analogy":"就像 PS 里的钢笔工具拖出的曲线","tip":"字体渲染、矢量图、建模的基础数学。前端 SVG/Canvas 天天见","level":2,"tags":[],"py":"beis","pyFull":"beisaierquxian","searchText":"贝塞尔曲线  用几个控制点拉出的平滑曲线 就像 ps 里的钢笔工具拖出的曲线 字体渲染、矢量图、建模的基础数学。前端 svg/canvas 天天见"},{"id":"t0547","term":"编译器（Compiler）","en":null,"chapter":"ch17","section":null,"plain":"把高级语言源代码整体翻译成机器码/可执行文件的程序","analogy":"就像翻译整本书，翻完才能读，读起来快","tip":"与「解释器」相对：编译器一次性翻译（C/C++/Go），解释器边读边执行（Python/JS）。编译器=工厂，解释器=同声传译","level":2,"tags":[],"py":"bian","pyFull":"bianyiqi","searchText":"编译器（compiler）  把高级语言源代码整体翻译成机器码/可执行文件的程序 就像翻译整本书，翻完才能读，读起来快 与「解释器」相对：编译器一次性翻译（c/c++/go），解释器边读边执行（python/js）。编译器=工厂，解释器=同声传译"},{"id":"t0548","term":"词法分析（Lexical Analysis）","en":null,"chapter":"ch17","section":null,"plain":"把源代码从头到尾切成一个个「单词」（Token）：关键字、变量名、数字、运算符","analogy":"就像把一篇文章按词切开：你/把/文章/按/词/切开","tip":"流水线第一站。切出来的「单词」叫 Token，每个 Token 带类型（如「标识符」「数字」「运算符」）","level":2,"tags":[],"py":"cifa","pyFull":"cifafenxi","searchText":"词法分析（lexical analysis）  把源代码从头到尾切成一个个「单词」（token）：关键字、变量名、数字、运算符 就像把一篇文章按词切开：你/把/文章/按/词/切开 流水线第一站。切出来的「单词」叫 token，每个 token 带类型（如「标识符」「数字」「运算符」）"},{"id":"t0549","term":"正规式与有限自动机","en":null,"chapter":"ch17","section":null,"plain":"用规则（正则表达式）描述单词形态，用状态机（NFA/DFA）识别它们","analogy":"就像用「查户口模板」认字：符合模板的就收进名单","tip":"正则表达式的数学理论来源。DFA=确定型有限自动机，NFA=非确定型。考试常考构造 NFA/DFA","level":2,"tags":[],"py":"zhen","pyFull":"zhengguishiyuyouxianzidongji","searchText":"正规式与有限自动机  用规则（正则表达式）描述单词形态，用状态机（nfa/dfa）识别它们 就像用「查户口模板」认字：符合模板的就收进名单 正则表达式的数学理论来源。dfa=确定型有限自动机，nfa=非确定型。考试常考构造 nfa/dfa"},{"id":"t0550","term":"语法分析（Parsing）","en":null,"chapter":"ch17","section":null,"plain":"按文法规则把 Token 串组装成语法结构树，判断程序「句子」合不合法","analogy":"就像按语法检查句子：动词跟着主语、宾语放对位置","tip":"核心章节，分自顶向下（LL）和自底向上（LR）两大流派，考试重点","level":2,"tags":[],"py":"yufa","pyFull":"yufafenxi","searchText":"语法分析（parsing）  按文法规则把 token 串组装成语法结构树，判断程序「句子」合不合法 就像按语法检查句子：动词跟着主语、宾语放对位置 核心章节，分自顶向下（ll）和自底向上（lr）两大流派，考试重点"},{"id":"t0551","term":"抽象语法树（AST）","en":null,"chapter":"ch17","section":null,"plain":"源代码结构的树形表示，每棵树节点对应一个语法结构","analogy":"就像用树状图画出句子的主谓宾结构","tip":"前端工程化高频词：Babel、ESLint、TypeScript 编译器都靠 AST 工作。写代码时「树」无处不在","level":2,"tags":[],"py":"chou","pyFull":"chouxiangyufashu","searchText":"抽象语法树（ast）  源代码结构的树形表示，每棵树节点对应一个语法结构 就像用树状图画出句子的主谓宾结构 前端工程化高频词：babel、eslint、typescript 编译器都靠 ast 工作。写代码时「树」无处不在"},{"id":"t0552","term":"文法（Grammar）/上下文无关文法（CFG）","en":null,"chapter":"ch17","section":null,"plain":"定义一门语言「什么样的句子合法」的规则集","analogy":"就像一门语言的语法书：主语+谓语+宾语组成合法句","tip":"理论地基。术语：终结符（具体词）、非终结符（语法成分）、产生式（规则条）","level":2,"tags":[],"py":"wenf","pyFull":"wenfashangxiawenwuguanwenfa","searchText":"文法（grammar）/上下文无关文法（cfg）  定义一门语言「什么样的句子合法」的规则集 就像一门语言的语法书：主语+谓语+宾语组成合法句 理论地基。术语：终结符（具体词）、非终结符（语法成分）、产生式（规则条）"},{"id":"t0553","term":"LL(1)分析/递归下降","en":null,"chapter":"ch17","section":null,"plain":"自上而下、按文法从左到右推导的语法分析方法","analogy":"就像顺着大纲逐层展开：先到章、再到节、再到段","tip":"手写解析器（parser）的基本方法，工程常用。递归下降=每个语法成分一个函数","level":2,"tags":[],"py":"llfe","pyFull":"llfenxidiguixiajiang","searchText":"ll(1)分析/递归下降  自上而下、按文法从左到右推导的语法分析方法 就像顺着大纲逐层展开：先到章、再到节、再到段 手写解析器（parser）的基本方法，工程常用。递归下降=每个语法成分一个函数"},{"id":"t0554","term":"语法制导翻译（SDT）","en":null,"chapter":"ch17","section":null,"plain":"边做语法分析边顺手生成中间代码/执行动作","analogy":"就像边点名边登记：点到一个名字，同时记下他的座位","tip":"「边分析边翻译」的机制，考试章节。语义分析（类型检查）也属于这阶段","level":2,"tags":[],"py":"yufa","pyFull":"yufazhidaofanyi","searchText":"语法制导翻译（sdt）  边做语法分析边顺手生成中间代码/执行动作 就像边点名边登记：点到一个名字，同时记下他的座位 「边分析边翻译」的机制，考试章节。语义分析（类型检查）也属于这阶段"},{"id":"t0555","term":"符号表（Symbol Table）","en":null,"chapter":"ch17","section":null,"plain":"编译器随身携带的「变量档案本」：每个变量/函数的名字、类型、作用域","analogy":"就像班级花名册：姓名、学号、座位，随查随改","tip":"各阶段共用的数据结构。作用域嵌套时，符号表也用栈/树管理","level":2,"tags":[],"py":"fuha","pyFull":"fuhaobiao","searchText":"符号表（symbol table）  编译器随身携带的「变量档案本」：每个变量/函数的名字、类型、作用域 就像班级花名册：姓名、学号、座位，随查随改 各阶段共用的数据结构。作用域嵌套时，符号表也用栈/树管理"},{"id":"t0556","term":"中间代码（IR）","en":null,"chapter":"ch17","section":null,"plain":"源代码和目标代码之间的中间表示，编译器前后端的分界点","analogy":"就像译文底稿：读懂原文后先写一版中间稿，再改写成目标语言","tip":"常见 IR：三地址代码、SSA（静态单赋值）。有了 IR，同一份前端代码可以适配多种目标架构","level":2,"tags":[],"py":"zhon","pyFull":"zhongjiandaima","searchText":"中间代码（ir）  源代码和目标代码之间的中间表示，编译器前后端的分界点 就像译文底稿：读懂原文后先写一版中间稿，再改写成目标语言 常见 ir：三地址代码、ssa（静态单赋值）。有了 ir，同一份前端代码可以适配多种目标架构"},{"id":"t0557","term":"代码优化（Optimization）","en":null,"chapter":"ch17","section":null,"plain":"在不改变结果的前提下把代码改快改小：删冗余、提公共子表达式","analogy":"就像演讲稿润色：意思不变，删废话、换精炼表达","tip":"面试常见问法：「编译器怎么优化循环？」（循环展开、向量化、常量折叠）","level":2,"tags":[],"py":"daim","pyFull":"daimayouhua","searchText":"代码优化（optimization）  在不改变结果的前提下把代码改快改小：删冗余、提公共子表达式 就像演讲稿润色：意思不变，删废话、换精炼表达 面试常见问法：「编译器怎么优化循环？」（循环展开、向量化、常量折叠）"},{"id":"t0558","term":"目标代码生成（Code Generation）","en":null,"chapter":"ch17","section":null,"plain":"把中间代码翻译成目标机器（x86/ARM）能跑的指令","analogy":"就像把底稿改写成方言：同一意思，不同地区说法不同","tip":"要考虑寄存器分配、指令选择。现代编译器通常生成汇编再由汇编器转机器码","level":2,"tags":[],"py":"mubi","pyFull":"mubiaodaimashengcheng","searchText":"目标代码生成（code generation）  把中间代码翻译成目标机器（x86/arm）能跑的指令 就像把底稿改写成方言：同一意思，不同地区说法不同 要考虑寄存器分配、指令选择。现代编译器通常生成汇编再由汇编器转机器码"},{"id":"t0559","term":"解释器（Interpreter）","en":null,"chapter":"ch17","section":null,"plain":"边读源代码边执行，不预先生成可执行文件","analogy":"就像同声传译，说一句翻一句","tip":"与编译器区分：解释执行慢但开发快、跨平台容易。Python/JS/Java（JVM字节码）都是解释/混合执行","level":2,"tags":[],"py":"jies","pyFull":"jieshiqi","searchText":"解释器（interpreter）  边读源代码边执行，不预先生成可执行文件 就像同声传译，说一句翻一句 与编译器区分：解释执行慢但开发快、跨平台容易。python/js/java（jvm字节码）都是解释/混合执行"},{"id":"t0560","term":"JIT（即时编译）","en":null,"chapter":"ch17","section":null,"plain":"程序运行时把热点代码临时编译成机器码再执行","analogy":"就像外卖提前把常点的菜备好，点单秒出","tip":"Java JVM、JavaScript V8、Go 都有 JIT。原理：先解释执行+统计热点，热代码再编译成机器码加速","level":2,"tags":[],"py":"jit","pyFull":"jit","searchText":"jit（即时编译）  程序运行时把热点代码临时编译成机器码再执行 就像外卖提前把常点的菜备好，点单秒出 java jvm、javascript v8、go 都有 jit。原理：先解释执行+统计热点，热代码再编译成机器码加速"},{"id":"t0561","term":"前端/后端（编译器）","en":null,"chapter":"ch17","section":null,"plain":"编译器的前半段（词法→语法→语义→IR）和后半段（优化→生成）","analogy":"就像餐厅的前厅（接单配菜）和后厨（烹饪出菜）","tip":"注意和「Web前端后端」不是一回事！编译器前后端通过 IR 解耦","level":2,"tags":[],"py":"qian","pyFull":"qianduanhouduan","searchText":"前端/后端（编译器）  编译器的前半段（词法→语法→语义→ir）和后半段（优化→生成） 就像餐厅的前厅（接单配菜）和后厨（烹饪出菜） 注意和「web前端后端」不是一回事！编译器前后端通过 ir 解耦"},{"id":"t0562","term":"命题与联结词","en":null,"chapter":"ch18","section":null,"plain":"能判断真假的陈述句，以及「且/或/非/如果…那么」这些连接词","analogy":"就像开关电路：每个灯泡（命题）有亮/灭两种状态，串联并联（联结词）组合","tip":"逻辑起点，第一周学。与「谓词逻辑」区分：命题不带变量","level":2,"tags":[],"py":"ming","pyFull":"mingtiyulianjieci","searchText":"命题与联结词  能判断真假的陈述句，以及「且/或/非/如果…那么」这些连接词 就像开关电路：每个灯泡（命题）有亮/灭两种状态，串联并联（联结词）组合 逻辑起点，第一周学。与「谓词逻辑」区分：命题不带变量"},{"id":"t0563","term":"谓词逻辑（一阶逻辑）","en":null,"chapter":"ch18","section":null,"plain":"在命题基础上加入「所有/存在」和变量，能表达更强的句子","analogy":"就像从「小明是人」升级到「所有人都会死」——从具体到普遍","tip":"数据库 SQL、程序语言的类型系统、语义分析的理论源头","level":2,"tags":[],"py":"weic","pyFull":"weiciluoji","searchText":"谓词逻辑（一阶逻辑）  在命题基础上加入「所有/存在」和变量，能表达更强的句子 就像从「小明是人」升级到「所有人都会死」——从具体到普遍 数据库 sql、程序语言的类型系统、语义分析的理论源头"},{"id":"t0564","term":"范式（CNF/DNF）","en":null,"chapter":"ch18","section":null,"plain":"把逻辑公式化成标准形状：合取范式（多个「或」项相与）或析取范式","analogy":"就像把分数通分成标准形式，好比较、好化简","tip":"考试必考题。SAT（可满足性问题）由此引出，是计算机理论绕不开的经典问题","level":2,"tags":[],"py":"fans","pyFull":"fanshi","searchText":"范式（cnf/dnf）  把逻辑公式化成标准形状：合取范式（多个「或」项相与）或析取范式 就像把分数通分成标准形式，好比较、好化简 考试必考题。sat（可满足性问题）由此引出，是计算机理论绕不开的经典问题"},{"id":"t0565","term":"集合论","en":null,"chapter":"ch18","section":null,"plain":"研究「一堆东西」：并集、交集、补集、幂集、基数、容斥原理","analogy":"就像抽屉分类：把物品按属性归类、计算各类有多少","tip":"数据库表就是集合，标签系统就是集合运算。SQL 的 UNION/INTERSECT 就是集合运算","level":2,"tags":[],"py":"jihe","pyFull":"jihelun","searchText":"集合论  研究「一堆东西」：并集、交集、补集、幂集、基数、容斥原理 就像抽屉分类：把物品按属性归类、计算各类有多少 数据库表就是集合，标签系统就是集合运算。sql 的 union/intersect 就是集合运算"},{"id":"t0566","term":"关系","en":null,"chapter":"ch18","section":null,"plain":"元素之间的关联：等价关系、偏序关系、传递闭包","analogy":"就像人际网：谁是同事（等价）、谁比谁级别高（偏序）","tip":"数据库里的「表」就是关系；图论里的「边」也是关系。关系的性质（自反/对称/传递）是考点","level":2,"tags":[],"py":"guan","pyFull":"guanxi","searchText":"关系  元素之间的关联：等价关系、偏序关系、传递闭包 就像人际网：谁是同事（等价）、谁比谁级别高（偏序） 数据库里的「表」就是关系；图论里的「边」也是关系。关系的性质（自反/对称/传递）是考点"},{"id":"t0567","term":"函数（单射/满射/双射）","en":null,"chapter":"ch18","section":null,"plain":"一个集合到另一个集合的映射，分一一对应（双射）、只进不出（单射）、全覆盖（满射）","analogy":"单射=每人一把不同的锁；满射=每个抽屉都有东西放","tip":"哈希函数、编码理论、可计算性都建立在函数概念上。考研离散数学必考","level":2,"tags":[],"py":"hans","pyFull":"hanshu","searchText":"函数（单射/满射/双射）  一个集合到另一个集合的映射，分一一对应（双射）、只进不出（单射）、全覆盖（满射） 单射=每人一把不同的锁；满射=每个抽屉都有东西放 哈希函数、编码理论、可计算性都建立在函数概念上。考研离散数学必考"},{"id":"t0568","term":"欧拉图与哈密顿图","en":null,"chapter":"ch18","section":null,"plain":"欧拉图=一笔画问题（每条边走一次）；哈密顿图=走遍所有顶点一次","analogy":"欧拉图像邮递员不重复路每条街；哈密顿图像推销员每个城市只去一次","tip":"欧拉回路是「能不能一笔画完」；哈密顿是更难的问题（旅行商问题的简化版）","level":2,"tags":[],"py":"oula","pyFull":"oulatuyuhamiduntu","searchText":"欧拉图与哈密顿图  欧拉图=一笔画问题（每条边走一次）；哈密顿图=走遍所有顶点一次 欧拉图像邮递员不重复路每条街；哈密顿图像推销员每个城市只去一次 欧拉回路是「能不能一笔画完」；哈密顿是更难的问题（旅行商问题的简化版）"},{"id":"t0569","term":"二部图与匹配","en":null,"chapter":"ch18","section":null,"plain":"两类点之间连线，找「一对一配对」问题","analogy":"就像相亲配对：红娘把男生女生两列，找互相心仪的配对","tip":"求职匹配、任务分配、最大匹配算法是图论经典题","level":2,"tags":[],"py":"erbu","pyFull":"erbutuyupipei","searchText":"二部图与匹配  两类点之间连线，找「一对一配对」问题 就像相亲配对：红娘把男生女生两列，找互相心仪的配对 求职匹配、任务分配、最大匹配算法是图论经典题"},{"id":"t0570","term":"平面图与图着色","en":null,"chapter":"ch18","section":null,"plain":"能画在平面上边不相交的图；用最少颜色给相邻区域涂不同色","analogy":"地图上给相邻省份涂不同颜色","tip":"四色定理（四种颜色够用）是著名成果。图着色在排课表、寄存器分配中有实际应用","level":2,"tags":[],"py":"ping","pyFull":"pingmiantuyutuzhuose","searchText":"平面图与图着色  能画在平面上边不相交的图；用最少颜色给相邻区域涂不同色 地图上给相邻省份涂不同颜色 四色定理（四种颜色够用）是著名成果。图着色在排课表、寄存器分配中有实际应用"},{"id":"t0571","term":"生成树与最小生成树（MST）","en":null,"chapter":"ch18","section":null,"plain":"连通图的「最小骨架」：n 个点用 n-1 条边连起来且总权最小","analogy":"就像用最少的电线把全村通上电","tip":"Prim（加点）与 Kruskal（加边）两大算法，面试高频，与数据结构课程联动","level":2,"tags":[],"py":"shen","pyFull":"shengchengshuyuzuixiaoshengchengshu","searchText":"生成树与最小生成树（mst）  连通图的「最小骨架」：n 个点用 n-1 条边连起来且总权最小 就像用最少的电线把全村通上电 prim（加点）与 kruskal（加边）两大算法，面试高频，与数据结构课程联动"},{"id":"t0572","term":"鸽巢原理","en":null,"chapter":"ch18","section":null,"plain":"n+1 个东西放进 n 个盒子，至少一个盒子有 2 个","analogy":"就像 13 个人总有 2 个生日在同一月","tip":"组合数学第一原理，常配「抽屉原理」叫法，出现在逻辑/组合题目里","level":2,"tags":[],"py":"gech","pyFull":"gechaoyuanli","searchText":"鸽巢原理  n+1 个东西放进 n 个盒子，至少一个盒子有 2 个 就像 13 个人总有 2 个生日在同一月 组合数学第一原理，常配「抽屉原理」叫法，出现在逻辑/组合题目里"},{"id":"t0573","term":"布尔代数","en":null,"chapter":"ch18","section":null,"plain":"只有 0/1、与或非三种运算的代数系统","analogy":"就像电工的开关逻辑：串联=与、并联=或、反接=非","tip":"数字电路（CPU 里的门电路）就是布尔代数的物理实现。理解它与位运算的对应，CPU 就不神秘了","level":2,"tags":[],"py":"buer","pyFull":"buerdaishu","searchText":"布尔代数  只有 0/1、与或非三种运算的代数系统 就像电工的开关逻辑：串联=与、并联=或、反接=非 数字电路（cpu 里的门电路）就是布尔代数的物理实现。理解它与位运算的对应，cpu 就不神秘了"},{"id":"t0574","term":"原子操作（Atomic）","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"不可分割的操作：要么做完要么没做，中间不会被其他线程插一脚","analogy":"就像银行取号机发号，一次只能一个人按，数字不会跳号","tip":"并发安全的基石。Java 的 AtomicInteger 等原子类就靠它，底层是 CAS","level":4,"tags":["面试"],"py":"yuan","pyFull":"yuanzicaozuo","searchText":"原子操作（atomic）  不可分割的操作：要么做完要么没做，中间不会被其他线程插一脚 就像银行取号机发号，一次只能一个人按，数字不会跳号 并发安全的基石。java 的 atomicinteger 等原子类就靠它，底层是 cas"},{"id":"t0575","term":"CAS","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"Compare-And-Swap，先比较再交换：检查值是否还是老样子，是才更新","analogy":"就像改密码前先确认「当前密码是不是我记的那个」，是才改","tip":"乐观锁的底层实现。ABA 问题（见下）是它的经典陷阱","level":4,"tags":["面试"],"py":"cas","pyFull":"cas","searchText":"cas  compare-and-swap，先比较再交换：检查值是否还是老样子，是才更新 就像改密码前先确认「当前密码是不是我记的那个」，是才改 乐观锁的底层实现。aba 问题（见下）是它的经典陷阱"},{"id":"t0576","term":"ABA 问题","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"CAS 的陷阱：值 A 被改到 B 又改回 A，CAS 以为没变过，实际中间被改过","analogy":"就像账户金额从 100 变 50 又变回 100，但中间被人取走过","tip":"解决：加版本号（AtomicStampedReference）。面试八股高频","level":4,"tags":["面试"],"py":"abaw","pyFull":"abawenti","searchText":"aba 问题  cas 的陷阱：值 a 被改到 b 又改回 a，cas 以为没变过，实际中间被改过 就像账户金额从 100 变 50 又变回 100，但中间被人取走过 解决：加版本号（atomicstampedreference）。面试八股高频"},{"id":"t0577","term":"volatile","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"保证变量可见性和禁止重排（让线程读到最新值），但不保证原子性","analogy":"就像贴在黑板上的公告，大家随时能看到最新版","tip":"单例双重检查锁（DCL）里的经典用法。常被追问「volatile 为什么不能替代 synchronized」","level":4,"tags":["面试"],"py":"vola","pyFull":"volatile","searchText":"volatile  保证变量可见性和禁止重排（让线程读到最新值），但不保证原子性 就像贴在黑板上的公告，大家随时能看到最新版 单例双重检查锁（dcl）里的经典用法。常被追问「volatile 为什么不能替代 synchronized」"},{"id":"t0578","term":"synchronized","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"Java 内置的互斥锁，保证同一时刻只有一个线程进入","analogy":"就像厕所门锁，一次进一个人，其他人排队","tip":"锁会「升级」：偏向锁→轻量级锁→重量级锁（锁升级机制，面试高频）","level":4,"tags":["面试"],"py":"sync","pyFull":"synchronized","searchText":"synchronized  java 内置的互斥锁，保证同一时刻只有一个线程进入 就像厕所门锁，一次进一个人，其他人排队 锁会「升级」：偏向锁→轻量级锁→重量级锁（锁升级机制，面试高频）"},{"id":"t0579","term":"锁升级","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"无竞争时用轻量级的偏向锁，竞争激烈时升级成重量级锁","analogy":"就像自习室：没人抢座位就不用发票，人多了才开始发票管理","tip":"JVM 的优化手段，理解它=理解「并发优化是分级的」","level":4,"tags":["面试"],"py":"suos","pyFull":"suoshengji","searchText":"锁升级  无竞争时用轻量级的偏向锁，竞争激烈时升级成重量级锁 就像自习室：没人抢座位就不用发票，人多了才开始发票管理 jvm 的优化手段，理解它=理解「并发优化是分级的」"},{"id":"t0580","term":"JMM（Java 内存模型）","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"规定线程之间共享变量如何通信的一组规则，核心是 happen-before","analogy":"就像公司规定：谁改了公告要先签写时间，别人看时按时间判断新旧","tip":"面试必问：可见性/原子性/有序性。happen-before 规则是考点","level":4,"tags":["面试"],"py":"jmm","pyFull":"jmm","searchText":"jmm（java 内存模型）  规定线程之间共享变量如何通信的一组规则，核心是 happen-before 就像公司规定：谁改了公告要先签写时间，别人看时按时间判断新旧 面试必问：可见性/原子性/有序性。happen-before 规则是考点"},{"id":"t0581","term":"Lock 与 AQS","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"Lock=Java 提供的替代 synchronized 的锁接口；AQS=实现这些锁的底层框架","analogy":"就像健身房电子锁系统：AQS 是排队叫号系统，各种锁是具体门禁设备","tip":"面试深坑区：ReentrantLock、CountDownLatch、Semaphore 都基于 AQS 实现","level":4,"tags":["面试"],"py":"lock","pyFull":"lockyuaqs","searchText":"lock 与 aqs  lock=java 提供的替代 synchronized 的锁接口；aqs=实现这些锁的底层框架 就像健身房电子锁系统：aqs 是排队叫号系统，各种锁是具体门禁设备 面试深坑区：reentrantlock、countdownlatch、semaphore 都基于 aqs 实现"},{"id":"t0582","term":"ThreadLocal","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"每个线程自己的「私有储物柜」，线程间互不干扰","analogy":"就像游泳馆每人一个储物柜，各存各的","tip":"背锅点：内存泄漏（线程池复用线程时，ThreadLocal 不清理会泄漏）。WeakReference 是必追问点","level":4,"tags":["面试"],"py":"thre","pyFull":"threadlocal","searchText":"threadlocal  每个线程自己的「私有储物柜」，线程间互不干扰 就像游泳馆每人一个储物柜，各存各的 背锅点：内存泄漏（线程池复用线程时，threadlocal 不清理会泄漏）。weakreference 是必追问点"},{"id":"t0583","term":"线程池","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"提前建好一批线程复用，避免频繁创建销毁线程","analogy":"就像公司固定雇 N 个客服，有活排队分给他们，不现招现辞","tip":"核心七参数（如核心线程数、最大线程数、队列大小、拒绝策略），面试必背","level":4,"tags":["面试"],"py":"xian","pyFull":"xianchengchi","searchText":"线程池  提前建好一批线程复用，避免频繁创建销毁线程 就像公司固定雇 n 个客服，有活排队分给他们，不现招现辞 核心七参数（如核心线程数、最大线程数、队列大小、拒绝策略），面试必背"},{"id":"t0584","term":"虚拟线程（Java 21）","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"JVM 层面的轻量级线程，几十万个也能跑，不用自己写异步","analogy":"就像餐厅用「翻台号」代替真人服务员排队","tip":"2024 年后新面试热点。与 Go 的 goroutine 思想相似","level":4,"tags":["面试"],"py":"xuni","pyFull":"xunixiancheng","searchText":"虚拟线程（java 21）  jvm 层面的轻量级线程，几十万个也能跑，不用自己写异步 就像餐厅用「翻台号」代替真人服务员排队 2024 年后新面试热点。与 go 的 goroutine 思想相似"},{"id":"t0585","term":"死锁四必要条件","en":null,"chapter":"ch19","section":"19.1 Java 并发编程（后端必考）","plain":"互斥、占有且等待、不可剥夺、循环等待，同时满足才会死锁","analogy":"就像两个人过独木桥，各占一头僵持互不相让","tip":"破坏任一条件即可预防。经典面试组合拳：讲完死锁必问你「怎么预防」","level":4,"tags":["面试"],"py":"sisu","pyFull":"sisuosibiyaotiaojian","searchText":"死锁四必要条件  互斥、占有且等待、不可剥夺、循环等待，同时满足才会死锁 就像两个人过独木桥，各占一头僵持互不相让 破坏任一条件即可预防。经典面试组合拳：讲完死锁必问你「怎么预防」"},{"id":"t0586","term":"JVM","en":null,"chapter":"ch19","section":"19.2 JVM（Java 虚拟机）","plain":"Java Virtual Machine，运行 Java 字节码的虚拟计算机","analogy":"就像通用翻译官：Java 写完它翻给各操作系统听","tip":"「一次编写，到处运行」的功臣。Java 面试的第二深坑区","level":4,"tags":["面试"],"py":"jvm","pyFull":"jvm","searchText":"jvm  java virtual machine，运行 java 字节码的虚拟计算机 就像通用翻译官：java 写完它翻给各操作系统听 「一次编写，到处运行」的功臣。java 面试的第二深坑区"},{"id":"t0587","term":"类加载过程","en":null,"chapter":"ch19","section":"19.2 JVM（Java 虚拟机）","plain":"把 .class 文件变成可运行类的流程：加载→验证→准备→解析→初始化","analogy":"就像厨师上岗流程：入职（加载）→验执照（验证）→领工服（准备）→学菜谱（解析）→开火干活（初始化）","tip":"五个阶段名字必须背。常追问「初始化的触发条件」","level":4,"tags":["面试"],"py":"leij","pyFull":"leijiazaiguocheng","searchText":"类加载过程  把 .class 文件变成可运行类的流程：加载→验证→准备→解析→初始化 就像厨师上岗流程：入职（加载）→验执照（验证）→领工服（准备）→学菜谱（解析）→开火干活（初始化） 五个阶段名字必须背。常追问「初始化的触发条件」"},{"id":"t0588","term":"双亲委派模型","en":null,"chapter":"ch19","section":"19.2 JVM（Java 虚拟机）","plain":"类加载器加载类时先问父加载器，避免重复加载、防止核心类被篡改","analogy":"就像办事逐级上报：先问上级有没有，上级没有才自己处理","tip":"高频考点。异常处理「为什么 Java 的 ClassNotFoundException」都与此相关","level":4,"tags":["面试"],"py":"shua","pyFull":"shuangqinweipaimoxing","searchText":"双亲委派模型  类加载器加载类时先问父加载器，避免重复加载、防止核心类被篡改 就像办事逐级上报：先问上级有没有，上级没有才自己处理 高频考点。异常处理「为什么 java 的 classnotfoundexception」都与此相关"},{"id":"t0589","term":"垃圾回收（GC）","en":null,"chapter":"ch19","section":"19.2 JVM（Java 虚拟机）","plain":"JVM 自动回收不再使用的对象内存","analogy":"就像保洁阿姨定时清理没人用的房间","tip":"算法：标记清除（慢但简单）、复制（快但费内存）、标记整理、分代回收。STW 是痛","level":4,"tags":["面试"],"py":"laji","pyFull":"lajihuishou","searchText":"垃圾回收（gc）  jvm 自动回收不再使用的对象内存 就像保洁阿姨定时清理没人用的房间 算法：标记清除（慢但简单）、复制（快但费内存）、标记整理、分代回收。stw 是痛"},{"id":"t0590","term":"STW","en":null,"chapter":"ch19","section":"19.2 JVM（Java 虚拟机）","plain":"Stop-The-World，GC 时暂停所有业务线程","analogy":"就像保洁打扫时全商场清场 5 分钟","tip":"G1/ZGC 都在努力缩短 STW。追问「怎么减少 STW」=歌乐悬题","level":4,"tags":["面试"],"py":"stw","pyFull":"stw","searchText":"stw  stop-the-world，gc 时暂停所有业务线程 就像保洁打扫时全商场清场 5 分钟 g1/zgc 都在努力缩短 stw。追问「怎么减少 stw」=歌乐悬题"},{"id":"t0591","term":"GC Roots 与可达性分析","en":null,"chapter":"ch19","section":"19.2 JVM（Java 虚拟机）","plain":"判断对象「死没死」：从根对象出发，能到达的就是活的","analogy":"就像从电网总闸出发，通电的线路是有用的，断电的是废的","tip":"判断垃圾的标准不是引用计数，是可达性分析。老年代主流","level":4,"tags":["面试"],"py":"gcro","pyFull":"gcrootsyukedaxingfenxi","searchText":"gc roots 与可达性分析  判断对象「死没死」：从根对象出发，能到达的就是活的 就像从电网总闸出发，通电的线路是有用的，断电的是废的 判断垃圾的标准不是引用计数，是可达性分析。老年代主流"},{"id":"t0592","term":"三色标记","en":null,"chapter":"ch19","section":"19.2 JVM（Java 虚拟机）","plain":"GC 顺手标记对象为白/灰/黑三种状态，用来增量标记不停机","analogy":"就像搬家分箱：还没看的（白）、看的差不多的（灰）、已贴条固定（黑）","tip":"面试加分词，G1/CMS 增量标记的原理","level":4,"tags":["面试"],"py":"sans","pyFull":"sansebiaoji","searchText":"三色标记  gc 顺手标记对象为白/灰/黑三种状态，用来增量标记不停机 就像搬家分箱：还没看的（白）、看的差不多的（灰）、已贴条固定（黑） 面试加分词，g1/cms 增量标记的原理"},{"id":"t0593","term":"MVCC","en":null,"chapter":"ch19","section":"19.3 数据库追问层","plain":"Multi-Version Concurrency Control，多版本并发控制：读写用快照，不互相锁","analogy":"就像看历史快照：你读的是某个时刻的版本，别人改不影响你读","tip":"MySQL 可重复读的实现原理，面试必考。核心：版本链 + Read View","level":4,"tags":["面试"],"py":"mvcc","pyFull":"mvcc","searchText":"mvcc  multi-version concurrency control，多版本并发控制：读写用快照，不互相锁 就像看历史快照：你读的是某个时刻的版本，别人改不影响你读 mysql 可重复读的实现原理，面试必考。核心：版本链 + read view"},{"id":"t0594","term":"间隙锁 / 临键锁","en":null,"chapter":"ch19","section":"19.3 数据库追问层","plain":"锁住「行之间的空隙」，防止别的事务往中间插入新行","analogy":"就像预定了音乐会座位区，防止别人插进这个区间","tip":"与幻读直接相关。Next-Key Lock=行锁+间隙锁，MySQL 默认隔离级别下的防幻读武器","level":4,"tags":["面试"],"py":"jian","pyFull":"jianxisuolinjiansuo","searchText":"间隙锁 / 临键锁  锁住「行之间的空隙」，防止别的事务往中间插入新行 就像预定了音乐会座位区，防止别人插进这个区间 与幻读直接相关。next-key lock=行锁+间隙锁，mysql 默认隔离级别下的防幻读武器"},{"id":"t0595","term":"覆盖索引","en":null,"chapter":"ch19","section":"19.3 数据库追问层","plain":"索引里已经包含要查的所有字段，不用回表查聚簇索引","analogy":"就像电话本直接有姓名和电话，不用再查户口本","tip":"高频优化手段。「回表」是反向高频词，索引优化绕不开","level":4,"tags":["面试"],"py":"fuga","pyFull":"fugaisuoyin","searchText":"覆盖索引  索引里已经包含要查的所有字段，不用回表查聚簇索引 就像电话本直接有姓名和电话，不用再查户口本 高频优化手段。「回表」是反向高频词，索引优化绕不开"},{"id":"t0596","term":"索引失效","en":null,"chapter":"ch19","section":"19.3 数据库追问层","plain":"查询条件写得不满足最左前缀/函数包裹/隐式类型转换，索引白建","analogy":"就像目录是按姓氏排序的，你非要按名查，目录派不上用场","tip":"面试必背：最左前缀、%开头模糊、索引列做运算、or 导致失效等","level":4,"tags":["面试"],"py":"suoy","pyFull":"suoyinshixiao","searchText":"索引失效  查询条件写得不满足最左前缀/函数包裹/隐式类型转换，索引白建 就像目录是按姓氏排序的，你非要按名查，目录派不上用场 面试必背：最左前缀、%开头模糊、索引列做运算、or 导致失效等"},{"id":"t0597","term":"EXPLAIN 执行计划","en":null,"chapter":"ch19","section":"19.3 数据库追问层","plain":"让数据库告诉你这条 SQL 会怎么执行：用没用索引、扫多少行","analogy":"就像导航提前给你看路线：走高速还是走小路","tip":"全字段含义不用背，但要会看 type/key/rows/Extra。面试官最爱「给出 SQL 让你说优化思路」","level":4,"tags":["面试"],"py":"expl","pyFull":"explainzhixingjihua","searchText":"explain 执行计划  让数据库告诉你这条 sql 会怎么执行：用没用索引、扫多少行 就像导航提前给你看路线：走高速还是走小路 全字段含义不用背，但要会看 type/key/rows/extra。面试官最爱「给出 sql 让你说优化思路」"},{"id":"t0598","term":"慢查询","en":null,"chapter":"ch19","section":"19.3 数据库追问层","plain":"执行时间超过阈值的 SQL，需要定位优化","analogy":"就像店里哪道菜出餐特别慢，要找出是哪个环节","tip":"慢查询日志 + EXPLAIN 是排查标准两步曲","level":4,"tags":["面试"],"py":"manc","pyFull":"manchaxun","searchText":"慢查询  执行时间超过阈值的 sql，需要定位优化 就像店里哪道菜出餐特别慢，要找出是哪个环节 慢查询日志 + explain 是排查标准两步曲"},{"id":"t0599","term":"WAL（预写日志）","en":null,"chapter":"ch19","section":"19.3 数据库追问层","plain":"Write-Ahead Logging：先写日志、再改数据，崩溃后靠日志恢复","analogy":"就像记账先写草稿再誊写正本，草稿在就能重誊","tip":"数据库和很多存储系统的通用原则。大厂面试常从「MySQL 怎么保证不丢数据」问到这","level":4,"tags":["面试"],"py":"wal","pyFull":"wal","searchText":"wal（预写日志）  write-ahead logging：先写日志、再改数据，崩溃后靠日志恢复 就像记账先写草稿再誊写正本，草稿在就能重誊 数据库和很多存储系统的通用原则。大厂面试常从「mysql 怎么保证不丢数据」问到这"},{"id":"t0600","term":"主从延迟","en":null,"chapter":"ch19","section":"19.3 数据库追问层","plain":"主库写、从库同步有延迟，刚写完立刻查从库可能读不到","analogy":"就像总店刚改价，分店海报要几分钟才换","tip":"场景：读写分离架构下的经典问题。解决手段：半同步、强制主库读","level":4,"tags":["面试"],"py":"zhuc","pyFull":"zhucongyanchi","searchText":"主从延迟  主库写、从库同步有延迟，刚写完立刻查从库可能读不到 就像总店刚改价，分店海报要几分钟才换 场景：读写分离架构下的经典问题。解决手段：半同步、强制主库读"},{"id":"t0601","term":"分布式ID / 雪花算法","en":null,"chapter":"ch19","section":"19.3 数据库追问层","plain":"分库分表后没法用数据库自增 ID，需要全局唯一 ID 生成方案","analogy":"就像全国统一身份证号，不能各省自己编号","tip":"雪花算法（Snowflake）：时间戳+机器号+序列号组合成 64 位 ID，最广为流传","level":4,"tags":["面试"],"py":"fenb","pyFull":"fenbushiidxuehuasuanfa","searchText":"分布式id / 雪花算法  分库分表后没法用数据库自增 id，需要全局唯一 id 生成方案 就像全国统一身份证号，不能各省自己编号 雪花算法（snowflake）：时间戳+机器号+序列号组合成 64 位 id，最广为流传"},{"id":"t0602","term":"一致性哈希","en":null,"chapter":"ch19","section":"19.4 分布式系统（后端进阶）","plain":"让节点增减时尽量少迁移数据的哈希算法（哈希环+虚拟节点）","analogy":"就像搬家只动周边几户，不用整栋楼全重新分配","tip":"Redis 集群、负载均衡分片都在用。追问必考「为什么加虚拟节点」","level":4,"tags":["面试"],"py":"yizh","pyFull":"yizhixinghaxi","searchText":"一致性哈希  让节点增减时尽量少迁移数据的哈希算法（哈希环+虚拟节点） 就像搬家只动周边几户，不用整栋楼全重新分配 redis 集群、负载均衡分片都在用。追问必考「为什么加虚拟节点」"},{"id":"t0603","term":"分布式锁","en":null,"chapter":"ch19","section":"19.4 分布式系统（后端进阶）","plain":"多台机器抢同一资源时用的锁（Redis SETNX+Lua，ZK 临时节点）","analogy":"就像全国只有一个车位，各省的司机都要抢","tip":"经典题：SETNX 设置+过期时间+Lua 原子操作/看门狗续期","level":4,"tags":["面试"],"py":"fenb","pyFull":"fenbushisuo","searchText":"分布式锁  多台机器抢同一资源时用的锁（redis setnx+lua，zk 临时节点） 就像全国只有一个车位，各省的司机都要抢 经典题：setnx 设置+过期时间+lua 原子操作/看门狗续期"},{"id":"t0604","term":"Raft 算法","en":null,"chapter":"ch19","section":"19.4 分布式系统（后端进阶）","plain":"分布式一致性算法：Leader 选举+日志复制","analogy":"就像班长选举：先选班长，全班消息由班长广播","tip":"2026 面试热点，ETCD、Consul 用它实现。比 Paxos 好懂，先学它","level":4,"tags":["面试"],"py":"raft","pyFull":"raftsuanfa","searchText":"raft 算法  分布式一致性算法：leader 选举+日志复制 就像班长选举：先选班长，全班消息由班长广播 2026 面试热点，etcd、consul 用它实现。比 paxos 好懂，先学它"},{"id":"t0605","term":"2PC/3PC/TCC","en":null,"chapter":"ch19","section":"19.4 分布式系统（后端进阶）","plain":"分布式事务方案：两阶段提交、三阶段提交、补偿式事务","analogy":"2PC=先问全员预备、再统一提交；TCC=分 Try/Confirm/Cancel 三步","tip":"2PC：强一致但慢；TCC：最终一致适合互联网。顺带认识 Saga","level":4,"tags":["面试"],"py":"pcpc","pyFull":"pcpctcc","searchText":"2pc/3pc/tcc  分布式事务方案：两阶段提交、三阶段提交、补偿式事务 2pc=先问全员预备、再统一提交；tcc=分 try/confirm/cancel 三步 2pc：强一致但慢；tcc：最终一致适合互联网。顺带认识 saga"},{"id":"t0606","term":"CAP 定理","en":null,"chapter":"ch19","section":"19.4 分布式系统（后端进阶）","plain":"分布式系统不可能同时满足一致性、可用性、分区容忍性，最多选两个","analogy":"就像旅游团：团友一致行动（C）、随时能走（A）、分头行动但联系可能断（P）三选二","tip":"第五节有词条，这里是追问层：网络分区不可避免，只能在 CP/AP 里选","level":4,"tags":["面试"],"py":"capd","pyFull":"capdingli","searchText":"cap 定理  分布式系统不可能同时满足一致性、可用性、分区容忍性，最多选两个 就像旅游团：团友一致行动（c）、随时能走（a）、分头行动但联系可能断（p）三选二 第五节有词条，这里是追问层：网络分区不可避免，只能在 cp/ap 里选"},{"id":"t0607","term":"注册中心/服务发现","en":null,"chapter":"ch19","section":"19.4 分布式系统（后端进阶）","plain":"服务上下线自动登记，别人能发现它","analogy":"就像企业通讯录：入职登记、离职删除，找人查通讯录","tip":"Nacos/Eureka/Consul。追问：注册中心挂了怎么办？（缓存+容错）","level":4,"t 测","en":null,"chapter":"ch21","section":"21.3 职场行话（开会日常）","plain":"模拟高并发测试系统扛不扛得住","analogy":"就像游泳馆压力测试：灌满人看看会不会塌","tip":"上线前必做，大促前大做","level":4,"tags":["职场"],"py":"yace","pyFull":"yace","searchText":"压测  模拟高并发测试系统扛不扛得住 就像游泳馆压力测试：灌满人看看会不会塌 上线前必做，大促前大做"},{"id":"t0671","term":"上线/灰度/回滚","en":null,"chapter":"ch21","section":"21.3 职场行话（开会日常）","plain":"发布到生产环境 / 先小部分用户试 / 出事退旧版","analogy":"就像开店：正式开业/试营业/关店回改","tip":"发布窗口通常凌晨。灰度是对用户负责，回滚是程序员的后悔药","level":4,"tags":["职场"],"py":"shan","pyFull":"shangxianhuiduhuigun","searchText":"上线/灰度/回滚  发布到生产环境 / 先小部分用户试 / 出事退旧版 就像开店：正式开业/试营业/关店回改 发布窗口通常凌晨。灰度是对用户负责，回滚是程序员的后悔药"},{"id":"t0672","term":"复盘","en":null,"chapter":"ch21","section":"21.3 职场行话（开会日常）","plain":"事后开会总结：好的/坏的/下次怎么改","analogy":"就像赛后总结会","tip":"不是追责会！说「过程+结果+教训」即可","level":4,"tags":["职场"],"py":"fupa","pyFull":"fupan","searchText":"复盘  事后开会总结：好的/坏的/下次怎么改 就像赛后总结会 不是追责会！说「过程+结果+教训」即可"},{"id":"t0673","term":"对齐/拉通/闭环","en":null,"chapter":"ch21","section":"21.3 职场行话（开会日常）","plain":"对齐=口径一致；拉通=跨部门打通；闭环=有始有终","analogy":"就像三兄弟：统一想法/牵线搭桥/善始善终","tip":"职场高频三连，听不懂会露怯。例句：「这事需要和 X 对齐一下，拉通后闭环」","level":4,"tags":["职场"],"py":"duiq","pyFull":"duiqilatongbihuan","searchText":"对齐/拉通/闭环  对齐=口径一致；拉通=跨部门打通；闭环=有始有终 就像三兄弟：统一想法/牵线搭桥/善始善终 职场高频三连，听不懂会露怯。例句：「这事需要和 x 对齐一下，拉通后闭环」"},{"id":"t0674","term":"兜底","en":null,"chapter":"ch21","section":"21.3 职场行话（开会日常）","plain":"出问题时有方案/有人接住","analogy":"就像安全网","tip":"被要求「兜底」=你要对别人的失误负责，接之前想清楚范围","level":4,"tags":["职场"],"py":"doud","pyFull":"doudi","searchText":"兜底  出问题时有方案/有人接住 就像安全网 被要求「兜底」=你要对别人的失误负责，接之前想清楚范围"},{"id":"t0675","term":"背锅/甩锅","en":null,"chapter":"ch21","section":"21.3 职场行话（开会日常）","plain":"承担别人责任 / 推卸责任","analogy":"就像替罪羊/金蝉脱壳","tip":"对策是「留痕」：邮件纪要写清楚，责任自然清楚","level":4,"tags":["职场"],"py":"beig","pyFull":"beiguoshuaiguo","searchText":"背锅/甩锅  承担别人责任 / 推卸责任 就像替罪羊/金蝉脱壳 对策是「留痕」：邮件纪要写清楚，责任自然清楚"},{"id":"t0676","term":"卷/内卷/躺平","en":null,"chapter":"ch21","section":"21.3 职场行话（开会日常）","plain":"无意义过度竞争 / 拒绝无效奋斗","analogy":"就像剧场效应：前排站起来了大家都要站","tip":"卷的本质是资源有限。职场初期适度卷技能，别卷无效工时","level":4,"tags":["职场"],"py":"juan","pyFull":"juanneijuantangping","searchText":"卷/内卷/躺平  无意义过度竞争 / 拒绝无效奋斗 就像剧场效应：前排站起来了大家都要站 卷的本质是资源有限。职场初期适度卷技能，别卷无效工时"},{"id":"t0677","term":"摸鱼/划水","en":null,"chapter":"ch21","section":"21.3 职场行话（开会日常）","plain":"上班装忙真偷懒","analogy":"就像上班划船不出力","tip":"偶尔摸鱼是常态，但别影响交付。能力才是护身符","level":4,"tags":["职场"],"py":"moyu","pyFull":"moyuhuashui","searchText":"摸鱼/划水  上班装忙真偷懒 就像上班划船不出力 偶尔摸鱼是常态，但别影响交付。能力才是护身符"},{"id":"t0678","term":"值班/Oncall","en":null,"chapter":"ch21","section":"21.4 技术管理与运维","plain":"轮班处理线上问题，24小时手机常开","analogy":"就像消防值班：轮到你就得随时出警","tip":"半夜被叫醒的「线上事故」是新人第一课。记录在案的问题要会复盘","level":4,"tags":["职场"],"py":"zhib","pyFull":"zhibanoncall","searchText":"值班/oncall  轮班处理线上问题，24小时手机常开 就像消防值班：轮到你就得随时出警 半夜被叫醒的「线上事故」是新人第一课。记录在案的问题要会复盘"},{"id":"t0679","term":"故障等级","en":null,"chapter":"ch21","section":"21.4 技术管理与运维","plain":"P0（全挂）/P1（部分挂）等事故分级","analogy":"就像火灾等级：一级火灾全城动员","tip":"发生就走「定级→通报→复盘」流程。**别看热闹，学人家怎么排查的**","level":4,"tags":["职场"],"py":"guzh","pyFull":"guzhangdengji","searchText":"故障等级  p0（全挂）/p1（部分挂）等事故分级 就像火灾等级：一级火灾全城动员 发生就走「定级→通报→复盘」流程。**别看热闹，学人家怎么排查的**"},{"id":"t0680","term":"SLA / SLO","en":null,"chapter":"ch21","section":"21.4 技术管理与运维","plain":"SLA=对外服务承诺（如99.9%）；SLO=内部目标线","analogy":"SLA 像合同承诺，SLO 像自我要求的红线","tip":"服务可用性黑话，前端/运维/后端都要懂。100% 可用性是不现实的","level":4,"tags":["职场"],"py":"slas","pyFull":"slaslo","searchText":"sla / slo  sla=对外服务承诺（如99.9%）；slo=内部目标线 sla 像合同承诺，slo 像自我要求的红线 服务可用性黑话，前端/运维/后端都要懂。100% 可用性是不现实的"},{"id":"t0681","term":"大促/双十一","en":null,"chapter":"ch21","section":"21.4 技术管理与运维","plain":"电商年度峰值演练：全链路压测、封板、值班","analogy":"就像一年一度的全校运动会，全员上阵","tip":"大促节奏：备战→压测→封板（禁止再改）→战时→复盘。经历一次就理解「稳定性」的分量","level":4,"tags":["职场"],"py":"dacu","pyFull":"dacushuangshiyi","searchText":"大促/双十一  电商年度峰值演练：全链路压测、封板、值班 就像一年一度的全校运动会，全员上阵 大促节奏：备战→压测→封板（禁止再改）→战时→复盘。经历一次就理解「稳定性」的分量"},{"id":"t0682","term":"晋升/绩效/答辩","en":null,"chapter":"ch21","section":"21.5 职业发展（含裁员黑话）","plain":"一年一次的职级晋级窗口；绩效打分决定年终奖和晋升；答辩向评审讲成果","analogy":"就像年度评优：日常打分+现场述职","tip":"绩效直接决定年终奖、涨薪、晋升资格。入职第一年就要搞清楚自己团队的绩效规则","level":4,"tags":["职场"],"py":"jins","pyFull":"jinshengjixiaodabian","searchText":"晋升/绩效/答辩  一年一次的职级晋级窗口；绩效打分决定年终奖和晋升；答辩向评审讲成果 就像年度评优：日常打分+现场述职 绩效直接决定年终奖、涨薪、晋升资格。入职第一年就要搞清楚自己团队的绩效规则"},{"id":"t0683","term":"裁员/优化/毕业","en":null,"chapter":"ch21","section":"21.5 职业发展（含裁员黑话）","plain":"业务调整减员：官方叫「优化」，字节系叫「毕业」","analogy":"就像公司「精简编制」","tip":"优化不是针对你个人，是生意逻辑。听到风声先盘点自己的筹码（N+1、期权归属、竞业）","level":4,"tags":["职场"],"py":"caiy","pyFull":"caiyuanyouhuabiye","searchText":"裁员/优化/毕业  业务调整减员：官方叫「优化」，字节系叫「毕业」 就像公司「精简编制」 优化不是针对你个人，是生意逻辑。听到风声先盘点自己的筹码（n+1、期权归属、竞业）"},{"id":"t0684","term":"N+1/N+3","en":null,"chapter":"ch21","section":"21.5 职业发展（含裁员黑话）","plain":"离职赔偿口径：N=工作年限×月工资，+1=代通知金；N+3 属公司自愿协商方案","analogy":"就像分手补偿金按工龄算","tip":"**法律底线是 N 或 N+1（特定情形）**，高于此是协商结果。裁员谈判记住：谈的是 N+几和期权处理","level":4,"tags":["职场"],"py":"nn","pyFull":"nn","searchText":"n+1/n+3  离职赔偿口径：n=工作年限×月工资，+1=代通知金；n+3 属公司自愿协商方案 就像分手补偿金按工龄算 **法律底线是 n 或 n+1（特定情形）**，高于此是协商结果。裁员谈判记住：谈的是 n+几和期权处理"},{"id":"t0685","term":"竞业协议","en":null,"chapter":"ch21","section":"21.5 职业发展（含裁员黑话）","plain":"离职后限定期限（最长2年）不得去竞争对手","analogy":"就像运动员的「冷冻期」条款","tip":"**2025年9月起新规：没接触商业秘密的员工，竞业条款不生效；超出实际保密范围的无效**（最高法司法解释）。签的时候别慌，先看自己算不算「涉密人员」","level":4,"tags":["职场"],"py":"jing","pyFull":"jingyexieyi","searchText":"竞业协议  离职后限定期限（最长2年）不得去竞争对手 就像运动员的「冷冻期」条款 **2025年9月起新规：没接触商业秘密的员工，竞业条款不生效；超出实际保密范围的无效**（最高法司法解释）。签的时候别慌，先看自己算不算「涉密人员」"},{"id":"t0686","term":"期权回购","en":null,"chapter":"ch21","section":"21.5 职业发展（含裁员黑话）","plain":"离职时公司按约定价收回你未上市的期权","analogy":"就像把「未上市股票」按约定价格卖回公司","tip":"各公司政策不一，小红薯等已开放离职期权回购。谈离职赔偿时一起谈","level":4,"tags":["职场"],"py":"qiqu","pyFull":"qiquanhuigou","searchText":"期权回购  离职时公司按约定价收回你未上市的期权 就像把「未上市股票」按约定价格卖回公司 各公司政策不一，小红薯等已开放离职期权回购。谈离职赔偿时一起谈"},{"id":"t0687","term":"35岁危机","en":null,"chapter":"ch21","section":"21.5 职业发展（含裁员黑话）","plain":"「35岁被优化」的行业焦虑话题","analogy":"就像运动员过了黄金期被质疑","tip":"**属行业讨论现象，无官方定论**。2026年讨论热度不减，AI冲击是新变量。对策是把「年龄焦虑」翻译成「不可替代性」","level":4,"tags":["职场"],"py":"suiw","pyFull":"suiweiji","searchText":"35岁危机  「35岁被优化」的行业焦虑话题 就像运动员过了黄金期被质疑 **属行业讨论现象，无官方定论**。2026年讨论热度不减，ai冲击是新变量。对策是把「年龄焦虑」翻译成「不可替代性」"},{"id":"t0688","term":"延迟退休","en":null,"chapter":"ch21","section":"21.5 职业发展（含裁员黑话）","plain":"2025年1月1日起施行：男60→63、女50→55/58，15年渐进","analogy":"就像退休年龄整体延后","tip":"学生规划超长期视角才用得上。最低缴费年限 2030 年起逐步从15年提到20年（以官方为准）","level":4,"tags":["职场"],"py":"yanc","pyFull":"yanchituixiu","searchText":"延迟退休  2025年1月1日起施行：男60→63、女50→55/58，15年渐进 就像退休年龄整体延后 学生规划超长期视角才用得上。最低缴费年限 2030 年起逐步从15年提到20年（以官方为准）"},{"id":"t0689","term":"跳槽/涨薪","en":null,"chapter":"ch21","section":"21.5 职业发展（含裁员黑话）","plain":"换公司（常见1-3年一跳）；年度调薪（与晋升逐渐脱钩）","analogy":"跳槽像转会，涨薪像年度加薪","tip":"短期频繁跳是简历污点；调薪与晋升脱钩是行业新趋势（各厂以官方为准）","level":4,"tags":["职场"],"py":"tiao","pyFull":"tiaocaozhangxin","searchText":"跳槽/涨薪  换公司（常见1-3年一跳）；年度调薪（与晋升逐渐脱钩） 跳槽像转会，涨薪像年度加薪 短期频繁跳是简历污点；调薪与晋升脱钩是行业新趋势（各厂以官方为准）"}],"confusions":[{"pair":"进程 vs 线程","desc":"进程是资源分配单位（独立工厂），线程是CPU调度单位（工厂里的工人）"},{"pair":"并发 vs 并行","desc":"并发是「交替做」（一个人同时聊3个微信），并行是「同时做」（3个人各聊一个）"},{"pair":"栈 vs 堆","desc":"栈是自动管理的后进先出区（函数调用），堆是手动/GC管理的动态分配区（new对象）"},{"pair":"内存 vs 硬盘","desc":"内存是短期记忆（书桌，断电就没），硬盘是长期记忆（书架，断电还在）"},{"pair":"HTTP vs HTTPS","desc":"HTTPS=HTTP+TLS加密，多了加密和身份验证，端口443 vs 80"},{"pair":"TCP vs UDP","desc":"TCP可靠面向连接（打电话），UDP快不可靠（寄平信/发短信）"},{"pair":"GET vs POST","desc":"GET取数据参数在URL，POST提交数据参数在请求体，都能传数据GET有长度限制"},{"pair":"Cookie vs Session vs Token","desc":"Cookie存浏览器，Session存服务器，Token存在客户端自包含"},{"pair":"同步 vs 异步","desc":"同步等结果（打电话等对方接），异步不等结果（留言等回电）"},{"pair":"阻塞 vs 非阻塞","desc":"阻塞是调用时卡住等结果（站着等外卖），非阻塞是立刻返回（点了外卖继续看电视）"},{"pair":"进程 vs 协程","desc":"进程是OS级有独立内存，协程是用户态轻量级由程序自己调度（goroutine）"},{"pair":"SQL vs NoSQL","desc":"SQL用表结构+SQL查询+强一致，NoSQL灵活结构+最终一致+高扩展"},{"pair":"主键 vs 外键","desc":"主键唯一标识本表记录，外键引用其他表主键建立关系"},{"pair":"索引 vs 主键","desc":"主键自动创建唯一索引，索引是加速查询的数据结构不一定唯一"},{"pair":"脏读 vs 不可重复读 vs 幻读","desc":"脏读=读到未提交数据；不可重复读=同一行两次读不同；幻读=两次查行数不同"},{"pair":"悲观锁 vs 乐观锁","desc":"悲观锁先锁了再说（SELECT FOR UPDATE），乐观锁提交时检查版本号"},{"pair":"冗余 vs 反范式","desc":"反范式是故意冗余用空间换时间，冗余也可能是不好的设计"},{"pair":"Git Merge vs Rebase","desc":"Merge保留分支历史生成合并提交，Rebase把提交「移」到目标分支后变线性"},{"pair":"硬链接 vs 软链接","desc":"硬链接指向磁盘数据（同一文件多个名字），软链接指向路径（快捷方式）"},{"pair":"编译型 vs 解释型","desc":"编译型先整体翻译再执行快，解释型边翻译边执行灵活慢"},{"pair":"静态类型 vs 动态类型","desc":"静态类型编译时确定（Java要声明int），动态类型运行时确定（Python变量随便变）"},{"pair":"强类型 vs 弱类型","desc":"强类型不同类型不能混用（Python 1+「2」报错），弱类型自动转换（JS 1+「2」=「12」）"},{"pair":"面向对象 vs 面向过程","desc":"面向过程以步骤为中心（C），面向对象以对象为中心封装数据和方法（Java）"},{"pair":"重载 vs 重写（Override）","desc":"重载是同一个类里同名方法参数不同，重写是子类重新实现父类方法"},{"pair":"接口 vs 抽象类","desc":"接口是纯契约（implements多个），抽象类可以有实现（extends一个）"},{"pair":"== vs equals","desc":"==比较引用地址（是不是同一个对象），equals比较内容（逻辑相等）"},{"pair":"数组 vs 链表","desc":"数组连续内存随机访问O(1)插入删除O(n)，链表不连续插入删除O(1)访问O(n)"},{"pair":"B树 vs B+树","desc":"B树所有节点存数据，B+树只叶子存数据+叶子链表，范围查询B+树快（数据库索引用B+）"},{"pair":"哈希表 vs 平衡树","desc":"哈希表查找O(1)但无序，平衡树查找O(log n)但有序（范围查询友好）"},{"pair":"白盒测试 vs 黑盒测试","desc":"白盒看内部代码结构测试逻辑路径，黑盒不管内部只测输入输出"},{"pair":"单元测试 vs 集成测试","desc":"单元测单个函数/模块，集成测多个模块配合"},{"pair":"瀑布模型 vs 敏捷开发","desc":"瀑布线性一步一步不回头，敏捷迭代小步快跑拥抱变化"},{"pair":"微服务 vs 单体","desc":"单体所有功能在一个应用里，微服务拆成独立小服务各自部署"},{"pair":"Docker容器 vs 虚拟机","desc":"容器共享OS内核轻量秒级启动，虚拟机有独立OS重分钟级启动"},{"pair":"IaaS vs PaaS vs SaaS","desc":"IaaS租基础设施（虚拟机），PaaS租平台（数据库/中间件），SaaS租软件（钉钉）"},{"pair":"机器学习 vs 深度学习","desc":"深度学习是机器学习子集，用多层神经网络；传统机器学习需要手动提取特征"},{"pair":"监督 vs 无监督 vs 强化学习","desc":"监督有标签学分类/回归，无监督没标签找规律聚类，强化学习靠奖惩试错学策略"},{"pair":"过拟合 vs 欠拟合","desc":"过拟合学太死训练好测试差，欠拟合太简单连训练都学不好"},{"pair":"AI训练 vs AI推理","desc":"训练是教模型（慢贵要大量数据GPU集群），推理是用模型（快便宜单卡/端侧）"},{"pair":"RAG vs 微调","desc":"RAG外挂知识库检索回答（知识可更新成本低），微调重新训练模型参数（学风格/格式）"},{"pair":"L1正则 vs L2正则","desc":"L1产生稀疏解（特征选择），L2让权重变小（防过拟合更稳定）"},{"pair":"BIOS/UEFI vs 操作系统","desc":"BIOS/UEFI是开机第一个跑的固件（初始化硬件），OS是BIOS之后加载的"},{"pair":"路由器 vs 交换机","desc":"路由器连不同网络根据IP转发（三层），交换机连同网络根据MAC转发（二层）"},{"pair":"编译器 vs 解释器","desc":"编译器一次性翻译完再执行快（C/Go），解释器边读边执行灵活慢（Python/JS）"},{"pair":"LL(1) vs LR分析","desc":"LL自顶向下跟着文法递归读（手写解析器常用），LR自下而上查表驱动（编译器生成器用）"},{"pair":"编译 vs 链接 vs 运行","desc":"编译=源码→目标码，链接=多个目标码合并成可执行文件，运行=真正执行"},{"pair":"进程 vs 线程（进阶追问）","desc":"进程独立内存空间（隔间），线程共享进程内存（同一间房）；进程开销大、线程更轻"},{"pair":"CAS vs 锁","desc":"CAS无锁自旋（乐观，适合冲突少），锁阻塞等待（悲观，冲突多时更稳）；CAS有ABA陷阱"},{"pair":"乐观锁 vs 悲观锁","desc":"乐观锁提交时检查版本（适合读多），悲观锁先锁再操作（适合写多）"},{"pair":"脏读 vs 不可重复读 vs 幻读（追问层）","desc":"脏读读到未提交数据；不可重复读同一行两次不同；幻读两次查询行数不同（间隙锁解决）"},{"pair":"Raft vs Paxos","desc":"两者都是分布式一致性协议；Raft把问题拆成Leader选举+日志复制，更好理解更好实现，工程界主流"},{"pair":"一致性哈希 vs 普通哈希","desc":"普通哈希取模，节点变化全部重排；一致性哈希用哈希环+虚拟节点，节点变化只迁移少量数据"},{"pair":"主键 vs 唯一索引","desc":"主键唯一且非空、一张表只有一个；唯一索引唯一但可为空、可建多个"},{"pair":"UDP vs TCP（追问层）","desc":"TCP要三次握手保序可靠（打电话），UDP无连接快（发短信）；直播/游戏用UDP"},{"pair":"ESLint vs 编译器","desc":"ESLint是静态检查工具只报问题不执行，编译器做完整翻译还执行"},{"pair":"影响因子 vs 期刊分区 vs CCF","desc":"IF看期刊被引热度；分区把期刊分档次（中科院1-4区/JCR Q1-Q4）；CCF是计算机领域自己的会议/期刊分级清单——毕业和评奖先看院校认哪个"},{"pair":"会议论文 vs 期刊论文","desc":"会议周期快双盲审、计算机领域认可度高；期刊见刊慢，按人文科学默认「期刊=正式」在计算机不成立"}]}</script>
<script>
// 名词汇工具：搜索 + 场景互斥 + 章节横向走廊 + 分页 + 列表/卡片双视图 + 弹层刷词(含辨析联动) + 辨析长廊
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('appData').textContent);
  var terms = DATA.terms, confusions = DATA.confusions, chapters = DATA.chapters;
  var chTitles = {};
  var chFullTitles = {};
  chapters.forEach(function (c) {
    chFullTitles[c.id] = c.title;
    var n = parseInt(c.id.slice(2), 10);
    if (isNaN(n)) { chTitles[c.id] = c.title; return; }
    chTitles[c.id] = ('0' + n).slice(-2) + ' ' + c.title.replace(/^第?[零一二三四五六七八九十]+章?[、，]?\s*/, '');
  });

  var elInput = document.getElementById('searchInput');
  var elResults = document.getElementById('results');
  var elSummary = document.getElementById('summaryText');
  var elPagination = document.getElementById('pagination');
  var elPageSize = document.getElementById('pageSizeSelect');
  var elBackTop = document.getElementById('backTop');
  var elChapterRail = document.getElementById('chapterRail');
  var elSceneBar = document.getElementById('sceneBar');
  var elSceneBarName = document.getElementById('sceneBarName');
  var elMoreChapters = document.getElementById('moreChapters');
  var elMask = document.getElementById('modalMask');
  var elModalBody = document.getElementById('modalBody');
  var elModalNav = document.querySelector('.modal-nav');
  var state = { scene: 'all', chapter: 'all', q: '', page: 1, pageSize: 15, view: 'list' };
  var sceneNames = { all: '', '入门': '新手入门', '面试': '面试刷词', '升学科研': '升学保研', '职场': '职场黑话', '前沿': '2026前沿' };

  // ---- 章节：主要章节按钮（两位序号+主题词）+ 其余进「更多章节」下拉 ----
  var MAIN_CHAPTERS = 7;
  function chNo(c) { return ('0' + parseInt(c.id.slice(2), 10)).slice(-2); }
  chapters.forEach(function (c) {
    if (c.id === 'appendix1' || c.id === 'other' || c.id === 'x') return;
    var chIdx = parseInt(c.id.slice(2), 10);
    var topic = c.title.replace(/^第?[零一二三四五六七八九十]+章?[、，]?\s*/, '');
    var label = chNo(c) + ' ' + topic;
    if (chIdx < MAIN_CHAPTERS) {
      var btn = document.createElement('button');
      btn.className = 'rail-pill';
      btn.dataset.ch = c.id;
      btn.title = chFullTitles[c.id];
      btn.textContent = label;
      elChapterRail.appendChild(btn);
    } else {
      var opt = document.createElement('option');
      opt.value = c.id;
      opt.title = chFullTitles[c.id];
      opt.textContent = label;
      elMoreChapters.appendChild(opt);
    }
  });
  var confOpt = document.createElement('option');
  confOpt.value = 'conf';
  confOpt.textContent = '易混淆名词辨析 · ' + confusions.length + ' 组';
  elMoreChapters.appendChild(confOpt);
  elChapterRail.appendChild(elMoreChapters);

  // ---- 辨析功能新用户引导（仅首次进入，交互后不再出现） ----
  (function () {
    var TIP_KEY = 'dict-conf-tip-v1';
    var seen = false;
    try { seen = localStorage.getItem(TIP_KEY) === '1'; } catch (e) {}
    if (seen) return;
    var bubble = document.createElement('div');
    bubble.className = 'tip-bubble';
    bubble.textContent = '还有 ' + confusions.length + ' 组易混淆辨析，点这里';
    var railWrap = elChapterRail.parentElement;
    railWrap.appendChild(bubble);
    function posBubble() {
      var wr = railWrap.getBoundingClientRect();
      var sr = elMoreChapters.getBoundingClientRect();
      var left = sr.left - wr.left + (sr.width - bubble.offsetWidth) / 2;
      left = Math.max(2, Math.min(left, wr.width - bubble.offsetWidth - 2));
      bubble.style.left = left + 'px';
      bubble.style.top = Math.max(2, sr.top - wr.top - bubble.offsetHeight - 6) + 'px';
      bubble.style.opacity = '1';
    }
    posBubble();
    var rafId = requestAnimationFrame(function () { posBubble(); });
    window.addEventListener('resize', posBubble);
    function dismissTip() {
      bubble.classList.add('tip-hide');
      setTimeout(function () { if (bubble.parentNode) bubble.remove(); }, 400);
      window.removeEventListener('resize', posBubble);
      document.removeEventListener('click', dismissTip);
      try { localStorage.setItem(TIP_KEY, '1'); } catch (e) {}
    }
    setTimeout(function () {
      if (bubble.parentNode) dismissTip();
    }, 4500);
    document.addEventListener('click', dismissTip);
    void rafId;
  })();
  // ---- 分享链接：集中同步 hash（q=搜索词 & ch=章节 & s=场景） ----
  function updateHash() {
    if (!history.replaceState) return;
    var parts = [];
    if (state.q) parts.push('q=' + encodeURIComponent(state.q));
    if (state.chapter !== 'all') parts.push('ch=' + encodeURIComponent(state.chapter));
    if (state.scene !== 'all') parts.push('s=' + encodeURIComponent(state.scene));
    history.replaceState(null, '', parts.length ? '#?' + parts.join('&') : location.pathname + location.search);
  }
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }
  function legacyCopy(txt) {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('链接已复制'); } catch (e) { showToast('复制失败，请手动复制地址栏链接'); }
    document.body.removeChild(ta);
  }
  document.getElementById('shareBtn').addEventListener('click', function () {
    updateHash();
    var url = location.href;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(function () { showToast('链接已复制'); }, function () { legacyCopy(url); });
    } else legacyCopy(url);
  });

  function clearScene() {
    if (state.scene !== 'all') {
      state.scene = 'all';
      elSceneBar.classList.remove('show');
    }
  }
  elChapterRail.addEventListener('click', function (e) {
    var btn = e.target.closest('.rail-pill'); if (!btn || !btn.dataset.ch) return;
    state.chapter = btn.dataset.ch;
    document.querySelectorAll('.rail-pill').forEach(function (p) {
      p.classList.toggle('active', p === btn);
    });
    clearScene();
    elMoreChapters.value = 'all';
    state.page = 1; render();
    updateHash();
  });
  elMoreChapters.addEventListener('change', function () {
    var v = elMoreChapters.value;
    if (v !== 'all' && v !== 'conf' && !chTitles[v]) {
      elMoreChapters.value = (state.chapter === 'all' || state.chapter === 'conf') ? 'all' : state.chapter;
      return;
    }
    state.chapter = v;
    document.querySelectorAll('.rail-pill').forEach(function (p) {
      p.classList.toggle('active', p.dataset.ch === 'all' && v === 'all');
    });
    clearScene();
    state.page = 1; render();
    updateHash();
  });

  // ---- 场景筛选：点卡片彩色标签触发，章节自动回「全部」 ----
  function setScene(s) {
    state.scene = s;
    state.chapter = 'all';
    document.querySelectorAll('.rail-pill').forEach(function (p) {
      p.classList.toggle('active', p.dataset.ch === 'all');
    });
    var on = s !== 'all';
    elSceneBar.classList.toggle('show', on);
    if (on) elSceneBarName.textContent = sceneNames[s] || s;
    state.page = 1; render();
    updateHash();
  }
  document.getElementById('sceneBarClear').addEventListener('click', function () {
    setScene('all');
  });

  // ---- 每页条数 ----
  elPageSize.addEventListener('change', function () {
    state.pageSize = parseInt(elPageSize.value, 10) || 0;
    state.page = 1; render();
  });

  // ---- 视图切换 ----
  try { state.view = localStorage.getItem('dict-view') === 'list' ? 'list' : 'grid'; } catch (e) {}
  syncViewBtns();
  document.getElementById('viewToggle').addEventListener('click', function (e) {
    var btn = e.target.closest('.view-btn'); if (!btn || btn.dataset.view === state.view) return;
    state.view = btn.dataset.view;
    syncViewBtns();
    try { localStorage.setItem('dict-view', state.view); } catch (err) {}
    render();
  });
  function syncViewBtns() {
    document.querySelectorAll('.view-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.view === state.view);
    });
  }

  // ---- 搜索（防抖） ----
  var debounceTimer = null;
  elInput.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      state.q = elInput.value.trim().toLowerCase();
      state.page = 1;
      render();
      updateHash();
    }, 150);
  });

  // ---- 匹配评分 ----
  function matchTerm(t, q) {
    if (!q) return { hit: true, score: 0 };
    var name = (t.term + ' ' + (t.en || '')).toLowerCase();
    if (name.indexOf(q) === 0) return { hit: true, score: 8 };
    if (name.indexOf(q) !== -1) return { hit: true, score: 6 };
    if (t.py && t.py.indexOf(q) !== -1) return { hit: true, score: 4 };
    if (t.pyFull && t.pyFull.indexOf(q) !== -1) return { hit: true, score: 4 };
    if (t.searchText && t.searchText.indexOf(q) !== -1) return { hit: true, score: 2 };
    return { hit: false };
  }

  // ---- 渲染工具 ----
  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hl(text, q) {
    if (!q) return esc(text);
    var lower = text.toLowerCase(), idx = lower.indexOf(q);
    if (idx === -1) return esc(text);
    return esc(text.slice(0, idx)) + '<span class="hl">' + esc(text.slice(idx, idx + q.length)) + '</span>' + esc(text.slice(idx + q.length));
  }

  function getFiltered() {
    var q = state.q;
    var list = [];
    terms.forEach(function (t) {
      if (state.chapter !== 'all' && t.chapter !== state.chapter) return;
      if (state.scene !== 'all' && t.tags.indexOf(state.scene) === -1) return;
      var m = matchTerm(t, q);
      if (m.hit) list.push({ t: t, score: m.score });
    });
    list.sort(function (a, b) { return b.score - a.score; });
    return list;
  }

  function makeTags(t) {
    return t.tags.map(function (g) {
      return '<span class="tag scene-' + esc(g) + '" data-scene="' + esc(g) + '" tabindex="0" role="button" title="按场景筛选「' + esc(g) + '」">' + esc(g) + '</span>';
    }).join('');
  }

  // ---- 词条渲染 ----
  function renderConf() {
    var q = state.q;
    var list = confusions.filter(function (c) {
      if (!q) return true;
      return (c.pair + ' ' + c.desc).toLowerCase().indexOf(q) !== -1;
    });
    var parts = [];
    if (q) parts.push('关键词「' + elInput.value.trim() + '」');
    var sumHtml = '共 <b class="sum-num">' + list.length + '</b> 组易混淆辨析';
    if (parts.length) sumHtml += ' · 筛选：' + parts.map(function (p) {
      return '<b>' + esc(p) + '</b>';
    }).join(' + ');
    sumHtml += '<span style="opacity:.75"> · 记住区别一句话，面试笔试高频</span>';
    elSummary.innerHTML = sumHtml;
    elPagination.innerHTML = '';
    if (!list.length) {
      elResults.innerHTML = '<div class="empty">没有匹配的辨析组，换个关键词试试<br>如 <b>事务</b>、<b>进程</b>、<b>TCP</b></div>';
      return;
    }
    var html = '<div class="conf-view">';
    list.forEach(function (c) {
      var ps = c.pair.split(' vs ');
      var sides = '';
      if (ps.length >= 2) {
        sides = '<div class="conf-side">' + hl(ps[0], q) + '</div><span class="conf-vs">VS</span>' +
          (ps.length === 3 ? '<div class="conf-side">' + hl(ps[1], q) + '</div><span class="conf-vs">VS</span><div class="conf-side">' + hl(ps[2], q) + '</div>' : '<div class="conf-side">' + hl(ps[1], q) + '</div>');
      } else {
        sides = '<div class="conf-side" style="flex:1.6">' + hl(c.pair, q) + '</div>';
      }
      html += '<div class="conf-card"><div class="conf-head">' + sides + '</div><div class="conf-desc">' + hl(c.desc, q) + '</div></div>';
    });
    html += '</div>';
    elResults.innerHTML = html;
    runReveal();
  }

  function render() {
    if (state.chapter === 'conf') { renderConf(); return; }
    var q = state.q;
    var list = getFiltered();
    var total = list.length;
    var pageSize = state.pageSize || total || 1;
    var maxPage = Math.max(1, Math.ceil(total / pageSize));
    if (state.page > maxPage) state.page = maxPage;
    var start = (state.page - 1) * pageSize;
    var pageList = pageSize === total ? list : list.slice(start, start + pageSize);

    var sceneName = sceneNames[state.scene];
    var parts = [];
    if (state.scene !== 'all') parts.push('场景「' + sceneName + '」');
    if (state.chapter !== 'all') parts.push('章节「' + chTitles[state.chapter] + '」');
    if (q) parts.push('关键词「' + elInput.value.trim() + '」');
    var sumHtml = '共 <b class="sum-num">' + total + '</b> 个词条';
    if (parts.length) sumHtml += ' · 筛选：' + parts.map(function (p) {
      return '<b>' + esc(p) + '</b>';
    }).join(' + ');
    sumHtml += '<span style="opacity:.75"> · 点词条展开 / 点卡片看全貌；点彩色标签可按场景筛选</span>';
    elSummary.innerHTML = sumHtml;

    if (!total) {
      elResults.innerHTML = '<div class="empty">没有找到匹配的词条<br>试试 <b>并发</b>、<b>索引</b>、<b>保研</b>，或拼音首字母如 <b>cxsj</b></div>';
      elPagination.innerHTML = '';
      return;
    }

    if (state.view === 'grid') {
      var gh = '';
      pageList.forEach(function (it) {
        var t = it.t;
        var chName = chTitles[t.chapter] || '';
        var enHtml = t.en ? '<span class="en">' + esc(t.en) + '</span>' : '';
        var tagsHtml = makeTags(t);
        gh += '<div class="grid-card" data-id="' + t.id + '" tabindex="0" role="button" title="' + esc(chName) + '">' +
          '<span class="term-ch">' + esc(chName) + '</span>' +
          '<span class="term-name">' + hl(t.term, q) + enHtml + '</span>' +
          '<div class="term-plain">' + hl(t.plain, q) + '</div>' +
          (tagsHtml ? '<div class="tags">' + tagsHtml + '</div>' : '') + '</div>';
      });
      elResults.innerHTML = '<div class="grid-view">' + gh + '</div>';
    } else {
      var html = '';
      pageList.forEach(function (it) {
        var t = it.t;
        var chName = chTitles[t.chapter] || '';
        var enHtml = t.en ? '<span class="en">' + esc(t.en) + '</span>' : '';
        var tagsHtml = makeTags(t);
        var detailHtml = '';
        if (t.analogy) detailHtml += '<div class="detail-row"><b>类比</b>' + hl(t.analogy, q) + '</div>';
        if (t.tip) detailHtml += '<div class="detail-row"><b>点拨</b>' + hl(t.tip, q) + '</div>';
        html += '<div class="term-card" data-id="' + t.id + '" tabindex="0" role="button">' +
          '<div class="term-top"><span class="term-name">' + hl(t.term, q) + enHtml + '</span>' +
          '<span class="term-ch">' + esc(chName) + '</span></div>' +
          '<div class="term-plain">' + hl(t.plain, q) + '</div>' +
          (tagsHtml ? '<div class="tags">' + tagsHtml + '</div>' : '') +
          (detailHtml ? '<div class="term-detail">' + detailHtml + '</div>' : '') +
          '</div>';
      });
      elResults.innerHTML = html;
    }
    renderPagination(maxPage, total);
    runReveal();
  }

  function renderPagination(maxPage, total) {
    if (state.pageSize === 0 || maxPage <= 1) { elPagination.innerHTML = ''; return; }
    var cur = state.page;
    var set = new Set([1, maxPage, cur - 1, cur, cur + 1]);
    var arr = [];
    set.forEach(function (p) { if (p >= 1 && p <= maxPage) arr.push(p); });
    arr.sort(function (a, b) { return a - b; });
    var html = '';
    if (cur > 1) html += '<button class="pg-btn" data-page="' + (cur - 1) + '">&#8249; 上一页</button>';
    var prev = 0;
    arr.forEach(function (p) {
      if (prev && p - prev > 1) html += '<span class="pg-ellipsis">&hellip;</span>';
      html += '<button class="pg-btn' + (p === cur ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
      prev = p;
    });
    if (cur < maxPage) html += '<button class="pg-btn" data-page="' + (cur + 1) + '">下一页 &#8250;</button>';
    elPagination.innerHTML = html;
  }

  // ---- 词条 → 辨析联动 ----
  function confForTerm(term) {
    var clean = term.replace(/[（(].*?[）)]/g, '').trim();
    var hits = [];
    confusions.forEach(function (c) {
      var sides = c.pair.split(' vs ');
      var hit = sides.some(function (s) {
        var sClean = s.replace(/[（(].*?[）)]/g, '').trim();
        return sClean === clean || (sClean.length >= 2 && clean.indexOf(sClean) !== -1) || (clean.length >= 2 && sClean.indexOf(clean) !== -1);
      });
      if (hit) hits.push(c);
    });
    return hits;
  }

  // ---- 弹层刷词 ----
  var modalList = [], modalIdx = 0;
  function openModal(idx) {
    modalIdx = idx;
    var it = modalList[idx]; if (!it) return;
    var t = it.t;
    var q = state.q;
    var html = '<div class="modal-term">' + hl(t.term, q) + (t.en ? '<span class="en">' + esc(t.en) + '</span>' : '') + '</div>';
    html += '<div class="modal-meta">' + makeTags(t) + '<span class="modal-ch">' + esc(chTitles[t.chapter] || '') + '</span></div>';
    html += '<div class="modal-plain">' + hl(t.plain, q) + '</div>';
    if (t.analogy || t.tip) html += '<div class="modal-rows">';
    if (t.analogy) html += '<div class="detail-row"><b>类比</b>' + hl(t.analogy, q) + '</div>';
    if (t.tip) html += '<div class="detail-row"><b>点拨</b>' + hl(t.tip, q) + '</div>';
    if (t.analogy || t.tip) html += '</div>';

    var confs = confForTerm(t.term);
    if (confs.length) {
      html += '<div class="modal-conf"><b style="color:var(--accent);font-size:12px">&#9889; 易混淆辨析</b>';
      confs.forEach(function (c) {
        html += '<div class="mc-item"><b>' + esc(c.pair) + '</b>' + esc(c.desc) + '</div>';
      });
      html += '</div>';
    }
    elModalBody.innerHTML = html;
    elModalNav.style.display = '';
    document.getElementById('modalPrev').disabled = idx <= 0;
    document.getElementById('modalNext').disabled = idx >= modalList.length - 1;
    elMask.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    elMask.style.display = 'none';
    document.body.style.overflow = '';
  }

  elResults.addEventListener('click', function (e) {
    var tag = e.target.closest('.tag');
    if (tag) {
      e.stopPropagation();
      setScene(tag.dataset.scene);
      return;
    }
    var gcard = e.target.closest('.grid-card');
    if (gcard) {
      var id = gcard.dataset.id;
      var list = getFiltered();
      var pageSize = state.pageSize || list.length || 1;
      var start = (state.page - 1) * pageSize;
      modalList = list.slice(start, start + pageSize);
      var idx = -1;
      for (var i = 0; i < modalList.length; i++) if (modalList[i].t.id === id) { idx = i; break; }
      if (idx >= 0) openModal(idx);
      return;
    }
    var card = e.target.closest('.term-card'); if (!card) return;
    card.classList.toggle('open');
  });
  elResults.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var el = e.target.closest ? (e.target.closest('.tag') || e.target.closest('.grid-card') || e.target.closest('.term-card')) : null;
    if (el) { e.preventDefault(); el.click(); }
  });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  elMask.addEventListener('click', function (e) { if (e.target === elMask) closeModal(); });
  elModalBody.addEventListener('click', function (e) {
    var tag = e.target.closest('.tag');
    if (tag) { closeModal(); setScene(tag.dataset.scene); }
  });
  document.getElementById('modalPrev').addEventListener('click', function () { if (modalIdx > 0) openModal(modalIdx - 1); });
  document.getElementById('modalNext').addEventListener('click', function () { if (modalIdx < modalList.length - 1) openModal(modalIdx + 1); });
  document.addEventListener('keydown', function (e) {
    if (elMask.style.display === 'none') return;
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'ArrowLeft' && elModalNav.style.display !== 'none') document.getElementById('modalPrev').click();
    else if (e.key === 'ArrowRight' && elModalNav.style.display !== 'none') document.getElementById('modalNext').click();
  });

  // ---- spotlight 光斑（单委托监听，容器级） ----
  elResults.addEventListener('pointermove', function (e) {
    var rect = elResults.getBoundingClientRect();
    var x = e.clientX - rect.left, y = e.clientY - rect.top;
    elResults.style.setProperty('--mx', x + 'px');
    elResults.style.setProperty('--my', y + 'px');
  });
  elResults.addEventListener('pointerleave', function () {
    elResults.style.setProperty('--mx', '50%');
    elResults.style.setProperty('--my', '50%');
  });

  // ---- 错峰入场 ----
  function runReveal() {
    var cards = elResults.querySelectorAll('.term-card, .grid-card');
    for (var i = 0; i < cards.length && i < 12; i++) {
      (function (card, n) {
        card.classList.add('reveal');
        card.style.setProperty('--d', (n * 40) + 'ms');
        if (window.IntersectionObserver) {
          var io = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) {
              card.classList.add('in');
              io.disconnect();
            }
          }, { threshold: 0.1 });
          io.observe(card);
        } else {
          card.classList.add('in');
        }
      })(cards[i], i);
    }
  }

  // ---- 分页点击 ----
  elPagination.addEventListener('click', function (e) {
    var btn = e.target.closest('.pg-btn'); if (!btn || btn.disabled) return;
    var p = parseInt(btn.dataset.page, 10);
    if (!p || p === state.page) return;
    state.page = p; render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---- 回到顶部 ----
  window.addEventListener('scroll', function () {
    if (window.scrollY > 600) elBackTop.classList.add('show');
    else elBackTop.classList.remove('show');
  });
  elBackTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    elInput.focus({ preventScroll: true });
  });

  // ---- 主题 ----
  var saved = null;
  try { saved = localStorage.getItem('dict-theme'); } catch (e) {}
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('themeBtn').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) { document.documentElement.removeAttribute('data-theme'); try { localStorage.setItem('dict-theme', 'light'); } catch (e) {} }
    else { document.documentElement.setAttribute('data-theme', 'dark'); try { localStorage.setItem('dict-theme', 'dark'); } catch (e) {} }
  });

  // ---- 初始渲染 + hash 支持（#?q=xxx&ch=ch05&s=面试） ----
  var hm = location.hash;
  var qm = hm.match(/[?&]q=([^&]+)/);
  if (qm) {
    state.q = decodeURIComponent(qm[1]).toLowerCase();
    elInput.value = decodeURIComponent(qm[1]);
  }
  var cm = hm.match(/[?&]ch=([^&]+)/);
  if (cm) {
    var cv = decodeURIComponent(cm[1]);
    if (cv === 'all' || cv === 'conf' || chTitles[cv]) {
      state.chapter = cv;
      document.querySelectorAll('.rail-pill').forEach(function (p) {
        p.classList.toggle('active', p.dataset.ch === cv);
      });
      elMoreChapters.value = cv === 'conf' ? 'conf' : 'all';
    }
  }
  var sm = hm.match(/[?&]s=([^&]+)/);
  if (sm) {
    var sv = decodeURIComponent(sm[1]);
    if (sceneNames[sv]) {
      state.scene = sv;
      state.chapter = 'all';
      document.querySelectorAll('.rail-pill').forEach(function (p) {
        p.classList.toggle('active', p.dataset.ch === 'all');
      });
      elMoreChapters.value = 'all';
      elSceneBar.classList.add('show');
      elSceneBarName.textContent = sceneNames[sv];
    }
  }
  state.pageSize = parseInt(elPageSize.value, 10) || 15;
  render();
})();
</script>
</body>
</html>
