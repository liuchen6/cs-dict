<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算机专业名词大全 · 学生通关版</title>
<meta name="description" content="689 个计算机核心名词，四层助记：人话翻译、生活类比、学习点拨、易混淆辨析。面向本科生/硕士生的免费查词工具。">
<style>
:root {
  --bg:#f6f7fb; --bg-grad:#eef2ff; --card:#ffffff; --text:#171c26; --text2:#5c6474;
  --line:#e6e8f0; --accent:#4f6ef7; --accent-deep:#3b55d9; --accent-soft:#eef1ff;
  --tag-bg:#f1f3f9; --tag-text:#4b5563; --radius:14px;
  --shadow-sm:0 1px 2px rgba(23,28,38,.05),0 2px 8px rgba(23,28,38,.04);
  --shadow-md:0 4px 12px rgba(23,28,38,.08),0 2px 4px rgba(23,28,38,.05);
  --shadow-lg:0 12px 32px rgba(79,110,247,.14);
  /* 章节按钮配色（淡底深字） */
  --ch0-bg:#fff4e5; --ch0-fg:#b45309;
  --ch1-bg:#e8f4fd; --ch1-fg:#0369a1;
  --ch2-bg:#eaf7ee; --ch2-fg:#15803d;
  --ch3-bg:#f3effc; --ch3-fg:#6d28d9;
  --ch4-bg:#fbece9; --ch4-fg:#b91c1c;
  --ch5-bg:#e8ebfd; --ch5-fg:#4338ca;
  --ch6-bg:#e7f1fe; --ch6-fg:#1d4ed8;
}
[data-theme="dark"] {
  --bg:#0f1220; --bg-grad:#171c33; --card:#1a1f33; --text:#eef0f8; --text2:#9aa3bc;
  --line:#2a3048; --accent:#7c93ff; --accent-deep:#9db0ff; --accent-soft:#222a4d;
  --tag-bg:#272e4a; --tag-text:#c2c9e0;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  /* 章节按钮配色（暗色深底亮字） */
  --ch0-bg:#3a2c12; --ch0-fg:#f2b15c;
  --ch1-bg:#13293d; --ch1-fg:#5bc0f0;
  --ch2-bg:#14321f; --ch2-fg:#5ad08a;
  --ch3-bg:#2a1f4a; --ch3-fg:#b39dff;
  --ch4-bg:#3a1d18; --ch4-fg:#f08a72;
  --ch5-bg:#1e2452; --ch5-fg:#a5b4fc;
  --ch6-bg:#14273f; --ch6-fg:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  background-image:radial-gradient(60% 40% at 15% 0%,var(--bg-grad),transparent);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
/* ===== 顶栏 ===== */
header{
  position:sticky;top:0;z-index:100;
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:14px 20px;
}
.header-inner{max-width:920px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-size:19px;font-weight:800;white-space:nowrap;letter-spacing:.3px}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.search-box{flex:1 1 280px;position:relative}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.search-box input{
  width:100%;padding:11px 16px 11px 40px;
  border:1.5px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--text);font-size:15px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search-box input::placeholder{color:var(--text2);opacity:.7}
.icon-btn{
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:12px;padding:9px 13px;cursor:pointer;font-size:16px;
  transition:border-color .2s,transform .15s;
}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.h-btns{display:flex;gap:8px}
/* ===== 主体 ===== */
main{max-width:920px;margin:0 auto;padding:20px 20px 60px}
/* ===== 章节走廊（唯一分类） ===== */
.rail-wrap{position:relative;margin-bottom:16px}
.rail-label{font-size:12px;color:var(--text2);margin:0 2px 6px;display:flex;align-items:center;justify-content:space-between}
.rail{
  display:flex;gap:3px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 1px 8px;
  scrollbar-width:none;-ms-overflow-style:none;flex-wrap:wrap;
}
.rail::-webkit-scrollbar{display:none}
.rail-pill{
  flex-shrink:0;scroll-snap-align:start;border:1.5px solid var(--line);background:var(--card);
  color:var(--text2);border-radius:999px;padding:6px 7px;font-size:12px;cursor:pointer;
  transition:all .15s;font-weight:500;white-space:nowrap;
}
.rail-pill:hover{border-color:var(--accent);color:var(--accent)}
/* 章节按钮彩色（淡底深字；激活态被下方 .active 渐变覆盖） */
.rail-pill[data-ch="ch0"]{background:var(--ch0-bg);color:var(--ch0-fg)}
.rail-pill[data-ch="ch0"]:hover{background:color-mix(in srgb,var(--ch0-bg) 86%,var(--ch0-fg));border-color:var(--ch0-fg);color:var(--ch0-fg)}
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  .rail-pill[data-ch="ch0"]:hover{border-color:var(--ch0-fg);color:var(--ch0-fg)}
  .rail-pill[data-ch="ch1"]:hover{border-color:var(--ch1-fg);color:var(--ch1-fg)}
  .rail-pill[data-ch="ch2"]:hover{border-color:var(--ch2-fg);color:var(--ch2-fg)}
  .rail-pill[data-ch="ch3"]:hover{border-color:var(--ch3-fg);color:var(--ch3-fg)}
  .rail-pill[data-ch="ch4"]:hover{border-color:var(--ch4-fg);color:var(--ch4-fg)}
  .rail-pill[data-ch="ch5"]:hover{border-color:var(--ch5-fg);color:var(--ch5-fg)}
  .rail-pill[data-ch="ch6"]:hover{border-color:var(--ch6-fg);color:var(--ch6-fg)}
}
.rail-pill[data-ch="ch1"]{background:var(--ch1-bg);color:var(--ch1-fg)}
.rail-pill[data-ch="ch1"]:hover{background:color-mix(in srgb,var(--ch1-bg) 86%,var(--ch1-fg));border-color:var(--ch1-fg);color:var(--ch1-fg)}
.rail-pill[data-ch="ch2"]{background:var(--ch2-bg);color:var(--ch2-fg)}
.rail-pill[data-ch="ch2"]:hover{background:color-mix(in srgb,var(--ch2-bg) 86%,var(--ch2-fg));border-color:var(--ch2-fg);color:var(--ch2-fg)}
.rail-pill[data-ch="ch3"]{background:var(--ch3-bg);color:var(--ch3-fg)}
.rail-pill[data-ch="ch3"]:hover{background:color-mix(in srgb,var(--ch3-bg) 86%,var(--ch3-fg));border-color:var(--ch3-fg);color:var(--ch3-fg)}
.rail-pill[data-ch="ch4"]{background:var(--ch4-bg);color:var(--ch4-fg)}
.rail-pill[data-ch="ch4"]:hover{background:color-mix(in srgb,var(--ch4-bg) 86%,var(--ch4-fg));border-color:var(--ch4-fg);color:var(--ch4-fg)}
.rail-pill[data-ch="ch5"]{background:var(--ch5-bg);color:var(--ch5-fg)}
.rail-pill[data-ch="ch5"]:hover{background:color-mix(in srgb,var(--ch5-bg) 86%,var(--ch5-fg));border-color:var(--ch5-fg);color:var(--ch5-fg)}
.rail-pill[data-ch="ch6"]{background:var(--ch6-bg);color:var(--ch6-fg)}
.rail-pill[data-ch="ch6"]:hover{background:color-mix(in srgb,var(--ch6-bg) 86%,var(--ch6-fg));border-color:var(--ch6-fg);color:var(--ch6-fg)}
.rail-pill.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent;
  box-shadow:0 2px 8px rgba(79,110,247,.3);
}
.rail-select{
  flex-shrink:0;border:1.5px solid var(--line);background:var(--card);color:var(--text2);
  border-radius:999px;padding:5px 7px;font-size:12px;cursor:pointer;outline:none;
  transition:border-color .15s;max-width:150px;font-weight:500;
}
.rail-select:focus{border-color:var(--accent);color:var(--text)}
/* 键盘导航焦点样式 */
.rail-pill:focus-visible,.rail-select:focus-visible,.view-btn:focus-visible,.pg-btn:focus-visible,
.modal-nav button:focus-visible,.icon-btn:focus-visible,#backTop:focus-visible,
.modal-close:focus-visible,.scene-bar button:focus-visible,.page-size select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
/* 辨析功能新用户引导气泡 */
.tip-bubble{
  position:absolute;z-index:60;pointer-events:none;opacity:0;transition:opacity .3s;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;
  font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;
  box-shadow:0 4px 14px rgba(79,110,247,.35);white-space:nowrap;
  animation:tipBob 1.5s ease-in-out infinite;
}
.tip-bubble::after{
  content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--accent-deep);border-bottom:none;
}
.tip-bubble.tip-hide{opacity:0;animation:none}
@keyframes tipBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* 辨析卡片网格（「更多章节」→ 易混淆名词辨析） */
.conf-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:4px}
.conf-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 13px 11px;
  transition:border-color .18s,box-shadow .18s;
}
.conf-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}
.conf-head{display:flex;gap:7px;align-items:center}
.conf-side{
  flex:1;text-align:center;font-size:13px;font-weight:800;padding:8px 4px;
  background:var(--accent-soft);border-radius:8px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.conf-side+.conf-side{background:var(--tag-bg)}
.conf-vs{
  flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;
  font-size:9.5px;font-weight:800;letter-spacing:.3px;
}
.conf-desc{font-size:12.5px;color:var(--text2);margin-top:9px;line-height:1.7}
/* 场景筛选提示条（点卡片标签触发） */
.scene-bar{
  display:none;align-items:center;gap:8px;margin-bottom:14px;padding:10px 16px;
  background:linear-gradient(135deg,var(--accent-soft),var(--card));
  border:1px solid var(--line);border-radius:var(--radius);
  font-size:13px;color:var(--text);
}
.scene-bar.show{display:flex}
.scene-bar b{color:var(--accent)}
.scene-bar button{
  margin-left:auto;border:1.5px solid var(--line);background:var(--card);color:var(--text2);
  border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;transition:all .15s;
}
.scene-bar button:hover{border-color:var(--accent);color:var(--accent)}
/* 结果条 */
.summary{
  font-size:13px;color:var(--text2);margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.summary b{color:var(--accent);font-weight:800}
.summary .sum-num{font-size:15px}
.page-size{display:flex;align-items:center;gap:6px}
.page-size select{
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:8px;padding:4px 8px;font-size:12.5px;cursor:pointer;outline:none;
}
/* 视图切换（列表/卡片） */
.view-toggle{display:flex;gap:4px;background:var(--tag-bg);border-radius:9px;padding:3px}
.view-btn{border:none;background:transparent;color:var(--text2);border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:600;transition:all .15s}
.view-btn.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow-sm)}
/* 词条卡片（列表视图） */
.term-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px 14px 22px;margin-bottom:10px;cursor:pointer;
  transition:border-color .18s,box-shadow .18s,transform .18s;
  overflow:hidden;
}
.term-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));
  opacity:0;transition:opacity .18s;
}
.term-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.term-card:hover::before{opacity:1}
.term-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.term-name{font-size:16px;font-weight:700}
.term-name .en{font-weight:500;color:var(--text2);font-size:12.5px;margin-left:8px;letter-spacing:.4px}
.term-ch{font-size:11px;color:var(--text2);white-space:nowrap;flex-shrink:0;background:var(--tag-bg);padding:2px 8px;border-radius:6px}
.term-plain{font-size:14px;color:var(--text2);margin-top:5px}
.term-detail{
  display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
  animation:fadeIn .2s ease;
}
.term-card.open{box-shadow:var(--shadow-md)}
.term-card.open .term-detail{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.detail-row{font-size:13.5px;margin-bottom:9px}
.detail-row b{
  display:inline-block;min-width:2.6em;color:var(--accent);font-weight:700;
  margin-right:8px;font-size:12.5px;
}
.tags{display:inline-flex;gap:5px;margin-top:8px}
.tag{font-size:11px;background:var(--tag-bg);color:var(--tag-text);border-radius:6px;padding:2px 8px;font-weight:500;cursor:pointer;transition:box-shadow .15s,transform .15s}
.tag:hover{box-shadow:0 0 0 1.5px currentColor;transform:translateY(-1px)}
.tag.scene-面试{background:#eef2ff;color:#4f6ef7}
.tag.scene-升学科研{background:#f0fdf4;color:#16a34a}
.tag.scene-职场{background:#fff7ed;color:#ea580c}
.tag.scene-前沿{background:#fdf4ff;color:#c026d3}
.tag.scene-入门{background:#fef3c7;color:#a16207}
[data-theme="dark"] .tag.scene-面试{background:#232b4d;color:#9db0ff}
[data-theme="dark"] .tag.scene-升学科研{background:#173a2a;color:#4ade80}
[data-theme="dark"] .tag.scene-职场{background:#3d2a14;color:#fb923c}
[data-theme="dark"] .tag.scene-前沿{background:#341435;color:#e879f9}
[data-theme="dark"] .tag.scene-入门{background:#3d3313;color:#facc15}
/* ===== 卡片视图（知识卡片网格 + spotlight 光斑） ===== */
.spot{position:relative}
.spot::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(79,110,247,.09),transparent 65%);
}
.spot:hover::before{opacity:1}
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;position:relative;z-index:1}
.grid-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px 14px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow-sm);
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
.grid-card::before{
  content:"";position:absolute;left:0;top:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-deep));opacity:.85;
}
.grid-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-3px)}
.grid-card .term-name{font-size:15px;font-weight:800;display:block}
.grid-card .term-name .en{font-weight:500;color:var(--text2);font-size:11px;margin-left:6px;letter-spacing:.3px}
.grid-card .term-plain{font-size:13px;color:var(--text2);margin-top:7px;line-height:1.6}
.grid-card .term-ch{font-size:10.5px;color:var(--text2);position:absolute;top:15px;right:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-card .tags{margin-top:10px}
.grid-card .tags .tag{font-size:10.5px}
/* ===== 错峰入场 ===== */
.reveal{opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease;transition-delay:var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
/* ===== 词条弹层（旋转渐变边框） ===== */
@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}
.modal-mask{
  position:fixed;inset:0;background:rgba(13,17,32,.5);backdrop-filter:blur(4px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .16s ease;
}
.modal{
  position:relative;background:var(--card);border-radius:16px;
  max-width:720px;width:100%;max-height:88vh;overflow-y:auto;overflow-x:hidden;
  padding:28px 30px 24px;box-shadow:var(--shadow-lg);animation:popIn .18s ease;
  overflow-wrap:break-word;
}
.modal::before{
  content:"";position:absolute;inset:0;border-radius:16px;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--angle),transparent 0 70%,var(--accent) 82%,var(--accent-deep) 93%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;animation:spinAngle 6s linear infinite;z-index:-1;
}
@keyframes spinAngle{to{--angle:360deg}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal::before{animation:none}}
.modal-close{
  position:absolute;right:16px;top:16px;width:32px;height:32px;border:none;border-radius:8px;
  background:var(--tag-bg);color:var(--text2);font-size:15px;cursor:pointer;transition:all .15s;line-height:1;
}
.modal-close:hover{background:var(--accent-soft);color:var(--accent)}
.modal-term{font-size:21px;font-weight:800;padding-right:40px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.modal-term .en{font-size:13px;color:var(--text2);font-weight:500;letter-spacing:.5px}
.modal-meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.modal-ch{font-size:11.5px;color:var(--text2);background:var(--tag-bg);padding:3px 9px;border-radius:6px}
.modal-plain{font-size:15px;line-height:1.8;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.modal-rows .detail-row{font-size:14px;margin-bottom:11px}
.modal-rows .detail-row b{min-width:3em}
.modal-conf{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--text2)}
.modal-conf .mc-item{margin-top:8px;padding:9px 12px;background:var(--accent-soft);border-radius:10px;line-height:1.7}
.modal-conf .mc-item b{color:var(--accent);font-size:13.5px;margin-right:6px}
.modal-nav{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.modal-nav button{
  flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;transition:all .15s;
}
.modal-nav button:hover{border-color:var(--accent);color:var(--accent)}
.modal-nav button:disabled{opacity:.35;cursor:not-allowed}
/* 分页 */
.pagination{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin:22px 0 6px;flex-wrap:wrap;
}
.pg-btn{
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer;
  transition:all .15s;min-width:38px;text-align:center;
}
.pg-btn:hover:not(:disabled):not(.active){border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent}
.pg-btn:disabled{opacity:.38;cursor:not-allowed}
.pg-ellipsis{color:var(--text2);padding:0 2px}
.empty{
  text-align:center;color:var(--text2);padding:60px 0;
  font-size:14px;line-height:2;
}
.empty b{color:var(--accent)}
.hl{background:#fde68a;color:#1f2329;border-radius:3px;padding:0 1px}
[data-theme="dark"] .hl{background:#854d0e;color:#fef9c3}
/* 底部公众号卡片 */
footer{max-width:920px;margin:48px auto 0;padding:0 20px 60px}
.wx-card{
  position:relative;max-width:460px;margin:0 auto;
  background:linear-gradient(160deg,#f2fbf5,var(--card) 58%);
  border:1px solid var(--line);border-radius:18px;
  padding:22px 24px 20px;box-shadow:var(--shadow-sm);
  overflow:hidden;
}
[data-theme="dark"] .wx-card{background:linear-gradient(160deg,#10241a,#101418 62%)}
.wx-card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,#07c160,#10b981,transparent 85%);
}
.wx-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wx-ico{
  position:relative;width:36px;height:36px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,#07c160,#12b76a);
  box-shadow:0 4px 10px rgba(7,193,96,.35);
}
.wx-ico::before{
  content:"";position:absolute;left:7px;top:9px;width:22px;height:18px;
  background:#fff;border-radius:7px;
  background-image:radial-gradient(circle,#07c160 1.9px,transparent 2.3px);
  background-size:8px 8px;background-position:6px 5px,15px 5px;background-repeat:no-repeat;
}
.wx-ico::after{
  content:"";position:absolute;right:5px;bottom:5px;width:13px;height:11px;
  background:#fff;border-radius:5px;
  background-image:radial-gradient(circle,#07c160 1.7px,transparent 2.1px);
  background-size:7px 7px;background-position:3px 3px;background-repeat:no-repeat;
}
.wx-head b{font-size:16.5px;color:var(--text)}
.wx-tag{
  margin-left:auto;font-size:11px;color:#07c160;font-weight:600;
  background:rgba(7,193,96,.12);border:1px solid rgba(7,193,96,.35);
  padding:2px 9px;border-radius:99px;
}
.wx-desc{font-size:12.5px;line-height:1.8;color:var(--text2);margin:0 0 16px}
.wx-body{display:flex;align-items:center;gap:18px}
.wx-qr{
  width:108px;height:108px;flex:none;border-radius:12px;overflow:hidden;
  background:#fff;padding:6px;box-shadow:var(--shadow-sm);
  border:1px solid rgba(7,193,96,.25);
}
.wx-qr img{width:100%;height:100%;object-fit:contain;display:block}
.wx-hint{display:flex;flex-direction:column;gap:5px}
.wx-hint-main{font-size:14.5px;font-weight:600;color:var(--text)}
.wx-hint-sub{font-size:12px;color:var(--text2)}
.wx-hint-sub b{color:#07c160;font-weight:600}
.wx-card.no-qr .wx-qr{display:none}
.wx-note{margin-top:16px;text-align:center;font-size:11.5px;color:var(--text2);opacity:.7}
/* 轻提示 */
.toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(6px);
  background:#1f2329;color:#fff;padding:9px 18px;border-radius:99px;
  font-size:13px;z-index:200;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;box-shadow:var(--shadow-md);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[data-theme="dark"] .toast{background:#fff;color:#1f2329}
/* 打印 */
@media print{
  header,.rail-wrap,.scene-bar,.view-toggle,.pagination,#backTop,#modalMask,.tip-bubble,footer,.toast,.icon-btn{display:none!important}
  body{background:#fff;color:#000}
  main{max-width:none;padding:0}
  .summary{background:#fff;color:#000;border-color:#ddd;box-shadow:none}
  .term-card,.grid-card{border:none;box-shadow:none;background:#fff;color:#000;page-break-inside:avoid}
  .term-ch{color:#555;border-color:#ccc}
  .tag{display:none}
  .empty{background:#fff;border-color:#ddd;color:#333}
}
/* 回到顶部 */
#backTop{
  position:fixed;right:22px;bottom:26px;z-index:90;
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer;
  box-shadow:var(--shadow-md);display:none;transition:all .2s;
}
#backTop.show{display:block}
#backTop:hover{border-color:var(--accent);transform:translateY(-2px)}
/* 移动端 */
@media (max-width:640px){
  .summary{flex-direction:column;align-items:flex-start;gap:6px}
  .term-name{font-size:15px}
}
</style>

一下看看菜单里有什么！**","level":1,"tags":["入门"],"py":"shub","pyFull":"shubiaozuojianyoujian","searchText":"鼠标左键/右键 left/right click 左键=选中/打开/确认，右键=弹出更多选项菜单 左键就像「拿起东西」，右键就像「询问这东西能干嘛」 **新手最该养成的习惯：遇到任何东西，先右键点一下看看菜单里有什么！**"},{"id":"t0010","term":"双击","en":"Double Click","chapter":"ch0","section":"0.1 最基础的电脑常识（开机之后你看到的一切）","plain":"快速连点鼠标左键两下，用来打开文件/软件","analogy":"就像敲两下门，敲一下没人理，敲两下门就开了","tip":"注意是「快速连续点」，间隔太长就变成了两次单击。Mac触控板/笔记本触控板一般是轻点","level":1,"tags":["入门"],"py":"shua","pyFull":"shuangji","searchText":"双击 double click 快速连点鼠标左键两下，用来打开文件/软件 就像敲两下门，敲一下没人理，敲两下门就开了 注意是「快速连续点」，间隔太长就变成了两次单击。mac触控板/笔记本触控板一般是轻点"},{"id":"t0011","term":"文件","en":"File","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"电脑里存的任何东西都是文件：一张照片、一篇文档、一个程序、一首歌","analogy":"就像一张纸，纸上可以写字（文档）、画画（图片）、写乐谱（音乐），都是文件","tip":"每个文件都有「文件名」和「扩展名」（后缀），中间用点隔开，如「报告.docx」","level":1,"tags":["入门"],"py":"wenj","pyFull":"wenjian","searchText":"文件 file 电脑里存的任何东西都是文件：一张照片、一篇文档、一个程序、一首歌 就像一张纸，纸上可以写字（文档）、画画（图片）、写乐谱（音乐），都是文件 每个文件都有「文件名」和「扩展名」（后缀），中间用点隔开，如「报告.docx」"},{"id":"t0012","term":"文件夹/目录","en":"Folder/Directory","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"装文件的「夹子」，可以一层层嵌套","analogy":"就像书柜里的抽屉，大抽屉里放小盒子，小盒子里放文件，一层层分类整理","tip":"专业术语叫「目录」，日常叫「文件夹」，一个意思。整理好文件夹是程序员的基本功","level":1,"tags":["入门"],"py":"wenj","pyFull":"wenjianjiamulu","searchText":"文件夹/目录 folder/directory 装文件的「夹子」，可以一层层嵌套 就像书柜里的抽屉，大抽屉里放小盒子，小盒子里放文件，一层层分类整理 专业术语叫「目录」，日常叫「文件夹」，一个意思。整理好文件夹是程序员的基本功"},{"id":"t0013","term":"文件名","en":"Filename","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"文件的名字，用来区分不同文件","analogy":"就像信封上写的收件人，看名字就知道里面是什么","tip":"给文件起名要有意义！别叫「新建文档1」「未命名2」，三个月后你根本不知道是什么","level":1,"tags":["入门"],"py":"wenj","pyFull":"wenjianming","searchText":"文件名 filename 文件的名字，用来区分不同文件 就像信封上写的收件人，看名字就知道里面是什么 给文件起名要有意义！别叫「新建文档1」「未命名2」，三个月后你根本不知道是什么"},{"id":"t0014","term":"扩展名/后缀名","en":"File Extension","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"文件名「.」后面那几个字母，表示这个文件是什么类型","analogy":"就像信封上的邮票，不同邮票代表不同类型的信件，邮局一看就知道怎么处理","tip":"常见扩展名：.txt（纯文本）、.docx（Word文档）、.pdf（PDF文档）、.jpg（图片）、.mp3（音乐）、.mp4（视频）、.exe（可执行程序）、.py（Python代码）、.zip（压缩包）","level":1,"tags":["入门"],"py":"kuoz","pyFull":"kuozhanminghouzhuiming","searchText":"扩展名/后缀名 file extension 文件名「.」后面那几个字母，表示这个文件是什么类型 就像信封上的邮票，不同邮票代表不同类型的信件，邮局一看就知道怎么处理 常见扩展名：.txt（纯文本）、.docx（word文档）、.pdf（pdf文档）、.jpg（图片）、.mp3（音乐）、.mp4（视频）、.exe（可执行程序）、.py（python代码）、.zip（压缩包）"},{"id":"t0015","term":"C盘","en":"C Drive","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"Windows系统盘，操作系统就装在这里，一般是电脑自带的硬盘","analogy":"就像家里的厨房，家里最重要的功能（做饭）在这里，不能随便改布局","tip":"C盘满了电脑会变卡！软件尽量别装C盘，大文件别放桌面（桌面在C盘）。C盘至少留20%空闲","level":1,"tags":["入门"],"py":"cpan","pyFull":"cpan","searchText":"c盘 c drive windows系统盘，操作系统就装在这里，一般是电脑自带的硬盘 就像家里的厨房，家里最重要的功能（做饭）在这里，不能随便改布局 c盘满了电脑会变卡！软件尽量别装c盘，大文件别放桌面（桌面在c盘）。c盘至少留20%空闲"},{"id":"t0016","term":"D盘/E盘/F盘","en":"D/E/F Drive","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"除了C盘之外的硬盘分区，可以自己分几个盘来分类存东西","analogy":"就像家里的卧室、客厅、储物间，功能不同，各自放东西","tip":"建议分类：D盘装软件，E盘存学习资料/项目代码，F盘存电影/娱乐。系统重装只清C盘，其他盘东西还在","level":1,"tags":["入门"],"py":"dpan","pyFull":"dpanepanfpan","searchText":"d盘/e盘/f盘 d/e/f drive 除了c盘之外的硬盘分区，可以自己分几个盘来分类存东西 就像家里的卧室、客厅、储物间，功能不同，各自放东西 建议分类：d盘装软件，e盘存学习资料/项目代码，f盘存电影/娱乐。系统重装只清c盘，其他盘东西还在"},{"id":"t0017","term":"路径","en":"Path","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"文件在电脑里的具体位置，从哪个盘开始一层一层写","analogy":"就像快递地址，「XX省XX市XX区XX街道XX号」，一层一层定位到你家","tip":"例如：`C:\\Users\\张三\\Desktop\\报告.docx` 就是说这个文件在C盘→Users文件夹→张三文件夹→Desktop文件夹里，叫「报告.docx」。**写代码一定要理解路径！**","level":1,"tags":["入门"],"py":"luji","pyFull":"lujing","searchText":"路径 path 文件在电脑里的具体位置，从哪个盘开始一层一层写 就像快递地址，「xx省xx市xx区xx街道xx号」，一层一层定位到你家 例如：`c:\\users\\张三\\desktop\\报告.docx` 就是说这个文件在c盘→users文件夹→张三文件夹→desktop文件夹里，叫「报告.docx」。**写代码一定要理解路径！**"},{"id":"t0018","term":"绝对路径","en":"Absolute Path","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"从盘符号开始写完整路径，不管你在哪都能找到","analogy":"就像完整的快递地址，写全了寄到哪都能找到","tip":"例：`C:\\Windows\\System32\\cmd.exe`。以C:/D:开头的都是绝对路径","level":1,"tags":["入门"],"py":"jued","pyFull":"jueduilujing","searchText":"绝对路径 absolute path 从盘符号开始写完整路径，不管你在哪都能找到 就像完整的快递地址，写全了寄到哪都能找到 例：`c:\\windows\\system32\\cmd.exe`。以c:/d:开头的都是绝对路径"},{"id":"t0019","term":"相对路径","en":"Relative Path","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"相对于当前位置来描述路径，不说完整地址","analogy":"就像说「我在你隔壁房间」，你得知道「你」在哪，才能找到「隔壁」","tip":"例：当前在`C:\\Users\\张三`里，`.\\Desktop\\报告.docx`就是相对路径。`.`表示当前目录，`..`表示上一级目录","level":1,"tags":["入门"],"py":"xian","pyFull":"xiangduilujing","searchText":"相对路径 relative path 相对于当前位置来描述路径，不说完整地址 就像说「我在你隔壁房间」，你得知道「你」在哪，才能找到「隔壁」 例：当前在`c:\\users\\张三`里，`.\\desktop\\报告.docx`就是相对路径。`.`表示当前目录，`..`表示上一级目录"},{"id":"t0020","term":"根目录","en":"Root Directory","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"一个盘的最顶层，比如打开C盘看到的就是C盘根目录","analogy":"就像一栋楼的一楼大厅，从这里才能去各个楼层、各个房间","tip":"C盘根目录就是`C:\\`，D盘根目录就是`D:\\`。别往根目录乱存东西","level":1,"tags":["入门"],"py":"genm","pyFull":"genmulu","searchText":"根目录 root directory 一个盘的最顶层，比如打开c盘看到的就是c盘根目录 就像一栋楼的一楼大厅，从这里才能去各个楼层、各个房间 c盘根目录就是`c:\\`，d盘根目录就是`d:\\`。别往根目录乱存东西"},{"id":"t0021","term":"资源管理器/文件资源管理器","en":"File Explorer","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"Windows里那个黄色文件夹图标，用来浏览文件、复制粘贴移动文件的工具","analogy":"就像你家里所有房间的平面图，通过它你能看到所有东西放在哪里，搬东西也用它","tip":"快捷键**Win+E**直接打开资源管理器，比点图标快10倍。学会用左侧的导航树","level":1,"tags":["入门"],"py":"ziyu","pyFull":"ziyuanguanliqiwenjianziyuanguanliqi","searchText":"资源管理器/文件资源管理器 file explorer windows里那个黄色文件夹图标，用来浏览文件、复制粘贴移动文件的工具 就像你家里所有房间的平面图，通过它你能看到所有东西放在哪里，搬东西也用它 快捷键**win+e**直接打开资源管理器，比点图标快10倍。学会用左侧的导航树"},{"id":"t0022","term":"复制/粘贴","en":"Copy/Paste","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"把文件/文字复制一份到另一个地方，原件还在","analogy":"就像复印文件，原件不动，印一份副本拿走","tip":"快捷键：Ctrl+C复制，Ctrl+V粘贴。程序员最爱的快捷键（仅次于Ctrl+C/Ctrl+V复制代码）","level":1,"tags":["入门"],"py":"fuzh","pyFull":"fuzhiniantie","searchText":"复制/粘贴 copy/paste 把文件/文字复制一份到另一个地方，原件还在 就像复印文件，原件不动，印一份副本拿走 快捷键：ctrl+c复制，ctrl+v粘贴。程序员最爱的快捷键（仅次于ctrl+c/ctrl+v复制代码）"},{"id":"t0023","term":"剪切/粘贴","en":"Cut/Paste","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"把文件/文字从一个地方移到另一个地方，原件不在了","analogy":"就像剪报，从报纸上剪下来贴到本子上，报纸上就没了","tip":"快捷键：Ctrl+X剪切，Ctrl+V粘贴。注意：剪切后不粘贴=没剪","level":1,"tags":["入门"],"py":"jian","pyFull":"jianqieniantie","searchText":"剪切/粘贴 cut/paste 把文件/文字从一个地方移到另一个地方，原件不在了 就像剪报，从报纸上剪下来贴到本子上，报纸上就没了 快捷键：ctrl+x剪切，ctrl+v粘贴。注意：剪切后不粘贴=没剪"},{"id":"t0024","term":"重命名","en":"Rename","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"给文件/文件夹改名字","analogy":"就像给抽屉贴新标签，东西没变，只是名字换了","tip":"选中文件按**F2**直接重命名。注意：改名字别改扩展名（.后面的），否则文件可能打不开","level":1,"tags":["入门"],"py":"zhon","pyFull":"zhongmingming","searchText":"重命名 rename 给文件/文件夹改名字 就像给抽屉贴新标签，东西没变，只是名字换了 选中文件按**f2**直接重命名。注意：改名字别改扩展名（.后面的），否则文件可能打不开"},{"id":"t0025","term":"搜索","en":"Search","chapter":"ch0","section":"0.2 文件、文件夹与C盘D盘：你的电脑怎么存东西","plain":"在资源管理器右上角或开始菜单搜索框里输入关键词找文件","analogy":"就像在图书馆查书，输入书名，管理员直接告诉你在哪","tip":"Win键直接搜索是最快找软件/文件的方式。搜索文件用Everything软件比Windows自带搜索快得多","level":1,"tags":["入门"],"py":"sous","pyFull":"sousuo","searchText":"搜索 search 在资源管理器右上角或开始菜单搜索框里输入关键词找文件 就像在图书馆查书，输入书名，管理员直接告诉你在哪 win键直接搜索是最快找软件/文件的方式。搜索文件用everything软件比windows自带搜索快得多"},{"id":"t0026","term":"安装包","en":"Installer/Setup","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"下载下来的那个用来安装软件的文件，一般叫setup.exe或xxx Installer","analogy":"就像家具的组装包，里面有所有零件和说明书，拆开组装好才能用","tip":"安装包用完可以删，不影响已安装的软件。下载安装包**一定要去官网**，别去乱七八糟的下载站","level":1,"tags":["入门"],"py":"anzh","pyFull":"anzhuangbao","searchText":"安装包 installer/setup 下载下来的那个用来安装软件的文件，一般叫setup.exe或xxx installer 就像家具的组装包，里面有所有零件和说明书，拆开组装好才能用 安装包用完可以删，不影响已安装的软件。下载安装包**一定要去官网**，别去乱七八糟的下载站"},{"id":"t0027","term":".exe文件","en":"Executable File","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"扩展名是.exe的文件，双击就能运行的程序文件","analogy":"就像家电的开关，按一下就启动了","tip":".exe是Windows可执行文件。**陌生的.exe别乱双击！** 可能是病毒。Mac上对应的是.app","level":1,"tags":["入门"],"py":"exew","pyFull":"exewenjian","searchText":".exe文件 executable file 扩展名是.exe的文件，双击就能运行的程序文件 就像家电的开关，按一下就启动了 .exe是windows可执行文件。**陌生的.exe别乱双击！** 可能是病毒。mac上对应的是.app"},{"id":"t0028","term":"安装路径","en":"Install Path","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"软件装在哪个盘、哪个文件夹里","analogy":"就像你把家具摆在哪个房间，决定了它以后待在哪里","tip":"**重点！** 安装软件时默认装C盘，记得改到D盘。路径里**不要用中文和空格**，否则编程时容易出Bug","level":1,"tags":["入门"],"py":"anzh","pyFull":"anzhuanglujing","searchText":"安装路径 install path 软件装在哪个盘、哪个文件夹里 就像你把家具摆在哪个房间，决定了它以后待在哪里 **重点！** 安装软件时默认装c盘，记得改到d盘。路径里**不要用中文和空格**，否则编程时容易出bug"},{"id":"t0029","term":"下一步陷阱","en":"「Next」 Trap","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"安装软件时一路点「下一步」，结果默认勾选了一堆捆绑软件","analogy":"就像办会员卡时默认勾选了「同意接收广告短信」，你不点掉它就默认同意了","tip":"安装时**每一步都要看清楚**！把那些「安装XX浏览器」「设置XX为首页」的勾全部去掉","level":1,"tags":["入门"],"py":"xiay","pyFull":"xiayibuxianjing","searchText":"下一步陷阱 「next」 trap 安装软件时一路点「下一步」，结果默认勾选了一堆捆绑软件 就像办会员卡时默认勾选了「同意接收广告短信」，你不点掉它就默认同意了 安装时**每一步都要看清楚**！把那些「安装xx浏览器」「设置xx为首页」的勾全部去掉"},{"id":"t0030","term":"绿色软件/免安装版","en":"Portable Software","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"不用安装，下载完解压就能直接用的软件","analogy":"就像便携折叠椅，拿出来就能坐，不用组装，走了直接拿走","tip":"好处是不写注册表、不污染系统、重装系统还能用。适合一些小工具","level":1,"tags":["入门"],"py":"lser","pyFull":"lseruanjianmiananzhuangban","searchText":"绿色软件/免安装版 portable software 不用安装，下载完解压就能直接用的软件 就像便携折叠椅，拿出来就能坐，不用组装，走了直接拿走 好处是不写注册表、不污染系统、重装系统还能用。适合一些小工具"},{"id":"t0031","term":"卸载","en":"Uninstall","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"把已安装的软件彻底从电脑里删掉","analogy":"就像扔掉不用的旧家具，不能只把桌面图标删了，要把整台「家具」搬走","tip":"**正确方法**：设置→应用→找到软件→卸载；或用软件自带的卸载程序。**千万别直接删安装文件夹！** 会留下垃圾","level":1,"tags":["入门"],"py":"xiez","pyFull":"xiezai","searchText":"卸载 uninstall 把已安装的软件彻底从电脑里删掉 就像扔掉不用的旧家具，不能只把桌面图标删了，要把整台「家具」搬走 **正确方法**：设置→应用→找到软件→卸载；或用软件自带的卸载程序。**千万别直接删安装文件夹！** 会留下垃圾"},{"id":"t0032","term":"以管理员身份运行","en":"Run as Administrator","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"用最高权限运行程序，能改系统设置","analogy":"就像拿着老板的授权书去办事，普通员工做不了的事，拿着授权书就能做","tip":"安装软件、修改系统文件时需要管理员权限。右键→「以管理员身份运行」。平时别乱用，防止恶意软件改系统","level":1,"tags":["入门"],"py":"yigu","pyFull":"yiguanliyuanshenfenyunxing","searchText":"以管理员身份运行 run as administrator 用最高权限运行程序，能改系统设置 就像拿着老板的授权书去办事，普通员工做不了的事，拿着授权书就能做 安装软件、修改系统文件时需要管理员权限。右键→「以管理员身份运行」。平时别乱用，防止恶意软件改系统"},{"id":"t0033","term":"环境变量","en":"Environment Variables","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"系统级的「记事本」，记录了一些常用路径，让你在任何地方都能直接输命令运行程序","analogy":"就像你脑子里记住了常用的电话号码，不用每次翻通讯录，直接拨号就能打","tip":"**新手噩梦但必须理解！** 装完Python/Java/JDK后要配置环境变量（PATH），否则终端里输入`python`会提示「不是内部命令」。原理：系统按PATH里列的路径一个个去找有没有这个程序","level":1,"tags":["入门"],"py":"huan","pyFull":"huanjingbianliang","searchText":"环境变量 environment variables 系统级的「记事本」，记录了一些常用路径，让你在任何地方都能直接输命令运行程序 就像你脑子里记住了常用的电话号码，不用每次翻通讯录，直接拨号就能打 **新手噩梦但必须理解！** 装完python/java/jdk后要配置环境变量（path），否则终端里输入`python`会提示「不是内部命令」。原理：系统按path里列的路径一个个去找有没有这个程序"},{"id":"t0034","term":"PATH变量","en":"PATH","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"环境变量里最重要的一个，就是一个「路径清单」，告诉系统去哪里找可执行程序","analogy":"就像快递柜的取件码清单，系统挨个柜子找，找到了就取出来执行","tip":"配置PATH = 告诉系统「我在这个位置装了XX程序，以后直接去那找」。多个路径用分号(Windows)或冒号(Mac/Linux)隔开","level":1,"tags":["入门"],"py":"path","pyFull":"pathbianliang","searchText":"path变量 path 环境变量里最重要的一个，就是一个「路径清单」，告诉系统去哪里找可执行程序 就像快递柜的取件码清单，系统挨个柜子找，找到了就取出来执行 配置path = 告诉系统「我在这个位置装了xx程序，以后直接去那找」。多个路径用分号(windows)或冒号(mac/linux)隔开"},{"id":"t0035","term":"默认软件/打开方式","en":"Default Program","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"双击某个文件时，系统用哪个软件打开它","analogy":"就像你默认用某支笔写字，拿起笔就写，不用每次选笔","tip":"右键文件→「打开方式」→「选择其他应用」→勾选「始终使用此应用」可以改默认打开方式","level":1,"tags":["入门"],"py":"more","pyFull":"morenruanjiandakaifangshi","searchText":"默认软件/打开方式 default program 双击某个文件时，系统用哪个软件打开它 就像你默认用某支笔写字，拿起笔就写，不用每次选笔 右键文件→「打开方式」→「选择其他应用」→勾选「始终使用此应用」可以改默认打开方式"},{"id":"t0036","term":"任务管理器","en":"Task Manager","chapter":"ch0","section":"0.3 安装软件：别再装全家桶了！","plain":"按Ctrl+Shift+Esc打开，能看到电脑正在运行的所有程序和占用资源","analogy":"就像物业监控室，能看到每个房间谁在用、用了多少电，异常了直接关掉","tip":"软件卡死关不掉时用任务管理器「结束任务」。还能看CPU/内存/磁盘占用率，判断电脑为什么卡","level":1,"tags":["入门"],"py":"renw","pyFull":"renwuguanliqi","searchText":"任务管理器 task manager 按ctrl+shift+esc打开，能看到电脑正在运行的所有程序和占用资源 就像物业监控室，能看到每个房间谁在用、用了多少电，异常了直接关掉 软件卡死关不掉时用任务管理器「结束任务」。还能看cpu/内存/磁盘占用率，判断电脑为什么卡"},{"id":"t0037","term":"终端/命令行","en":"Terminal/Command Line/CLI","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"那个黑色背景、白色文字、只能输入命令的窗口，用文字来操作电脑而不是用鼠标点","analogy":"就像用遥控器输频道号选台，别人用上下键一个个按（鼠标点），你直接输「052」（输命令），更快更准","tip":"**不是黑客！** 这是程序员的日常工具。一开始觉得不如图形界面，熟练后效率比点鼠标高10倍","level":1,"tags":["入门"],"py":"zhon","pyFull":"zhongduanminglingxing","searchText":"终端/命令行 terminal/command line/cli 那个黑色背景、白色文字、只能输入命令的窗口，用文字来操作电脑而不是用鼠标点 就像用遥控器输频道号选台，别人用上下键一个个按（鼠标点），你直接输「052」（输命令），更快更准 **不是黑客！** 这是程序员的日常工具。一开始觉得不如图形界面，熟练后效率比点鼠标高10倍"},{"id":"t0038","term":"CMD/命令提示符","en":"Command Prompt/cmd.exe","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"Windows自带的最基础的命令行工具，Win+R输入cmd就能打开","analogy":"就像一个只会基础指令的老管家，你说什么他做什么，但功能有限，指令也和Linux/Mac不一样","tip":"现在学计算机更推荐用PowerShell（功能更强）或直接装WSL/用Git Bash。CMD是最原始的","level":1,"tags":["入门"],"py":"cmdm","pyFull":"cmdminglingtishifu","searchText":"cmd/命令提示符 command prompt/cmd.exe windows自带的最基础的命令行工具，win+r输入cmd就能打开 就像一个只会基础指令的老管家，你说什么他做什么，但功能有限，指令也和linux/mac不一样 现在学计算机更推荐用powershell（功能更强）或直接装wsl/用git bash。cmd是最原始的"},{"id":"t0039","term":"终端（Mac/Linux）","en":"Terminal","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"Mac和Linux上的命令行工具，功能和Linux命令一致","analogy":"就像直接和操作系统对话，你说一句它做一句，反应很快","tip":"Mac按Cmd+空格搜Terminal打开。学后端/算法/运维必须熟练Linux命令","level":1,"tags":["入门"],"py":"zhon","pyFull":"zhongduan","searchText":"终端（mac/linux） terminal mac和linux上的命令行工具，功能和linux命令一致 就像直接和操作系统对话，你说一句它做一句，反应很快 mac按cmd+空格搜terminal打开。学后端/算法/运维必须熟练linux命令"},{"id":"t0040","term":"命令/指令","en":"Command","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"在终端里输入的一行文字，告诉电脑要做什么","analogy":"就像给助手发一条文字消息，「把桌上的文件拿给我」，它照做","tip":"例：`dir`（Windows）/`ls`（Mac/Linux）= 列出当前文件夹有什么文件；`cd 文件夹名`= 进入某个文件夹","level":1,"tags":["入门"],"py":"ming","pyFull":"minglingzhiling","searchText":"命令/指令 command 在终端里输入的一行文字，告诉电脑要做什么 就像给助手发一条文字消息，「把桌上的文件拿给我」，它照做 例：`dir`（windows）/`ls`（mac/linux）= 列出当前文件夹有什么文件；`cd 文件夹名`= 进入某个文件夹"},{"id":"t0041","term":"提示符","en":"Prompt","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"终端里光标前面那串文字，显示你当前在哪个目录","analogy":"就像快递单上的「当前位置：XX房间」，告诉你现在在哪","tip":"Windows一般是`C:\\Users\\张三>`，Mac/Linux一般是`user@mac ~ %`","level":1,"tags":["入门"],"py":"tish","pyFull":"tishifu","searchText":"提示符 prompt 终端里光标前面那串文字，显示你当前在哪个目录 就像快递单上的「当前位置：xx房间」，告诉你现在在哪 windows一般是`c:\\users\\张三>`，mac/linux一般是`user@mac ~ %`"},{"id":"t0042","term":"cd命令","en":"cd (Change Directory)","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"切换当前目录（进入某个文件夹）","analogy":"就像在大楼里换房间，「cd 卧室」=走进卧室，「cd ..」=走出去回到上一层","tip":"这是最常用的命令！`cd ..`回到上一级，`cd /`回到根目录，`cd ~`回到用户主目录","level":1,"tags":["入门"],"py":"cdmi","pyFull":"cdmingling","searchText":"cd命令 cd (change directory) 切换当前目录（进入某个文件夹） 就像在大楼里换房间，「cd 卧室」=走进卧室，「cd ..」=走出去回到上一层 这是最常用的命令！`cd ..`回到上一级，`cd /`回到根目录，`cd ~`回到用户主目录"},{"id":"t0043","term":"ls/dir命令","en":"ls/dir (List Directory)","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"列出当前文件夹里所有文件和子文件夹","analogy":"就像打开抽屉看一眼，告诉你里面有什么","tip":"Mac/Linux用`ls`，Windows用`dir`。`ls -l`看详细信息，`ls -a`看隐藏文件","level":1,"tags":["入门"],"py":"lsdi","pyFull":"lsdirmingling","searchText":"ls/dir命令 ls/dir (list directory) 列出当前文件夹里所有文件和子文件夹 就像打开抽屉看一眼，告诉你里面有什么 mac/linux用`ls`，windows用`dir`。`ls -l`看详细信息，`ls -a`看隐藏文件"},{"id":"t0044","term":"pwd命令","en":"pwd (Print Working Directory)","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"显示你当前在哪个目录（在哪条路径下）","analogy":"就像打开手机看定位，告诉你「你现在在XX路XX号」","tip":"Mac/Linux常用，Windows CMD里用`cd`不带参数也行。迷路时用pwd","level":1,"tags":["入门"],"py":"pwdm","pyFull":"pwdmingling","searchText":"pwd命令 pwd (print working directory) 显示你当前在哪个目录（在哪条路径下） 就像打开手机看定位，告诉你「你现在在xx路xx号」 mac/linux常用，windows cmd里用`cd`不带参数也行。迷路时用pwd"},{"id":"t0045","term":"mkdir命令","en":"mkdir (Make Directory)","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"新建一个文件夹","analogy":"就像「给我拿个新盒子来」，创建一个新的空文件夹","tip":"例：`mkdir my_project` 就在当前目录建了一个叫my_project的文件夹","level":1,"tags":["入门"],"py":"mkdi","pyFull":"mkdirmingling","searchText":"mkdir命令 mkdir (make directory) 新建一个文件夹 就像「给我拿个新盒子来」，创建一个新的空文件夹 例：`mkdir my_project` 就在当前目录建了一个叫my_project的文件夹"},{"id":"t0046","term":"rm/del命令","en":"rm/del (Remove/Delete)","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"删除文件","analogy":"就像把文件扔进垃圾桶，但注意命令行删除**不经过回收站**，删了就找不回来了！","tip":"Mac/Linux用`rm`，Windows用`del`。**`rm -rf /`是死亡命令**（删光整个硬盘），千万别乱输！","level":1,"tags":["入门"],"py":"rmde","pyFull":"rmdelmingling","searchText":"rm/del命令 rm/del (remove/delete) 删除文件 就像把文件扔进垃圾桶，但注意命令行删除**不经过回收站**，删了就找不回来了！ mac/linux用`rm`，windows用`del`。**`rm -rf /`是死亡命令**（删光整个硬盘），千万别乱输！"},{"id":"t0047","term":"cp/copy命令","en":"cp/copy","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"复制文件","analogy":"就像复印，原件保留，复制一份到新位置","tip":"Mac/Linux：`cp 源文件 目标位置`；Windows：`copy 源文件 目标位置`","level":1,"tags":["入门"],"py":"cpco","pyFull":"cpcopymingling","searchText":"cp/copy命令 cp/copy 复制文件 就像复印，原件保留，复制一份到新位置 mac/linux：`cp 源文件 目标位置`；windows：`copy 源文件 目标位置`"},{"id":"t0048","term":"mv/move命令","en":"mv/move","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"移动文件（也能用来重命名）","analogy":"就像搬东西，从一个抽屉搬到另一个抽屉","tip":"Mac/Linux：`mv 旧名 新名`可以重命名；Windows用`move`或`ren`","level":1,"tags":["入门"],"py":"mvmo","pyFull":"mvmovemingling","searchText":"mv/move命令 mv/move 移动文件（也能用来重命名） 就像搬东西，从一个抽屉搬到另一个抽屉 mac/linux：`mv 旧名 新名`可以重命名；windows用`move`或`ren`"},{"id":"t0049","term":"cat/type命令","en":"cat/type","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"查看文件内容（在终端里直接显示文件里的文字）","analogy":"就像翻开书扫一眼，直接在屏幕上显示文件里写了什么","tip":"Mac/Linux用`cat 文件名`，Windows用`type 文件名`。大文件用`less`分页看","level":1,"tags":["入门"],"py":"catt","pyFull":"cattypemingling","searchText":"cat/type命令 cat/type 查看文件内容（在终端里直接显示文件里的文字） 就像翻开书扫一眼，直接在屏幕上显示文件里写了什么 mac/linux用`cat 文件名`，windows用`type 文件名`。大文件用`less`分页看"},{"id":"t0050","term":"清屏","en":"clear/cls","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"把终端上乱七八糟的输出清掉，重新变干净","analogy":"就像擦黑板，之前写的擦掉，干干净净重新开始","tip":"Mac/Linux用`clear`，Windows用`cls`。快捷键Ctrl+L也能清屏（Mac/Linux）","level":1,"tags":["入门"],"py":"qing","pyFull":"qingping","searchText":"清屏 clear/cls 把终端上乱七八糟的输出清掉，重新变干净 就像擦黑板，之前写的擦掉，干干净净重新开始 mac/linux用`clear`，windows用`cls`。快捷键ctrl+l也能清屏（mac/linux）"},{"id":"t0051","term":"GUI vs CLI","en":"Graphical User Interface vs Command Line Interface","chapter":"ch0","section":"0.4 终端/命令行：不是黑客！这是程序员的基本功","plain":"GUI=图形界面（鼠标点图标），CLI=命令行界面（输命令）","analogy":"GUI就像看图点菜（有图片有按钮），CLI就像直接报菜名（快但要记住菜名）","tip":"普通用户用GUI够了，但程序员必须会CLI，服务器、Docker、Git、远程连接都用命令行","level":1,"tags":["入门"],"py":"guiv","pyFull":"guivscli","searchText":"gui vs cli graphical user interface vs command line interface gui=图形界面（鼠标点图标），cli=命令行界面（输命令） gui就像看图点菜（有图片有按钮），cli就像直接报菜名（快但要记住菜名） 普通用户用gui够了，但程序员必须会cli，服务器、docker、git、远程连接都用命令行"},{"id":"t0052","term":"浏览器","en":"Browser","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"上网用的软件：Chrome、Edge、Firefox、Safari","analogy":"就像你上网的「窗口」，透过它你才能看到互联网上的内容","tip":"程序员推荐用Chrome或Edge，调试网页必备F12开发者工具。别用IE了，已经退役了","level":1,"tags":["入门"],"py":"liul","pyFull":"liulanqi","searchText":"浏览器 browser 上网用的软件：chrome、edge、firefox、safari 就像你上网的「窗口」，透过它你才能看到互联网上的内容 程序员推荐用chrome或edge，调试网页必备f12开发者工具。别用ie了，已经退役了"},{"id":"t0053","term":"网址/URL","en":"URL/Uniform Resource Locator","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"浏览器地址栏里输入的那串地址，如`https://www.baidu.com`","analogy":"就像门牌号，每个网页都有唯一地址，输入地址就能找到它","tip":"URL由几部分组成：`https://`（协议）+`www.baidu.com`（域名）+`/s`（路径）+`?wd=xxx`（参数）","level":1,"tags":["入门"],"py":"wang","pyFull":"wangzhiurl","searchText":"网址/url url/uniform resource locator 浏览器地址栏里输入的那串地址，如`https://www.baidu.com` 就像门牌号，每个网页都有唯一地址，输入地址就能找到它 url由几部分组成：`https://`（协议）+`www.baidu.com`（域名）+`/s`（路径）+`?wd=xxx`（参数）"},{"id":"t0054","term":"域名","en":"Domain Name","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"网址里的`www.baidu.com`部分，是网站的名字","analogy":"就像人的名字，记住名字比记住身份证号（IP地址）容易","tip":"域名是给人看的，IP地址是给路由器用的。DNS负责把域名翻译成IP地址","level":1,"tags":["入门"],"py":"yumi","pyFull":"yuming","searchText":"域名 domain name 网址里的`www.baidu.com`部分，是网站的名字 就像人的名字，记住名字比记住身份证号（ip地址）容易 域名是给人看的，ip地址是给路由器用的。dns负责把域名翻译成ip地址"},{"id":"t0055","term":"IP地址","en":"IP Address","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"每台联网设备的唯一数字地址，如`192.168.1.1`或`14.215.177.38`","analogy":"就像身份证号，全球唯一，路由器靠它找到目标设备","tip":"公网IP在互联网唯一，内网IP（192.168.x.x）只在局域网内有效。查自己IP：百度搜「IP」","level":1,"tags":["入门"],"py":"ipdi","pyFull":"ipdizhi","searchText":"ip地址 ip address 每台联网设备的唯一数字地址，如`192.168.1.1`或`14.215.177.38` 就像身份证号，全球唯一，路由器靠它找到目标设备 公网ip在互联网唯一，内网ip（192.168.x.x）只在局域网内有效。查自己ip：百度搜「ip」"},{"id":"t0056","term":"刷新","en":"Refresh/F5","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"重新加载当前网页","analogy":"就像重新打开一扇窗户看看外面有没有新情况","tip":"F5刷新，Ctrl+F5强制刷新（不读缓存重新下载）。改代码后看效果要用强制刷新","level":1,"tags":["入门"],"py":"shua","pyFull":"shuaxin","searchText":"刷新 refresh/f5 重新加载当前网页 就像重新打开一扇窗户看看外面有没有新情况 f5刷新，ctrl+f5强制刷新（不读缓存重新下载）。改代码后看效果要用强制刷新"},{"id":"t0057","term":"清除缓存/清缓存","en":"Clear Cache","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"浏览器会把访问过的网页资源（图片/CSS/JS）存本地，下次打开更快，但可能看到旧版","analogy":"就像清理冰箱里的过期食品，东西存太久了可能是旧的，清掉重新买新鲜的","tip":"开发调试网页时经常要清缓存，否则你看到的可能是昨天的旧版本","level":1,"tags":["入门"],"py":"qing","pyFull":"qingchuhuancunqinghuancun","searchText":"清除缓存/清缓存 clear cache 浏览器会把访问过的网页资源（图片/css/js）存本地，下次打开更快，但可能看到旧版 就像清理冰箱里的过期食品，东西存太久了可能是旧的，清掉重新买新鲜的 开发调试网页时经常要清缓存，否则你看到的可能是昨天的旧版本"},{"id":"t0058","term":"无痕模式/隐私模式","en":"Incognito/Private Mode","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"浏览器不记录浏览历史、不保存Cookie、不读缓存的模式","analogy":"就像戴手套摸东西，摸完不留指纹","tip":"快捷键Ctrl+Shift+N（Chrome）。做网页测试、登录多个账号时很方便","level":1,"tags":["入门"],"py":"wuhe","pyFull":"wuhenmoshiyinsimoshi","searchText":"无痕模式/隐私模式 incognito/private mode 浏览器不记录浏览历史、不保存cookie、不读缓存的模式 就像戴手套摸东西，摸完不留指纹 快捷键ctrl+shift+n（chrome）。做网页测试、登录多个账号时很方便"},{"id":"t0059","term":"收藏夹/书签","en":"Bookmarks","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"把常用网页存起来，下次点一下就到","analogy":"就像把常用的电话存通讯录，不用每次输号码","tip":"Ctrl+D收藏当前页。善用收藏夹栏把常用网站（GitHub、文档、教程）放在显眼位置","level":1,"tags":["入门"],"py":"shou","pyFull":"shoucangjiashuqian","searchText":"收藏夹/书签 bookmarks 把常用网页存起来，下次点一下就到 就像把常用的电话存通讯录，不用每次输号码 ctrl+d收藏当前页。善用收藏夹栏把常用网站（github、文档、教程）放在显眼位置"},{"id":"t0060","term":"下载","en":"Download","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"把互联网上的文件保存到自己电脑里","analogy":"就像从图书馆借书回家，书从图书馆（服务器）拿到你家（电脑）","tip":"下载的文件默认在「下载」文件夹（`C:\\Users\\用户名\\Downloads`），别一直堆着不清理","level":1,"tags":["入门"],"py":"xiaz","pyFull":"xiazai","searchText":"下载 download 把互联网上的文件保存到自己电脑里 就像从图书馆借书回家，书从图书馆（服务器）拿到你家（电脑） 下载的文件默认在「下载」文件夹（`c:\\users\\用户名\\downloads`），别一直堆着不清理"},{"id":"t0061","term":"上传","en":"Upload","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"把自己电脑里的文件传到网上","analogy":"就像寄快递，东西从你家寄出去到对方那里","tip":"交作业、传代码到GitHub、发朋友圈都是上传。程序员常用的上传工具是Git","level":1,"tags":["入门"],"py":"shan","pyFull":"shangchuan","searchText":"上传 upload 把自己电脑里的文件传到网上 就像寄快递，东西从你家寄出去到对方那里 交作业、传代码到github、发朋友圈都是上传。程序员常用的上传工具是git"},{"id":"t0062","term":"开发者工具/F12","en":"DevTools","chapter":"ch0","section":"0.5 网络与浏览器：你天天用但未必懂","plain":"按F12（或Ctrl+Shift+I）打开的浏览器调试工具，能看网页源码、抓包、调试JS","analogy":"就像X光机，能看穿网页的「骨骼结构」，看到HTML/CSS/JS源码和网络请求","tip":"**学Web开发必备！** Elements看页面结构，Console写JS，Network看网络请求，Application看Cookie","level":1,"tags":["入门"],"py":"kaif","pyFull":"kaifazhegongjuf","searchText":"开发者工具/f12 devtools 按f12（或ctrl+shift+i）打开的浏览器调试工具，能看网页源码、抓包、调试js 就像x光机，能看穿网页的「骨骼结构」，看到html/css/js源码和网络请求 **学web开发必备！** elements看页面结构，console写js，network看网络请求，application看cookie"},{"id":"t0063","term":"文本文件","en":"Text File","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"只包含纯文字的文件，没有格式（颜色、字号、粗体等），用记事本打开能直接看","analogy":"就像白纸黑字的笔记，只有文字，没有花里胡哨的装饰","tip":"写代码用的就是文本文件！`.py` `.c` `.java` `.html`都是纯文本文件，只是扩展名不同","level":1,"tags":["入门"],"py":"wenb","pyFull":"wenbenwenjian","searchText":"文本文件 text file 只包含纯文字的文件，没有格式（颜色、字号、粗体等），用记事本打开能直接看 就像白纸黑字的笔记，只有文字，没有花里胡哨的装饰 写代码用的就是文本文件！`.py` `.c` `.java` `.html`都是纯文本文件，只是扩展名不同"},{"id":"t0064","term":"编码/字符编码","en":"Encoding","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"把文字转换成01的规则，不同编码同一个字对应的01不一样","analogy":"就像不同语言写同一个意思，「你好」是中文，「Hello」是英文，「こんにちは」是日文，表达的意思一样但写法不同","tip":"最常见的乱码原因就是编码不匹配！记住：现在统一用**UTF-8**。Windows记事本默认可能是GBK，保存代码时选UTF-8","level":1,"tags":["入门"],"py":"bian","pyFull":"bianmazifubianma","searchText":"编码/字符编码 encoding 把文字转换成01的规则，不同编码同一个字对应的01不一样 就像不同语言写同一个意思，「你好」是中文，「hello」是英文，「こんにちは」是日文，表达的意思一样但写法不同 最常见的乱码原因就是编码不匹配！记住：现在统一用**utf-8**。windows记事本默认可能是gbk，保存代码时选utf-8"},{"id":"t0065","term":"乱码","en":"Garbled/Mojibake","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"文件打开后显示一堆奇怪的字符（å「ˆå「ˆ、ç‰ä»¶、锟斤拷）","analogy":"就像用日语词典查英语单词，查出来的是莫名其妙的东西","tip":"99%的乱码=编码不匹配。解决方法：文件保存时用UTF-8，打开时也用UTF-8","level":1,"tags":["入门"],"py":"luan","pyFull":"luanma","searchText":"乱码 garbled/mojibake 文件打开后显示一堆奇怪的字符（å「ˆå「ˆ、ç‰ä»¶、锟斤拷） 就像用日语词典查英语单词，查出来的是莫名其妙的东西 99%的乱码=编码不匹配。解决方法：文件保存时用utf-8，打开时也用utf-8"},{"id":"t0066","term":"记事本","en":"Notepad","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"Windows自带的最简单的文本编辑器，只能写纯文字","analogy":"就像一张白纸，什么功能都没有，但写什么都行","tip":"能写代码但极不推荐！没有语法高亮、没有自动补全、没有行号。专业的事用专业的编辑器","level":1,"tags":["入门"],"py":"jish","pyFull":"jishiben","searchText":"记事本 notepad windows自带的最简单的文本编辑器，只能写纯文字 就像一张白纸，什么功能都没有，但写什么都行 能写代码但极不推荐！没有语法高亮、没有自动补全、没有行号。专业的事用专业的编辑器"},{"id":"t0067","term":"编辑器/代码编辑器","en":"Editor/Code Editor","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"专门用来写代码的软件，有语法高亮、自动补全、括号匹配等功能","analogy":"就像带格子的作业本+自动铅笔+橡皮，写起来又快又不容易错","tip":"入门推荐**VS Code**（免费、强大、插件多）。其他：Sublime Text、Notepad++","level":1,"tags":["入门"],"py":"bian","pyFull":"bianjiqidaimabianjiqi","searchText":"编辑器/代码编辑器 editor/code editor 专门用来写代码的软件，有语法高亮、自动补全、括号匹配等功能 就像带格子的作业本+自动铅笔+橡皮，写起来又快又不容易错 入门推荐**vs code**（免费、强大、插件多）。其他：sublime text、notepad++"},{"id":"t0068","term":"IDE","en":"Integrated Development Environment","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"集成开发环境，比编辑器功能更全，把写代码、编译、调试、运行都整合在一起","analogy":"就像一个完整的工具箱+工作台，锤子、螺丝刀、电钻、图纸都在一起，不用到处找","tip":"写Java用**IntelliJ IDEA**，写Python用**PyCharm**，写C/C++用**Visual Studio/CLion**，写前端VS Code就够了","level":1,"tags":["入门"],"py":"ide","pyFull":"ide","searchText":"ide integrated development environment 集成开发环境，比编辑器功能更全，把写代码、编译、调试、运行都整合在一起 就像一个完整的工具箱+工作台，锤子、螺丝刀、电钻、图纸都在一起，不用到处找 写java用**intellij idea**，写python用**pycharm**，写c/c++用**visual studio/clion**，写前端vs code就够了"},{"id":"t0069","term":"VS Code","en":"Visual Studio Code","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"微软出的免费代码编辑器，轻量但插件极多，几乎什么语言都能写","analogy":"就像一把瑞士军刀，本身不大，但装上各种插件后什么都能做","tip":"**大一新生强烈推荐！** 别用Dev-C++了（太老了），直接装VS Code","level":1,"tags":["入门"],"py":"vsco","pyFull":"vscode","searchText":"vs code visual studio code 微软出的免费代码编辑器，轻量但插件极多，几乎什么语言都能写 就像一把瑞士军刀，本身不大，但装上各种插件后什么都能做 **大一新生强烈推荐！** 别用dev-c++了（太老了），直接装vs code"},{"id":"t0070","term":"运行","en":"Run","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"让你写的代码真正执行起来，看结果","analogy":"就像按下电器开关，电路通了，机器开始运转","tip":"Python代码写完直接运行就能看到结果；C/C++/Java需要先编译再运行","level":1,"tags":["入门"],"py":"yunx","pyFull":"yunxing","searchText":"运行 run 让你写的代码真正执行起来，看结果 就像按下电器开关，电路通了，机器开始运转 python代码写完直接运行就能看到结果；c/c++/java需要先编译再运行"},{"id":"t0071","term":"编译错误","en":"Compile Error","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"代码写错了（语法不对），编译器看不懂，根本生成不了可执行文件","analogy":"就像作文语法错误太多老师看不懂，连批改都没法批改，直接打回来","tip":"编译器会告诉你第几行什么错误，认真读错误信息！不要一报错就截图问人","level":1,"tags":["入门"],"py":"bian","pyFull":"bianyicuowu","searchText":"编译错误 compile error 代码写错了（语法不对），编译器看不懂，根本生成不了可执行文件 就像作文语法错误太多老师看不懂，连批改都没法批改，直接打回来 编译器会告诉你第几行什么错误，认真读错误信息！不要一报错就截图问人"},{"id":"t0072","term":"运行时错误","en":"Runtime Error","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"代码能编译通过，但运行到一半崩了（如除以0、访问不存在的文件）","analogy":"就像做菜时才发现盐没了，菜谱能看懂，但做着做着做不下去了","tip":"典型如「空指针异常」「数组越界」「栈溢出」，报错信息里会告诉你是哪一行","level":1,"tags":["入门"],"py":"yunx","pyFull":"yunxingshicuowu","searchText":"运行时错误 runtime error 代码能编译通过，但运行到一半崩了（如除以0、访问不存在的文件） 就像做菜时才发现盐没了，菜谱能看懂，但做着做着做不下去了 典型如「空指针异常」「数组越界」「栈溢出」，报错信息里会告诉你是哪一行"},{"id":"t0073","term":"逻辑错误","en":"Logic Error","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"代码能跑也不崩溃，但结果不对（你以为算对了算错了）","analogy":"就像菜谱写错了，菜做出来了但味道不对，因为步骤写错了","tip":"**最难找的Bug！** 程序不报错但答案错了。要靠调试（Debug）、打日志、写测试用例来发现","level":1,"tags":["入门"],"py":"luoj","pyFull":"luojicuowu","searchText":"逻辑错误 logic error 代码能跑也不崩溃，但结果不对（你以为算对了算错了） 就像菜谱写错了，菜做出来了但味道不对，因为步骤写错了 **最难找的bug！** 程序不报错但答案错了。要靠调试（debug）、打日志、写测试用例来发现"},{"id":"t0074","term":"控制台","en":"Console","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"程序运行后显示输出结果的地方（一般是黑色窗口或IDE底部的面板）","analogy":"就像程序的「嘴」，程序通过它告诉你结果，你也能通过它给程序输入东西","tip":"初学编程时所有的「Hello World」和输入输出都在控制台。控制台打印（print）是最简单的调试手段","level":1,"tags":["入门"],"py":"kong","pyFull":"kongzhitai","searchText":"控制台 console 程序运行后显示输出结果的地方（一般是黑色窗口或ide底部的面板） 就像程序的「嘴」，程序通过它告诉你结果，你也能通过它给程序输入东西 初学编程时所有的「hello world」和输入输出都在控制台。控制台打印（print）是最简单的调试手段"},{"id":"t0075","term":"打印输出","en":"Print/Output","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"让程序在控制台显示文字，比如Python的`print(\"Hello\")`","analogy":"就像程序在说话，你让它说什么它就说什么","tip":"**新手调试第一招**：不知道程序跑到哪了、变量值是多少，就print出来看！","level":1,"tags":["入门"],"py":"dayi","pyFull":"dayinshuchu","searchText":"打印输出 print/output 让程序在控制台显示文字，比如python的`print(\"hello\")` 就像程序在说话，你让它说什么它就说什么 **新手调试第一招**：不知道程序跑到哪了、变量值是多少，就print出来看！"},{"id":"t0076","term":"注释","en":"Comment","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"代码里写给人看的说明文字，计算机会自动忽略不执行","analogy":"就像课本上写的笔记，书（代码）还是一样的，但旁边写了自己的理解","tip":"Python用`#`注释，C/Java用`//`单行注释、`/* */`多行注释。**好代码的注释要写清楚「为什么」，不是「做了什么」**","level":1,"tags":["入门"],"py":"zhus","pyFull":"zhushi","searchText":"注释 comment 代码里写给人看的说明文字，计算机会自动忽略不执行 就像课本上写的笔记，书（代码）还是一样的，但旁边写了自己的理解 python用`#`注释，c/java用`//`单行注释、`/* */`多行注释。**好代码的注释要写清楚「为什么」，不是「做了什么」**"},{"id":"t0077","term":"关键字/保留字","en":"Keyword","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"编程语言里有特殊含义的单词，不能拿来当变量名，如if、for、while、class","analogy":"就像交通标志上的字，「停」「让行」有固定含义，不能随便当普通字用","tip":"每个语言关键字不一样，写代码时编辑器一般会高亮显示（变颜色）","level":1,"tags":["入门"],"py":"guan","pyFull":"guanjianzibaoliuzi","searchText":"关键字/保留字 keyword 编程语言里有特殊含义的单词，不能拿来当变量名，如if、for、while、class 就像交通标志上的字，「停」「让行」有固定含义，不能随便当普通字用 每个语言关键字不一样，写代码时编辑器一般会高亮显示（变颜色）"},{"id":"t0078","term":"报错信息/异常","en":"Error/Exception","chapter":"ch0","section":"0.6 写代码相关的基础概念（写第一个程序前要知道的）","plain":"程序出错时显示的那一堆红色文字，告诉你出了什么错、错在哪一行","analogy":"就像体检报告，告诉你哪里有问题、什么类型的问题、严不严重","tip":"**学会读报错信息是程序员的第一技能！** 很多新手看到红色就慌，错误信息已经告诉你答案了","level":1,"tags":["入门"],"py":"baoc","pyFull":"baocuoxinxiyichang","searchText":"报错信息/异常 error/exception 程序出错时显示的那一堆红色文字，告诉你出了什么错、错在哪一行 就像体检报告，告诉你哪里有问题、什么类型的问题、严不严重 **学会读报错信息是程序员的第一技能！** 很多新手看到红色就慌，错误信息已经告诉你答案了"},{"id":"t0079","term":"压缩包","en":"Zip/RAR/7z Archive","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"把多个文件/文件夹打包成一个文件，体积更小，方便传输","analogy":"就像真空压缩袋，被子衣服抽真空后体积变小，一个袋子装下很多东西，用的时候再打开","tip":"Windows 11自带zip解压。其他格式装个**7-Zip**（免费）就能解。.rar用WinRAR（有广告）或Bandizip","level":1,"tags":["入门"],"py":"yasu","pyFull":"yasuobao","searchText":"压缩包 zip/rar/7z archive 把多个文件/文件夹打包成一个文件，体积更小，方便传输 就像真空压缩袋，被子衣服抽真空后体积变小，一个袋子装下很多东西，用的时候再打开 windows 11自带zip解压。其他格式装个**7-zip**（免费）就能解。.rar用winrar（有广告）或bandizip"},{"id":"t0080","term":"解压/解压缩","en":"Extract/Unzip","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"把压缩包里的文件释放出来","analogy":"就像打开真空袋，东西恢复原样，可以正常使用了","tip":"注意：别在压缩包里直接双击文件用！要先解压到文件夹里再打开，否则可能找不到配套文件","level":1,"tags":["入门"],"py":"jiey","pyFull":"jieyajieyasuo","searchText":"解压/解压缩 extract/unzip 把压缩包里的文件释放出来 就像打开真空袋，东西恢复原样，可以正常使用了 注意：别在压缩包里直接双击文件用！要先解压到文件夹里再打开，否则可能找不到配套文件"},{"id":"t0081","term":"隐藏文件","en":"Hidden File","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"系统默认不显示的文件，一般是系统配置文件，怕用户误删","analogy":"就像墙壁里的电线，藏起来不让你碰，碰了可能出问题","tip":"文件资源管理器→「查看」→勾选「隐藏的项目」就能看到。编程时的配置文件（.gitignore、.env）都是隐藏文件（以.开头）","level":1,"tags":["入门"],"py":"yinc","pyFull":"yincangwenjian","searchText":"隐藏文件 hidden file 系统默认不显示的文件，一般是系统配置文件，怕用户误删 就像墙壁里的电线，藏起来不让你碰，碰了可能出问题 文件资源管理器→「查看」→勾选「隐藏的项目」就能看到。编程时的配置文件（.gitignore、.env）都是隐藏文件（以.开头）"},{"id":"t0082","term":"英文输入法","en":"English Input","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"写代码必须切换到英文输入法！中文标点和英文标点不一样","analogy":"就像写英文作文不能用中文句号「。」代替英文句号「.」，编译器认不出来","tip":"**新手第一大坑！** 代码里所有符号必须是英文半角：括号()、分号;、冒号:、引号「」、逗号,。中文符号会报错！","level":1,"tags":["入门"],"py":"ying","pyFull":"yingwenshurufa","searchText":"英文输入法 english input 写代码必须切换到英文输入法！中文标点和英文标点不一样 就像写英文作文不能用中文句号「。」代替英文句号「.」，编译器认不出来 **新手第一大坑！** 代码里所有符号必须是英文半角：括号()、分号;、冒号:、引号「」、逗号,。中文符号会报错！"},{"id":"t0083","term":"半角/全角","en":"Half-width/Full-width","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"半角字符占1个字节（英文状态），全角占2个字节（中文状态）","analogy":"半角就像一个瘦子占半个座位，全角就像一个胖子占一个座位","tip":"编程一定用半角！按Shift切换中英文，看输入法状态栏是「中」还是「英」，写代码时保持「英」","level":1,"tags":["入门"],"py":"banj","pyFull":"banjiaoquanjiao","searchText":"半角/全角 half-width/full-width 半角字符占1个字节（英文状态），全角占2个字节（中文状态） 半角就像一个瘦子占半个座位，全角就像一个胖子占一个座位 编程一定用半角！按shift切换中英文，看输入法状态栏是「中」还是「英」，写代码时保持「英」"},{"id":"t0084","term":"截图","en":"Screenshot","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"把当前屏幕画面保存成图片","analogy":"就像给屏幕拍张照，拍到什么就是什么","tip":"快捷键：Win+Shift+S（Windows）截选区域；Cmd+Shift+4（Mac）。截图问问题比打字描述清楚100倍","level":1,"tags":["入门"],"py":"jiet","pyFull":"jietu","searchText":"截图 screenshot 把当前屏幕画面保存成图片 就像给屏幕拍张照，拍到什么就是什么 快捷键：win+shift+s（windows）截选区域；cmd+shift+4（mac）。截图问问题比打字描述清楚100倍"},{"id":"t0085","term":"剪贴板","en":"Clipboard","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"你复制（Ctrl+C）的内容临时存放的地方，粘贴（Ctrl+V）就是从这里取","analogy":"就像手里拿的东西，一次只能拿一个，拿新的旧的就掉了","tip":"Win+V可以打开剪贴板历史（Windows 10/11），能看到之前复制过的多个内容","level":1,"tags":["入门"],"py":"jian","pyFull":"jiantieban","searchText":"剪贴板 clipboard 你复制（ctrl+c）的内容临时存放的地方，粘贴（ctrl+v）就是从这里取 就像手里拿的东西，一次只能拿一个，拿新的旧的就掉了 win+v可以打开剪贴板历史（windows 10/11），能看到之前复制过的多个内容"},{"id":"t0086","term":"重启","en":"Restart/Reboot","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"关掉电脑重新开。90%的电脑小问题重启能解决","analogy":"就像睡一觉，脑子清醒了，乱七八糟的状态都清掉了","tip":"程序员三大法宝：重启、清缓存、换个浏览器。遇到玄学问题先重启试试","level":1,"tags":["入门"],"py":"chon","pyFull":"chongqi","searchText":"重启 restart/reboot 关掉电脑重新开。90%的电脑小问题重启能解决 就像睡一觉，脑子清醒了，乱七八糟的状态都清掉了 程序员三大法宝：重启、清缓存、换个浏览器。遇到玄学问题先重启试试"},{"id":"t0087","term":"管理员权限","en":"Administrator/Root","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"Windows的管理员账户、Linux/Mac的root用户，拥有最高权限能改任何设置","analogy":"就像房子的主人，租客（普通用户）不能砸墙改结构，房东（管理员）可以","tip":"日常使用别一直用管理员账户，万一误操作或中了病毒后果严重。Linux用`sudo`临时获取管理员权限","level":1,"tags":["入门"],"py":"guan","pyFull":"guanliyuanquanxian","searchText":"管理员权限 administrator/root windows的管理员账户、linux/mac的root用户，拥有最高权限能改任何设置 就像房子的主人，租客（普通用户）不能砸墙改结构，房东（管理员）可以 日常使用别一直用管理员账户，万一误操作或中了病毒后果严重。linux用`sudo`临时获取管理员权限"},{"id":"t0088","term":"驱动程序","en":"Driver","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"让硬件（显卡、打印机、鼠标）能和操作系统配合工作的小程序","analogy":"就像翻译，硬件说「硬件语」，系统说「系统语」，驱动在中间翻译","tip":"电脑没声音、连不上打印机、分辨率不对，大概率是驱动问题。装驱动用驱动精灵/驱动人生（注意去勾选捆绑）或去硬件官网下载","level":1,"tags":["入门"],"py":"qudo","pyFull":"qudongchengxu","searchText":"驱动程序 driver 让硬件（显卡、打印机、鼠标）能和操作系统配合工作的小程序 就像翻译，硬件说「硬件语」，系统说「系统语」，驱动在中间翻译 电脑没声音、连不上打印机、分辨率不对，大概率是驱动问题。装驱动用驱动精灵/驱动人生（注意去勾选捆绑）或去硬件官网下载"},{"id":"t0089","term":"软件版本号","en":"Version Number","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"软件更新的版本标记，如Python 3.11.4、Chrome 120.0","analogy":"就像年级和班级，大版本=年级（3），小版本=班级（11），补丁=学号（4）","tip":"学习教程时注意版本号！Python 2和Python 3差别很大，Vue 2和Vue 3写法不一样，别学错版本","level":1,"tags":["入门"],"py":"ruan","pyFull":"ruanjianbanbenhao","searchText":"软件版本号 version number 软件更新的版本标记，如python 3.11.4、chrome 120.0 就像年级和班级，大版本=年级（3），小版本=班级（11），补丁=学号（4） 学习教程时注意版本号！python 2和python 3差别很大，vue 2和vue 3写法不一样，别学错版本"},{"id":"t0090","term":"32位/64位","en":"32-bit/64-bit","chapter":"ch0","section":"0.7 压缩包、输入法和其他实用小知识","plain":"操作系统和软件的架构版本，64位能识别更大内存（超过4GB）","analogy":"就像32车道和64车道的高速公路，车道越多同时跑的车越多","tip":"现在电脑基本都是64位系统，软件也下64位版本（x64/amd64）。32位软件（x86）也能在64位系统上跑，但反过来不行","level":1,"tags":["入门"],"py":"weiw","pyFull":"weiwei","searchText":"32位/64位 32-bit/64-bit 操作系统和软件的架构版本，64位能识别更大内存（超过4gb） 就像32车道和64车道的高速公路，车道越多同时跑的车越多 现在电脑基本都是64位系统，软件也下64位版本（x64/amd64）。32位软件（x86）也能在64位系统上跑，但反过来不行"},{"id":"t0091","term":"算法","en":"Algorithm","chapter":"ch1","section":null,"plain":"解决问题的一套明确步骤，按步骤做一定能得出结果","analogy":"就像菜谱，准备食材→按步骤操作→出锅，每一步都写清楚了","tip":"算法=解决问题的思路。学算法不是背代码，是学「遇到某类问题应该怎么想」","level":2,"tags":[],"py":"suan","pyFull":"suanfa","searchText":"算法 algorithm 解决问题的一套明确步骤，按步骤做一定能得出结果 就像菜谱，准备食材→按步骤操作→出锅，每一步都写清楚了 算法=解决问题的思路。学算法不是背代码，是学「遇到某类问题应该怎么想」"},{"id":"t0092","term":"程序","en":"Program","chapter":"ch1","section":null,"plain":"按某种编程语言写的、让计算机执行的指令集合","analogy":"就像剧本，告诉每个「演员」（计算机组件）什么时候做什么","tip":"程序=算法+数据结构，写程序就是把解决问题的步骤翻译成计算机能懂的语言","level":2,"tags":[],"py":"chen","pyFull":"chengxu","searchText":"程序 program 按某种编程语言写的、让计算机执行的指令集合 就像剧本，告诉每个「演员」（计算机组件）什么时候做什么 程序=算法+数据结构，写程序就是把解决问题的步骤翻译成计算机能懂的语言"},{"id":"t0093","term":"代码","en":"Code","chapter":"ch1","section":null,"plain":"程序员写的、计算机能（或经过翻译能）看懂的文字","analogy":"就像合同条款，用双方约定的语言写清楚权利义务","tip":"代码是给人看的，顺便给机器执行。写得好的代码别人一读就懂","level":2,"tags":[],"py":"daim","pyFull":"daima","searchText":"代码 code 程序员写的、计算机能（或经过翻译能）看懂的文字 就像合同条款，用双方约定的语言写清楚权利义务 代码是给人看的，顺便给机器执行。写得好的代码别人一读就懂"},{"id":"t0094","term":"Bug","en":"Bug","chapter":"ch1","section":null,"plain":"程序里的错误/缺陷，导致运行结果不对或崩溃","analogy":"就像菜里的虫子，本来该好吃，结果出了意外","tip":"写程序出Bug是正常的，新手写代码50%时间在Debug，老手30%时间在Debug","level":2,"tags":[],"py":"bug","pyFull":"bug","searchText":"bug bug 程序里的错误/缺陷，导致运行结果不对或崩溃 就像菜里的虫子，本来该好吃，结果出了意外 写程序出bug是正常的，新手写代码50%时间在debug，老手30%时间在debug"},{"id":"t0095","term":"调试","en":"Debug","chapter":"ch1","section":null,"plain":"找Bug并修Bug的过程，程序员日常工作的核心","analogy":"就像医生看病，先找到病因，再开药治疗","tip":"学会用调试工具（断点、单步执行、打印日志）比写代码更重要","level":2,"tags":[],"py":"tiao","pyFull":"tiaoshi","searchText":"调试 debug 找bug并修bug的过程，程序员日常工作的核心 就像医生看病，先找到病因，再开药治疗 学会用调试工具（断点、单步执行、打印日志）比写代码更重要"},{"id":"t0096","term":"编译","en":"Compile","chapter":"ch1","section":null,"plain":"把人写的高级语言代码一次性翻译成计算机能直接执行的机器码","analogy":"就像翻译整本书，翻完了再给你看，执行快","tip":"C/C++是编译型语言，写完要先「编译」才能运行，报错在编译阶段就能发现","level":2,"tags":[],"py":"bian","pyFull":"bianyi","searchText":"编译 compile 把人写的高级语言代码一次性翻译成计算机能直接执行的机器码 就像翻译整本书，翻完了再给你看，执行快 c/c++是编译型语言，写完要先「编译」才能运行，报错在编译阶段就能发现"},{"id":"t0097","term":"解释","en":"Interpret","chapter":"ch1","section":null,"plain":"边读代码边执行，不需要提前全部翻译完","analogy":"就像同声传译，说一句翻一句，立刻能看到效果","tip":"Python/JavaScript是解释型语言，写一行就能跑一行，灵活但执行慢","level":2,"tags":[],"py":"jies","pyFull":"jieshi","searchText":"解释 interpret 边读代码边执行，不需要提前全部翻译完 就像同声传译，说一句翻一句，立刻能看到效果 python/javascript是解释型语言，写一行就能跑一行，灵活但执行慢"},{"id":"t0098","term":"二进制","en":"Binary","chapter":"ch1","section":null,"plain":"计算机只认识0和1，所有数据最终都由01串组成","analogy":"就像灯泡的开和关，只有两种状态，但组合起来能表达一切","tip":"学计算机不用天天写二进制，但要理解「一切皆01」是计算机的基础世界观","level":2,"tags":[],"py":"erji","pyFull":"erjinzhi","searchText":"二进制 binary 计算机只认识0和1，所有数据最终都由01串组成 就像灯泡的开和关，只有两种状态，但组合起来能表达一切 学计算机不用天天写二进制，但要理解「一切皆01」是计算机的基础世界观"},{"id":"t0099","term":"比特","en":"bit","chapter":"ch1","section":null,"plain":"最小信息单位，就是一个0或1","analogy":"就像一个灯，开是1，关是0","tip":"1bit只能表达是/否，但8bit=1Byte就能表达256种状态，组合起来信息量爆炸","level":2,"tags":[],"py":"bite","pyFull":"bite","searchText":"比特 bit 最小信息单位，就是一个0或1 就像一个灯，开是1，关是0 1bit只能表达是/否，但8bit=1byte就能表达256种状态，组合起来信息量爆炸"},{"id":"t0100","term":"字节","en":"Byte","chapter":"ch1","section":null,"plain":"8个比特组成1个字节，是计算机存储的基本单位","analogy":"就像一个字格，一个英文字母占1格，一个汉字占2-3格","tip":"记单位换算：1KB=1024Byte，1MB=1024KB，1GB=1024MB（注意是1024不是1000）","level":2,"tags":[],"py":"ziji","pyFull":"zijie","searchText":"字节 byte 8个比特组成1个字节，是计算机存储的基本单位 就像一个字格，一个英文字母占1格，一个汉字占2-3格 记单位换算：1kb=1024byte，1mb=1024kb，1gb=1024mb（注意是1024不是1000）"},{"id":"t0101","term":"内存","en":"Memory/RAM","chapter":"ch1","section":null,"plain":"计算机的「短期记忆」，程序运行时数据存在这里，断电就消失","analogy":"就像书桌，你正在看的书、写作业用的本子都摊在上面，拿起来快","tip":"内存越大，能同时开的程序越多。写程序时要注意内存使用，别「摊太多东西」","level":2,"tags":[],"py":"neic","pyFull":"neicun","searchText":"内存 memory/ram 计算机的「短期记忆」，程序运行时数据存在这里，断电就消失 就像书桌，你正在看的书、写作业用的本子都摊在上面，拿起来快 内存越大，能同时开的程序越多。写程序时要注意内存使用，别「摊太多东西」"},{"id":"t0102","term":"硬盘/存储","en":"Storage/ROM","chapter":"ch1","section":null,"plain":"计算机的「长期记忆」，数据断电后还在，读写比内存慢很多","analogy":"就像书架，书平时放在上面，用的时候再拿到书桌（内存）上","tip":"硬盘容量大但慢，内存小但快。程序要运行必须先从硬盘加载到内存","level":2,"tags":[],"py":"ying","pyFull":"yingpancunchu","searchText":"硬盘/存储 storage/rom 计算机的「长期记忆」，数据断电后还在，读写比内存慢很多 就像书架，书平时放在上面，用的时候再拿到书桌（内存）上 硬盘容量大但慢，内存小但快。程序要运行必须先从硬盘加载到内存"},{"id":"t0103","term":"CPU","en":"Central Processing Unit","chapter":"ch1","section":null,"plain":"计算机的「大脑」，负责计算和执行指令","analogy":"就像厨师，拿到食材（数据）按照菜谱（指令）做菜（计算）","tip":"CPU核心数越多，同时干的活越多；主频越高，单个活干得越快","level":2,"tags":[],"py":"cpu","pyFull":"cpu","searchText":"cpu central processing unit 计算机的「大脑」，负责计算和执行指令 就像厨师，拿到食材（数据）按照菜谱（指令）做菜（计算） cpu核心数越多，同时干的活越多；主频越高，单个活干得越快"},{"id":"t0104","term":"GPU","en":"Graphics Processing Unit","chapter":"ch1","section":null,"plain":"图形处理器，最初用来画图渲染，现在AI训练的主力","analogy":"就像一个有几千个小厨师的大厨房，每个小厨师做简单的菜，但一起做就很快","tip":"GPU vs CPU：CPU是几个大厨，适合做复杂但量少的任务；GPU是几千个小工，适合做简单但量大的任务（如AI训练）","level":2,"tags":[],"py":"gpu","pyFull":"gpu","searchText":"gpu graphics processing unit 图形处理器，最初用来画图渲染，现在ai训练的主力 就像一个有几千个小厨师的大厨房，每个小厨师做简单的菜，但一起做就很快 gpu vs cpu：cpu是几个大厨，适合做复杂但量少的任务；gpu是几千个小工，适合做简单但量大的任务（如ai训练）"},{"id":"t0105","term":"NPU/TPU","en":"Neural/Tensor Processing Unit","chapter":"ch1","section":null,"plain":"专门为AI神经网络计算设计的处理器","analogy":"就像专做某道菜的流水线，只做AI计算，但做得比GPU还快","tip":"2026年AI手机、AI PC都在搭载NPU，做端侧AI推理","level":2,"tags":[],"py":"nput","pyFull":"nputpu","searchText":"npu/tpu neural/tensor processing unit 专门为ai神经网络计算设计的处理器 就像专做某道菜的流水线，只做ai计算，但做得比gpu还快 2026年ai手机、ai pc都在搭载npu，做端侧ai推理"},{"id":"t0106","term":"缓存","en":"Cache","chapter":"ch1","section":null,"plain":"CPU和内存之间的高速小存储区，解决「CPU太快内存太慢」的矛盾","analogy":"就像灶台旁的调料架，最常用的调料放在手边（缓存），不用每次跑去仓库（内存）拿","tip":"缓存命中率是性能关键。写代码时让数据「紧凑、连续访问」能提高缓存命中率","level":2,"tags":[],"py":"huan","pyFull":"huancun","searchText":"缓存 cache cpu和内存之间的高速小存储区，解决「cpu太快内存太慢」的矛盾 就像灶台旁的调料架，最常用的调料放在手边（缓存），不用每次跑去仓库（内存）拿 缓存命中率是性能关键。写代码时让数据「紧凑、连续访问」能提高缓存命中率"},{"id":"t0107","term":"栈","en":"Stack","chapter":"ch1","section":null,"plain":"一种后进先出（LIFO）的数据结构，函数调用靠它管理","analogy":"就像一摞盘子，最后放上去的最先被拿走","tip":"函数调用时参数、返回地址都压栈；递归太深会「栈溢出」（Stack Overflow）","level":2,"tags":[],"py":"zhan","pyFull":"zhan","searchText":"栈 stack 一种后进先出（lifo）的数据结构，函数调用靠它管理 就像一摞盘子，最后放上去的最先被拿走 函数调用时参数、返回地址都压栈；递归太深会「栈溢出」（stack overflow）"},{"id":"t0108","term":"堆","en":"Heap","chapter":"ch1","section":null,"plain":"动态分配内存的区域，new/malloc出来的对象都在这里","analogy":"就像一个大仓库，你可以随时申请一块空间放东西，但要记得用完还回去","tip":"堆的分配和释放比栈慢，忘记释放会「内存泄漏」，这是C/C++的常见Bug","level":2,"tags":[],"py":"dui","pyFull":"dui","searchText":"堆 heap 动态分配内存的区域，new/malloc出来的对象都在这里 就像一个大仓库，你可以随时申请一块空间放东西，但要记得用完还回去 堆的分配和释放比栈慢，忘记释放会「内存泄漏」，这是c/c++的常见bug"},{"id":"t0109","term":"指针","en":"Pointer","chapter":"ch1","section":null,"plain":"存储内存地址的变量，它不存数据本身，而是存数据「在哪里」","analogy":"就像门牌号，不是房子本身，但告诉你房子在哪","tip":"C/C++的灵魂也是噩梦。理解指针就理解了内存管理的本质，但要小心空指针、野指针","level":2,"tags":[],"py":"zhiz","pyFull":"zhizhen","searchText":"指针 pointer 存储内存地址的变量，它不存数据本身，而是存数据「在哪里」 就像门牌号，不是房子本身，但告诉你房子在哪 c/c++的灵魂也是噩梦。理解指针就理解了内存管理的本质，但要小心空指针、野指针"},{"id":"t0110","term":"溢出","en":"Overflow","chapter":"ch1","section":null,"plain":"数据超过了容器能装的最大值","analogy":"就像往杯子里倒水倒满了还在倒，水溢出来了","tip":"整数溢出、栈溢出、缓冲区溢出都是常见Bug，严重的还能被黑客利用","level":2,"tags":[],"py":"yich","pyFull":"yichu","searchText":"溢出 overflow 数据超过了容器能装的最大值 就像往杯子里倒水倒满了还在倒，水溢出来了 整数溢出、栈溢出、缓冲区溢出都是常见bug，严重的还能被黑客利用"},{"id":"t0111","term":"开源","en":"Open Source","chapter":"ch1","section":null,"plain":"源代码公开，任何人都可以看、可以改、可以用","analogy":"就像公开菜谱，所有人都能看、能改进、能自己做","tip":"GitHub是最大的开源社区。学习开源项目源码是最好的进阶方式","level":2,"tags":[],"py":"kaiy","pyFull":"kaiyuan","searchText":"开源 open source 源代码公开，任何人都可以看、可以改、可以用 就像公开菜谱，所有人都能看、能改进、能自己做 github是最大的开源社区。学习开源项目源码是最好的进阶方式"},{"id":"t0112","term":"闭源","en":"Closed Source","chapter":"ch1","section":null,"plain":"源代码不公开，你只能用成品看不到内部","analogy":"就像餐厅的菜，你能吃，但不知道秘方是什么","tip":"Windows、iOS是闭源系统；Linux、Android是开源系统","level":2,"tags":[],"py":"biyu","pyFull":"biyuan","searchText":"闭源 closed source 源代码不公开，你只能用成品看不到内部 就像餐厅的菜，你能吃，但不知道秘方是什么 windows、ios是闭源系统；linux、android是开源系统"},{"id":"t0113","term":"协议","en":"Protocol","chapter":"ch1","section":null,"plain":"通信双方约定好的「说话规矩」，比如怎么开始、怎么结束、格式是什么","analogy":"就像两个人打电话，先说「喂」，结束说「再见」，都用同一种语言","tip":"计算机网络里协议无处不在：HTTP、TCP、IP、DNS...每一层都有自己的协议","level":2,"tags":[],"py":"xiey","pyFull":"xieyi","searchText":"协议 protocol 通信双方约定好的「说话规矩」，比如怎么开始、怎么结束、格式是什么 就像两个人打电话，先说「喂」，结束说「再见」，都用同一种语言 计算机网络里协议无处不在：http、tcp、ip、dns...每一层都有自己的协议"},{"id":"t0114","term":"接口","en":"Interface","chapter":"ch1","section":null,"plain":"两个系统/模块之间交互的约定，不用管对方内部怎么实现","analogy":"就像电源插座，你只要知道插头长什么样、多少伏电压，不用管发电厂怎么发电","tip":"编程时「面向接口编程」是好习惯，降低模块间耦合","level":2,"tags":[],"py":"jiek","pyFull":"jiekou","searchText":"接口 interface 两个系统/模块之间交互的约定，不用管对方内部怎么实现 就像电源插座，你只要知道插头长什么样、多少伏电压，不用管发电厂怎么发电 编程时「面向接口编程」是好习惯，降低模块间耦合"},{"id":"t0115","term":"API","en":"Application Programming Interface","chapter":"ch1","section":null,"plain":"应用程序编程接口，别人写好的功能，你按规则调用就行","analogy":"就像餐厅的菜单，你点菜（调用API），厨房（系统）给你上菜（返回结果），不用管怎么做的","tip":"调API是程序员日常工作的重要部分，学会读API文档比背API更重要","level":2,"tags":[],"py":"api","pyFull":"api","searchText":"api application programming interface 应用程序编程接口，别人写好的功能，你按规则调用就行 就像餐厅的菜单，你点菜（调用api），厨房（系统）给你上菜（返回结果），不用管怎么做的 调api是程序员日常工作的重要部分，学会读api文档比背api更重要"},{"id":"t0116","term":"SDK","en":"Software Development Kit","chapter":"ch1","section":null,"plain":"软件开发工具包，一套帮你快速开发的工具+文档+示例的集合","analogy":"就像家具DIY套装，给你木板、螺丝、图纸和工具，按说明就能拼起来","tip":"开发安卓要安卓SDK，开发微信小程序要微信SDK，调大模型要OpenAI SDK","level":2,"tags":[],"py":"sdk","pyFull":"sdk","searchText":"sdk software development kit 软件开发工具包，一套帮你快速开发的工具+文档+示例的集合 就像家具diy套装，给你木板、螺丝、图纸和工具，按说明就能拼起来 开发安卓要安卓sdk，开发微信小程序要微信sdk，调大模型要openai sdk"},{"id":"t0117","term":"框架","en":"Framework","chapter":"ch1","section":null,"plain":"半成品代码骨架，已经搭好了架子，你只填业务逻辑","analogy":"就像精装房，水电墙面都做好了，你只需要买家具家电搬进去","tip":"框架决定了项目的结构。学框架先学它的「设计思想」，再学API","level":2,"tags":[],"py":"kuan","pyFull":"kuangjia","searchText":"框架 framework 半成品代码骨架，已经搭好了架子，你只填业务逻辑 就像精装房，水电墙面都做好了，你只需要买家具家电搬进去 框架决定了项目的结构。学框架先学它的「设计思想」，再学api"},{"id":"t0118","term":"迭代","en":"Iteration","chapter":"ch1","section":null,"plain":"反复改进、一版一版更新的开发方式","analogy":"就像写作文，第一版打草稿，第二版修改，第三版润色","tip":"软件开发几乎都是迭代式的，没有一版就完美的软件","level":2,"tags":[],"py":"died","pyFull":"diedai","searchText":"迭代 iteration 反复改进、一版一版更新的开发方式 就像写作文，第一版打草稿，第二版修改，第三版润色 软件开发几乎都是迭代式的，没有一版就完美的软件"},{"id":"t0119","term":"重构","en":"Refactoring","chapter":"ch1","section":null,"plain":"不改变功能的前提下，重写代码让它更好看、更好维护","analogy":"就像整理房间，东西位置不变，但重新摆放后更整洁更好找","tip":"重构不是重写！好的重构随时都在做，烂代码越积越多最后就没法维护了","level":2,"tags":[],"py":"zhon","pyFull":"zhonggou","searchText":"重构 refactoring 不改变功能的前提下，重写代码让它更好看、更好维护 就像整理房间，东西位置不变，但重新摆放后更整洁更好找 重构不是重写！好的重构随时都在做，烂代码越积越多最后就没法维护了"},{"id":"t0120","term":"部署","en":"Deploy","chapter":"ch1","section":null,"plain":"把写好的程序放到服务器上，让用户能访问使用","analogy":"就像开店，装修好了（开发完），得开门营业（部署到服务器）","tip":"部署不只是把代码放上去，还要配环境、配域名、做监控","level":2,"tags":[],"py":"bush","pyFull":"bushu","searchText":"部署 deploy 把写好的程序放到服务器上，让用户能访问使用 就像开店，装修好了（开发完），得开门营业（部署到服务器） 部署不只是把代码放上去，还要配环境、配域名、做监控"},{"id":"t0121","term":"上线","en":"Go Live","chapter":"ch1","section":null,"plain":"程序正式对外提供服务，真实用户能用到了","analogy":"就像开业，剪彩那天正式接客","tip":"上线当天程序员最紧张，通常选在凌晨用户最少的时候","level":2,"tags":[],"py":"shan","pyFull":"shangxian","searchText":"上线 go live 程序正式对外提供服务，真实用户能用到了 就像开业，剪彩那天正式接客 上线当天程序员最紧张，通常选在凌晨用户最少的时候"},{"id":"t0122","term":"回滚","en":"Rollback","chapter":"ch1","section":null,"plain":"上线出问题了，赶紧退回到上一个正常版本","analogy":"就像升级手机系统变砖了，赶紧刷回旧版本","tip":"回滚是程序员的「后悔药」，上线前一定要想好怎么回滚","level":2,"tags":[],"py":"huig","pyFull":"huigun","searchText":"回滚 rollback 上线出问题了，赶紧退回到上一个正常版本 就像升级手机系统变砖了，赶紧刷回旧版本 回滚是程序员的「后悔药」，上线前一定要想好怎么回滚"},{"id":"t0123","term":"灰度发布","en":"Gray Release","chapter":"ch1","section":null,"plain":"先让一小部分用户用新版本，没问题再逐步全量推送","analogy":"就像新菜试吃，先给几桌客人尝，反馈好了再全部菜单更新","tip":"灰度发布降低风险，万一新功能有Bug只影响少数用户","level":2,"tags":[],"py":"huid","pyFull":"huidufabu","searchText":"灰度发布 gray release 先让一小部分用户用新版本，没问题再逐步全量推送 就像新菜试吃，先给几桌客人尝，反馈好了再全部菜单更新 灰度发布降低风险，万一新功能有bug只影响少数用户"},{"id":"t0124","term":"机器语言","en":null,"chapter":"ch2","section":"2.1 编程语言核心概念","plain":"纯01代码，计算机直接能跑，人根本看不懂","analogy":"就像看蚂蚁的信息素，蚂蚁能懂，人看不 式编程（fp）  把计算当作数学函数来写，尽量不用变量、不修改状态 就像数学公式，f(x)=x²，输入相同永远输出相同，没有「副作用」 大数据（scala）、前端（react hooks）越来越多用函数式思想，了解即可"},{"id":"t0130","term":"静态类型","en":null,"chapter":"ch2","section":"2.1 编程语言核心概念","plain":"变量类型在编译时就确定，写错类型编译就报错","analogy":"就像提前买好固定大小的盒子，大了小了都不行，买的时候就定了","tip":"Java/C++是静态类型，写的时候要声明类型（int a=1），编译器帮你提前抓Bug","level":4,"tags":[],"py":"jing","pyFull":"jingtaileixing","searchText":"静态类型  变量类型在编译时就确定，写错类型编译就报错 就像提前买好固定大小的盒子，大了小了都不行，买的时候就定了 java/c++是静态类型，写的时候要声明类型（int a=1），编译器帮你提前抓bug"},{"id":"t0131","term":"动态类型","en":null,"chapter":"ch2","section":"2.1 编程语言核心概念","plain":"变量类型运行时才确定，一个变量一会儿是数字一会儿是字符串","analogy":"就像万能收纳箱，想放什么放什么，不用提前声明","tip":"Python/JS是动态类型，写起来灵活灵活，但类型错误要运行时才发现","level":4,"tags":[],"py":"dong","pyFull":"dongtaileixing","searchText":"动态类型  变量类型运行时才确定，一个变量一会儿是数字一会儿是字符串 就像万能收纳箱，想放什么放什么，不用提前声明 python/js是动态类型，写起来灵活灵活，但类型错误要运行时才发现"},{"id":"t0132","term":"强类型","en":null,"chapter":"ch2","section":"2.1 编程语言核心概念","plain":"类型管得严，不同类型不能随便混用，比如不能数字加字符串","analogy":"就像垃圾分类，厨余垃圾和可回收不能混一起扔","tip":"Python/Java是强类型，1+「2」会报错，需要手动转换","level":4,"tags":[],"py":"qian","pyFull":"qiangleixing","searchText":"强类型  类型管得严，不同类型不能随便混用，比如不能数字加字符串 就像垃圾分类，厨余垃圾和可回收不能混一起扔 python/java是强类型，1+「2」会报错，需要手动转换"},{"id":"t0133","term":"弱类型","en":null,"chapter":"ch2","section":"2.1 编程语言核心概念","plain":"类型管得松，不同类型能自动转换","analogy":"就像大杂烩，什么都能往一个锅里扔","tip":"JavaScript/PHP是弱类型，1+「2」会自动转成「12」，方便但容易出隐蔽Bug","level":4,"tags":[],"py":"ruol","pyFull":"ruoleixing","searchText":"弱类型  类型管得松，不同类型能自动转换 就像大杂烩，什么都能往一个锅里扔 javascript/php是弱类型，1+「2」会自动转成「12」，方便但容易出隐蔽bug"},{"id":"t0134","term":"编译型语言","en":null,"chapter":"ch2","section":"2.1 编程语言核心概念","plain":"代码先全部编译成机器码再执行，运行快","analogy":"就像提前翻译好整本书，拿起来就读，读得快","tip":"C/C++/Rust/Go是编译型，执行效率高，但跨平台需要重新编译","level":4,"tags":[],"py":"bian","pyFull":"bianyixingyuyan","searchText":"编译型语言  代码先全部编译成机器码再执行，运行快 就像提前翻译好整本书，拿起来就读，读得快 c/c++/rust/go是编译型，执行效率高，但跨平台需要重新编译"},{"id":"t0135","term":"解释型语言","en":null,"chapter":"ch2","section":"2.1 编程语言核心概念","plain":"边解释边执行，不需要提前编译","an  就像棋谱，前人下棋总结的经典走法，照着下不会太差 初学不用死记硬背，写多了代码再回头看设计模式会有「原来如此」的感觉"},{"id":"t0141","term":"数据结构","en":null,"chapter":"ch3","section":null,"plain":"数据在计算机里的组织方式，不同结构适合不同场景","analogy":"就像家里的收纳，衣服挂衣柜、书放书架、调料放灶台，东西不同放法不同","tip":"程序=数据结构+算法。选对数据结构，问题就解决了一半","level":2,"tags":[],"py":"shuj","pyFull":"shujujiegou","searchText":"数据结构  数据在计算机里的组织方式，不同结构适合不同场景 就像家里的收纳，衣服挂衣柜、书放书架、调料放灶台，东西不同放法不同 程序=数据结构+算法。选对数据结构，问题就解决了一半"},{"id":"t0142","term":"时间复杂度","en":null,"chapter":"ch3","section":null,"plain":"算法运行时间随数据量增长的变化趋势，用大O表示","analogy":"就像找人，在电话本里一页页翻是O(n)，按姓氏首字母找是O(log n)","tip":"不关心具体跑几秒，关心「数据多10倍时慢几倍」。面试必问","level":2,"tags":[],"py":"shij","pyFull":"shijianfuzadu","searchText":"时间复杂度  算法运行时间随数据量增长的变化趋势，用大o表示 就像找人，在电话本里一页页翻是o(n)，按姓氏首字母找是o(log n) 不关心具体跑几秒，关心「数据多10倍时慢几倍」。面试必问"},{"id":"t0143","term":"空间复杂度","en":null,"chapter":"ch3","section":null,"plain":"算法占用内存随数据量增长的变化趋势","analogy":"就像做菜，做一道菜占一个灶，做十道菜是占十个灶还是一个灶轮着用","tip":"有时可以用空间换时间（多占内存换更快速度），反之亦然","level":2,"tags":[],"py":"kong","pyFull":"kongjianfuzadu","searchText":"空间复杂度  算法占用内存随数据量增长的变化趋势 就像做菜，做一道菜占一个灶，做十道菜是占十个灶还是一个灶轮着用 有时可以用空间换时间（多占内存换更快速度），反之亦然"},{"id":"t0144","term":"大O表示法","en":null,"chapter":"ch3","section":null,"plain":"O(1)\u003cO(log n)\u003cO(n)\u003cO(n log n)\u003cO(n²)\u003cO(2ⁿ)，衡量算法效率的标准","analogy":"就像交通工具，O(1)是传送门，O(log n)是高铁，O(n)是开车，O(n²)是走路","tip":"记住常见排序/查找的复杂度，面试手写算法前先想复杂度够不够优","level":2,"tags":[],"py":"daob","pyFull":"daobiaoshifa","searchText":"大o表示法  o(1)\u003co(log n)\u003co(n)\u003co(n log n)\u003co(n²)\u003co(2ⁿ)，衡量算法效率的标准 就像交通工具，o(1)是传送门，o(log n)是高铁，o(n)是开车，o(n²)是走路 记住常见排序/查找的复杂度，面试手写算法前先想复杂度够不够优"},{"id":"t0145","term":"数组","en":null,"chapter":"ch3","section":null,"plain":"连续内存存储相同类型数据，随机访问O(1)，插入删除O(n)","analogy":"就像一排座位，知道第几个位置直接走过去（快），但中间加个人要往后挪（慢）","tip":"数组是最基础的数据结构，链表、栈、队列都可以用数组实现","level":2,"tags":[],"py":"shuz","pyFull":"shuzu","searchText":"数组  连续内存存储相同类型数据，随机访问o(1)，插入删除o(n) 就像一排座位，知道第几个位置直接走过去（快），但中间加个人要往后挪（慢） 数组是最基础的数据结构，链表、栈、队列都可以用数组实现"},{"id":"t0146","term":"链表","en":null,"chapter":"ch3","section":null,"plain":"每个节点存数据+指针指向下一个节点，插入删除O(1)，访问O(n)","analogy":"就像寻宝游戏，每个线索只告诉你下一个线索在哪，要找第5个必须从头走","tip":"链表头插尾删快，但找东西要遍历。常考「反转链表」「快慢指针找环」","level":2,"tags":[],"py":"lian","pyFull":"lianbiao","searchText":"链表  每个节点存数据+指针指向下一个节点，插入删除o(1)，访问o(n) 就像寻宝游戏，每个线索只告诉你下一个线索在哪，要找第5个必须从头走 链表头插尾删快，但找东西要遍历。常考「反转链表」「快慢指针找环」"},{"id":"t0147","term":"栈","en":null,"chapter":"ch3","section":null,"plain":"后进先出（LIFO），像一摞盘子","analogy":"浏览器的后退按钮，最后打开的页面最先退回去","tip":"栈的应用：函数调用、括号匹配、表达式求值、DFS深度优先搜索","level":2,"tags":[],"py":"zhan","pyFull":"zhan","searchText":"栈  后进先出（lifo），像一摞盘子 浏览器的后退按钮，最后打开的页面最先退回去 栈的应用：函数调用、括号匹配、表达式求值、dfs深度优先搜索"},{"id":"t0148","term":"队列","en":null,"chapter":"ch3","section":null,"plain":"先进先出（FIFO），像排队买饭","analogy":"食堂打饭，先排队的先打到饭","tip":"队列的应用：BFS广度优先搜索、任务调度、消息队列","level":2,"tags":[],"py":"duil","pyFull":"duilie","searchText":"队列  先进先出（fifo），像排队买饭 食堂打饭，先排队的先打到饭 队列的应用：bfs广度优先搜索、任务调度、消息队列"},{"id":"t0149","term":"双端队列（Deque）","en":null,"chapter":"ch3","section":null,"plain":"两头都能进出的队列","analogy":"就像双向通道，前门后门都能进出","tip":"实现滑动窗口最大值问题时很有用","level":2,"tags":[],"py":"shua","pyFull":"shuangduanduilie","searchText":"双端队列（deque）  两头都能进出的队列 就像双向通道，前门后门都能进出 实现滑动窗口最大值问题时很有用"},{"id":"t0150","term":"哈希表","en":null,"chapter":"ch3","section":null,"plain":"键值对存储，通过哈希函数把key映射到位置，查找O(1)","analogy":"就像字典，用偏旁部首（key）直接查到字（value）在哪一页","tip":"哈希表是最高效的查找结构，Python的dict、Java的HashMap都是。面试超高频考点","level":2,"tags":[],"py":"haxi","pyFull":"haxibiao","searchText":"哈希表  键值对存储，通过哈希函数把key映射到位置，查找o(1) 就像字典，用偏旁部首（key）直接查到字（value）在哪一页 哈希表是最高效的查找结构，python的dict、java的hashmap都是。面试超高频考点"},{"id":"t0151","term":"集合（Set）","en":null,"chapter":"ch3","section":null,"plain":"不允许重复元素的集合，支持交集并集差集","analogy":"就像班级名单，每个人名字唯一，可以算「两个班共同选修某课的人」","tip":"去重首选Set，判断元素是否存在也用Set","level":2,"tags":[],"py":"jihe","pyFull":"jihe","searchText":"集合（set）  不允许重复元素的集合，支持交集并集差集 就像班级名单，每个人名字唯一，可以算「两个班共同选修某课的人」 去重首选set，判断元素是否存在也用set"},{"id":"t0152","term":"树","en":null,"chapter":"ch3","section":null,"plain":"层级结构，有根节点、子节点、叶子节点","analogy":"就像家谱/公司组织架构，有一个老祖宗，下面分支","tip":"树是图的特例（无环连通图），数据库索引、文件系统都是树结构","level":2,"tags":[],"py":"shu","pyFull":"shu","searchText":"树  层级结构，有根节点、子节点、叶子节点 就像家谱/公司组织架构，有一个老祖宗，下面分支 树是图的特例（无环连通图），数据库索引、文件系统都是树结构"},{"id":"t0153","term":"二叉树","en":null,"chapter":"ch3","section":null,"plain":"每个节点最多两个子节点（左孩子、右孩子）","analogy":"就像一个人最多生两个孩子的家谱","tip":"二叉树是最常考的树结构，要能手写前/中/后/层序遍历","level":2,"tags":[],"py":"erch","pyFull":"erchashu","searchText":"二叉树  每个节点最多两个子节点（左孩子、右孩子） 就像一个人最多生两个孩子的家谱 二叉树是最常考的树结构，要能手写前/中/后/层序遍历"},{"id":"t0154","term":"二叉搜索树（BST）","en":null,"chapter":"ch3","section":null,"plain":"左子树都比根小，右子树都比根大，查找效率O(log n)","analogy":"就像猜数字游戏，我说50，你说大了或小了，很快能猜到","tip":"BST退化成链表就是O(n)了，所以才有平衡二叉树","level":2,"tags":[],"py":"erch","pyFull":"erchasousuoshu","searchText":"二叉搜索树（bst）  左子树都比根小，右子树都比根大，查找效率o(log n) 就像猜数字游戏，我说50，你说大了或小了，很快能猜到 bst退化成链表就是o(n)了，所以才有平衡二叉树"},{"id":"t0155","term":"平衡二叉树（AVL/红黑树）","en":null,"chapter":"ch3","section":null,"plain":"通过旋转保持左右子树高度差不超过1，防止退化","analogy":"就像整理书架，书歪了就扶正，保持平衡","tip":"红黑树用得更多（Java的TreeMap、Linux进程调度），插入删除比AVL快","level":2,"tags":[],"py":"ping","pyFull":"pinghengerchashu","searchText":"平衡二叉树（avl/红黑树）  通过旋转保持左右子树高度差不超过1，防止退化 就像整理书架，书歪了就扶正，保持平衡 红黑树用得更多（java的treemap、linux进程调度），插入删除比avl快"},{"id":"t0156","term":"堆（Heap）","en":null,"chapter":"ch3","section":null,"plain":"完全二叉树，分最大堆（根最大）和最小堆（根最小）","analogy":"就像排队取号，VIP永远在最前面（最大堆）","tip":"堆的应用：优先队列、Top-K问题、堆排序","level":2,"tags":[],"py":"dui","pyFull":"dui","searchText":"堆（heap）  完全二叉树，分最大堆（根最大）和最小堆（根最小） 就像排队取号，vip永远在最前面（最大堆） 堆的应用：优先队列、top-k问题、堆排序"},{"id":"t0157","term":"图","en":null,"chapter":"ch3","section":null,"plain":"顶点+边构成的网络结构，表示多对多关系","analogy":"就像地图，城市是顶点，路是边，路有长短（权重）有方向","tip":"图最灵活但也最复杂。常考：DFS/BFS遍历、最短路径、最小生成树","level":2,"tags":[],"py":"tu","pyFull":"tu","searchText":"图  顶点+边构成的网络结构，表示多对多关系 就像地图，城市是顶点，路是边，路有长短（权重）有方向 图最灵活但也最复杂。常考：dfs/bfs遍历、最短路径、最小生成树"},{"id":"t0158","term":"有向图/无向图","en":null,"chapter":"ch3","section":null,"plain":"边有方向（微博关注）vs 边无方向（微信好友）","analogy":"有向=单相思，无向=互相喜欢","tip":"社交网络里「
