关注」是有向图，「好友」是无向图","level":2,"tags":[],"py":"youx","pyFull":"youxiangtuwuxiangtu","searchText":"有向图/无向图  边有方向（微博关注）vs 边无方向（微信好友） 有向=单相思，无向=互相喜欢 社交网络里「关注」是有向图，「好友」是无向图"},{"id":"t0159","term":"邻接矩阵/邻接表","en":null,"chapter":"ch3","section":null,"plain":"图的两种存储方式：二维数组 vs 链表数组","analogy":"邻接矩阵=全班座位表（谁和谁都标清楚），邻接表=每个人的好友名单","tip":"稠密图用矩阵，稀疏图用邻接表。实际开发中邻接表更常用","level":2,"tags":[],"py":"linj","pyFull":"linjiejuzhenlinjiebiao","searchText":"邻接矩阵/邻接表  图的两种存储方式：二维数组 vs 链表数组 邻接矩阵=全班座位表（谁和谁都标清楚），邻接表=每个人的好友名单 稠密图用矩阵，稀疏图用邻接表。实际开发中邻接表更常用"},{"id":"t0160","term":"排序算法","en":null,"chapter":"ch3","section":null,"plain":"把数据按顺序排列：冒泡、选择、插入、归并、快速、堆排序...","analogy":"就像排成绩，不同方法有不同的排法","tip":"快排和归并面试最常考。快排平均最快但不稳定；归并稳定且适合大数据","level":2,"tags":[],"py":"paix","pyFull":"paixusuanfa","searchText":"排序算法  把数据按顺序排列：冒泡、选择、插入、归并、快速、堆排序... 就像排成绩，不同方法有不同的排法 快排和归并面试最常考。快排平均最快但不稳定；归并稳定且适合大数据"},{"id":"t0161","term":"查找算法","en":null,"chapter":"ch3","section":null,"plain":"在数据中找目标：顺序查找、二分查找、哈希查找","analogy":"就像在字典里找字，一页页翻是顺序，按部首找是二分","tip":"有序数组用二分查找（O(log n)），无序用哈希（O(1)）","level":2,"tags":[],"py":"chaz","pyFull":"chazhaosuanfa","searchText":"查找算法  在数据中找目标：顺序查找、二分查找、哈希查找 就像在字典里找字，一页页翻是顺序，按部首找是二分 有序数组用二分查找（o(log n)），无序用哈希（o(1)）"},{"id":"t0162","term":"动态规划（DP）","en":null,"chapter":"ch3","section":null,"plain":"把大问题拆成重叠子问题，存中间结果避免重复计算","analogy":"就像爬楼梯，到第10层的走法=到第9层走1步+到第8层走2步","tip":"DP是算法面试最难的部分，核心：定义状态→找转移方程→确定base case","level":2,"tags":[],"py":"dong","pyFull":"dongtaiguihua","searchText":"动态规划（dp）  把大问题拆成重叠子问题，存中间结果避免重复计算 就像爬楼梯，到第10层的走法=到第9层走1步+到第8层走2步 dp是算法面试最难的部分，核心：定义状态→找转移方程→确定base case"},{"id":"t0163","term":"贪心算法","en":null,"chapter":"ch3","section":null,"plain":"每一步选当前最优，希望全局最优，不保证一定对但快","analogy":"就像找零钱，先拿最大面值，再拿次大的","tip":"贪心不一定得到最优解（比如零钱问题有些面值组合会失败），但简单高效","level":2,"tags":[],"py":"tanx","pyFull":"tanxinsuanfa","searchText":"贪心算法  每一步选当前最优，希望全局最优，不保证一定对但快 就像找零钱，先拿最大面值，再拿次大的 贪心不一定得到最优解（比如零钱问题有些面值组合会失败），但简单高效"},{"id":"t0164","term":"回溯法","en":null,"chapter":"ch3","section":null,"plain":"试探+回退，走不通就退回来换条路","analogy":"就像走迷宫，走不通就退回到岔路口走另一条","tip":"回溯=DFS+剪枝。八皇后、全排列、组合总和是经典题","level":2,"tags":[],"py":"huis","pyFull":"huisufa","searchText":"回溯法  试探+回退，走不通就退回来换条路 就像走迷宫，走不通就退回到岔路口走另一条 回溯=dfs+剪枝。八皇后、全排列、组合总和是经典题"},{"id":"t0165","term":"分治法","en":null,"chapter":"ch3","section":null,"plain":"把大问题分成小问题分别解决再合并结果","analogy":"就像统计全校人数，每个班统计好加起来就是总数","tip":"归并排序、快速排序都是分治思想","level":2,"tags":[],"py":"fenz","pyFull":"fenzhifa","searchText":"分治法  把大问题分成小问题分别解决再合并结果 就像统计全校人数，每个班统计好加起来就是总数 归并排序、快速排序都是分治思想"},{"id":"t0166","term":"递归","en":null,"chapter":"ch3","section":null,"plain":"函数调用自己，必须有终止条件（base case）","analogy":"就像俄罗斯套娃，打开一个里面还有一个，直到最小的那个","tip":"递归三要素：终止条件、返回值、本级做什么。递归容易栈溢出","level":2,"tags":[],"py":"digu","pyFull":"digui","searchText":"递归  函数调用自己，必须有终止条件（base case） 就像俄罗斯套娃，打开一个里面还有一个，直到最小的那个 递归三要素：终止条件、返回值、本级做什么。递归容易栈溢出"},{"id":"t0167","term":"备忘录（Memoization）","en":null,"chapter":"ch3","section":null,"plain":"把算过的结果缓存起来，避免重复计算","analogy":"就像考试小抄，算过的题记下来，下次不用再算","tip":"递归+备忘录=自顶向下DP，斐波那契数列用备忘录从O(2ⁿ)降到O(n)","level":2,"tags":[],"py":"beiw","pyFull":"beiwanglu","searchText":"备忘录（memoization）  把算过的结果缓存起来，避免重复计算 就像考试小抄，算过的题记下来，下次不用再算 递归+备忘录=自顶向下dp，斐波那契数列用备忘录从o(2ⁿ)降到o(n)"},{"id":"t0168","term":"滑动窗口","en":null,"chapter":"ch3","section":null,"plain":"用左右指针维护一个窗口，解决子数组/子串问题","analogy":"就像望远镜，窗口在数据上滑动，只关注窗口内的东西","tip":"最长无重复子串、最小覆盖子串是经典滑动窗口题","level":2,"tags":[],"py":"huad","pyFull":"huadongchuangkou","searchText":"滑动窗口  用左右指针维护一个窗口，解决子数组/子串问题 就像望远镜，窗口在数据上滑动，只关注窗口内的东西 最长无重复子串、最小覆盖子串是经典滑动窗口题"},{"id":"t0169","term":"快慢指针","en":null,"chapter":"ch3","section":null,"plain":"一个快指针一个慢指针，解决链表问题","analogy":"就像赛跑，快的人跑得快，如果有环一定会追上慢的","tip":"应用：判断链表是否有环、找链表中点、找倒数第K个节点","level":2,"tags":[],"py":"kuai","pyFull":"kuaimanzhizhen","searchText":"快慢指针  一个快指针一个慢指针，解决链表问题 就像赛跑，快的人跑得快，如果有环一定会追上慢的 应用：判断链表是否有环、找链表中点、找倒数第k个节点"},{"id":"t0170","term":"前缀和","en":null,"chapter":"ch3","section":null,"plain":"提前算好前N项和，区间求和O(1)","analogy":"就像累计积分卡，存好到每天为止的总积分，算某几天的积分差就好","tip":"处理「求数组某段和」的问题时很好用","level":2,"tags":[],"py":"qian","pyFull":"qianzhuihe","searchText":"前缀和  提前算好前n项和，区间求和o(1) 就像累计积分卡，存好到每天为止的总积分，算某几天的积分差就好 处理「求数组某段和」的问题时很好用"},{"id":"t0171","term":"并查集（Union-Find）","en":null,"chapter":"ch3","section":null,"plain":"处理动态连通性问题：朋友圈、岛屿数量","analogy":"就像认祖归宗，每个人找自己的祖宗，是一家人就认亲","tip":"核心两个操作：find（找根）、union（合并集合），路径压缩后几乎O(1)","level":2,"tags":[],"py":"bing","pyFull":"bingchaji","searchText":"并查集（union-find）  处理动态连通性问题：朋友圈、岛屿数量 就像认祖归宗，每个人找自己的祖宗，是一家人就认亲 核心两个操作：find（找根）、union（合并集合），路径压缩后几乎o(1)"},{"id":"t0172","term":"字典树（Trie）","en":null,"chapter":"ch3","section":null,"plain":"专门处理字符串前缀匹配的树结构","analogy":"就像输入法联想，输入「计」能提示「计算机」「计算」","tip":"搜索自动补全、前缀匹配、敏感词过滤","level":2,"tags":[],"py":"zidi","pyFull":"zidianshu","searchText":"字典树（trie）  专门处理字符串前缀匹配的树结构 就像输入法联想，输入「计」能提示「计算机」「计算」 搜索自动补全、前缀匹配、敏感词过滤"},{"id":"t0173","term":"布隆过滤器","en":null,"chapter":"ch3","section":null,"plain":"判断元素「一定不在」或「可能在」集合里，省空间但有误判","analogy":"就像黑名单过滤，名单上有的一定拦，名单上没有的偶尔误拦","tip":"用于缓存穿透防护、爬虫URL去重，省内存但有假阳性","level":2,"tags":[],"py":"bulo","pyFull":"bulongguolqi","searchText":"布隆过滤器  判断元素「一定不在」或「可能在」集合里，省空间但有误判 就像黑名单过滤，名单上有的一定拦，名单上没有的偶尔误拦 用于缓存穿透防护、爬虫url去重，省内存但有假阳性"},{"id":"t0174","term":"冯·诺依曼结构","en":null,"chapter":"ch4","section":null,"plain":"现代计算机基本架构：运算器+控制器+存储器+输入+输出","analogy":"就像一个人，大脑算（运算器+控制器）、记忆（存储器）、眼睛耳朵看（输入）、嘴说手做（输出）","tip":"核心思想：程序和数据都存在存储器里，计算机按顺序执行指令。现在所有电脑都是这个结构","level":2,"tags":[],"py":"feng","pyFull":"fengnuoyimanjiegou","searchText":"冯·诺依曼结构  现代计算机基本架构：运算器+控制器+存储器+输入+输出 就像一个人，大脑算（运算器+控制器）、记忆（存储器）、眼睛耳朵看（输入）、嘴说手做（输出） 核心思想：程序和数据都存在存储器里，计算机按顺序执行指令。现在所有电脑都是这个结构"},{"id":"t0175","term":"指令集","en":null,"chapter":"ch4","section":null,"plain":"CPU能理解的指令集合，x86（Intel/AMD）和ARM（手机/苹果M系列）两大阵营","analogy":"就像不同语言，说中文的CPU听不懂英文指令","tip":"x86是CISC复杂指令集，性能强功耗大（电脑/服务器）；ARM是RISC精简指令集，功耗低（手机/平板/M系列芯片）","level":2,"tags":[],"py":"zhil","pyFull":"zhilingji","searchText":"指令集  cpu能理解的指令集合，x86（intel/amd）和arm（手机/苹果m系列）两大阵营 就像不同语言，说中文的cpu听不懂英文指令 x86是cisc复杂指令集，性能强功耗大（电脑/服务器）；arm是risc精简指令集，功耗低（手机/平板/m系列芯片）"},{"id":"t0176","term":"CISC","en":null,"chapter":"ch4","section":null,"plain":"复杂指令集，一条指令能做复杂的事","analogy":"就像中文成语，四个字能表达一长串意思","tip":"x86用CISC，硬件复杂但编译器好写","level":2,"tags":[],"py":"cisc","pyFull":"cisc","searchText":"cisc  复杂指令集，一条指令能做复杂的事 就像中文成语，四个字能表达一长串意思 x86用cisc，硬件复杂但编译器好写"},{"id":"t0177","term":"RISC","en":null,"chapter":"ch4","section":null,"plain":"精简指令集，指令少而简单，靠组合完成复杂任务","analogy":"就像26个英文字母，字母很少，但组合起来能写所有单词","tip":"ARM/RISC-V用RISC，硬件简单功耗低，是未来趋势（苹果M系列、国产芯片都是RISC）","level":2,"tags":[],"py":"risc","pyFull":"risc","searchText":"risc  精简指令集，指令少而简单，靠组合完成复杂任务 就像26个英文字母，字母很少，但组合起来能写所有单词 arm/risc-v用risc，硬件简单功耗低，是未来趋势（苹果m系列、国产芯片都是risc）"},{"id":"t0178","term":"寄存器","en":null,"chapter":"ch4","section":null,"plain":"CPU内部的超高速存储，比缓存还快，CPU做计算直接用寄存器里的数据","analogy":"就像厨师手里拿着的食材，正在处理的东西直接在手里","tip":"寄存器数量很少（几十到几百个），但速度是内存的100倍","level":2,"tags":[],"py":"jicu","pyFull":"jicunqi","searchText":"寄存器  cpu内部的超高速存储，比缓存还快，cpu做计算直接用寄存器里的数据 就像厨师手里拿着的食材，正在处理的东西直接在手里 寄存器数量很少（几十到几百个），但速度是内存的100倍"},{"id":"t0179","term":"程序计数器（PC）","en":null,"chapter":"ch4","section":null,"plain":"存下一条要执行的指令在内存的地址","analogy":"就像书签，告诉CPU下次该读哪一页","tip":"CPU执行完一条指令，PC自动加1指向下一条；跳转指令会改PC的值","level":2,"tags":[],"py":"chen","pyFull":"chengxujishuqi","searchText":"程序计数器（pc）  存下一条要执行的指令在内存的地址 就像书签，告诉cpu下次该读哪一页 cpu执行完一条指令，pc自动加1指向下一条；跳转指令会改pc的值"},{"id":"t0180","term":"指令周期","en":null,"chapter":"ch4","section":null,"plain":"CPU执行一条指令的基本步骤：取指→译码→执行→写回","analogy":"就像做菜，拿菜谱→看这步做什么→动手做→装盘","tip":"每条指令都走这四步，现代CPU用流水线让多条指令重叠执行","level":2,"tags":[],"py":"zhil","pyFull":"zhilingzhouqi","searchText":"指令周期  cpu执行一条指令的基本步骤：取指→译码→执行→写回 就像做菜，拿菜谱→看这步做什么→动手做→装盘 每条指令都走这四步，现代cpu用流水线让多条指令重叠执行"},{"id":"t0181","term":"流水线","en":null,"chapter":"ch4","section":null,"plain":"多条指令重叠执行，像工厂流水线提高效率","analogy":"就像洗车，第一辆车在冲水时，第二辆已经在打泡沫，第三辆在擦干","tip":"理想情况下流水线能让吞吐量翻几倍，但遇到分支跳转（if-else）会「断流」","level":2,"tags":[],"py":"lius","pyFull":"liushuixian","searchText":"流水线  多条指令重叠执行，像工厂流水线提高效率 就像洗车，第一辆车在冲水时，第二辆已经在打泡沫，第三辆在擦干 理想情况下流水线能让吞吐量翻几倍，但遇到分支跳转（if-else）会「断流」"},{"id":"t0182","term":"超标量","en":null,"chapter":"ch4","section":null,"plain":"一个时钟周期能同时发射多条指令到不同执行单元","analogy":"就像多核厨师，一个厨师炒一个菜，四个厨师同时炒四个菜","tip":"现代CPU都是超标量架构，一个周期能执行4-8条指令","level":2,"tags":[],"py":"chao","pyFull":"chaobiaoliang","searchText":"超标量  一个时钟周期能同时发射多条指令到不同执行单元 就像多核厨师，一个厨师炒一个菜，四个厨师同时炒四个菜 现代cpu都是超标量架构，一个周期能执行4-8条指令"},{"id":"t0183","term":"多核","en":null,"chapter":"ch4","section":null,"plain":"一个CPU芯片里封装多个处理器核心，真正并行执行","analogy":"就像一个厨房里有好几个厨师，各炒各的菜","tip":"多核≠多线程，但写多线程程序才能利用多核；2026年主流CPU是8-16核","level":2,"tags":[],"py":"duoh","pyFull":"duohe","searchText":"多核  一个cpu芯片里封装多个处理器核心，真正并行执行 就像一个厨房里有好几个厨师，各炒各的菜 多核≠多线程，但写多线程程序才能利用多核；2026年主流cpu是8-16核"},{"id":"t0184","term":"多线程","en":null,"chapter":"ch4","section":null,"plain":"同时执行多个线程，充分利用CPU等待时间","analogy":"就像厨师等水开的时候切菜，不等着，穿插干别的","tip":"多线程在单核上是「交替执行」（并发），多核上才是「真正同时」（并行）","level":2,"tags":[],"py":"duox","pyFull":"duoxiancheng","searchText":"多线程  同时执行多个线程，充分利用cpu等待时间 就像厨师等水开的时候切菜，不等着，穿插干别的 多线程在单核上是「交替执行」（并发），多核上才是「真正同时」（并行）"},{"id":"t0185","term":"中断","en":null,"chapter":"ch4","section":null,"plain":"外部事件打断CPU当前工作，让它先去处理更紧急的事","analogy":"就像做饭时电话响了，关火接电话，接完回来继续做","tip":"键盘输入、网络数据到达、定时器到点都是中断，操作系统靠中断驱动","level":2,"tags":[],"py":"zhon","pyFull":"zhongduan","searchText":"中断  外部事件打断cpu当前工作，让它先去处理更紧急的事 就像做饭时电话响了，关火接电话，接完回来继续做 键盘输入、网络数据到达、定时器到点都是中断，操作系统靠中断驱动"},{"id":"t0186","term":"总线","en":null,"chapter":"ch4","section":null,"plain":"CPU、内存、外设之间传输数据的公共通道","analogy":"就像高速公路，所有车（数据）都走这条路，有带宽限制","tip":"总线带宽是系统瓶颈之一，数据传输量超过总线能力就堵车","level":2,"tags":[],"py":"zong","pyFull":"zongxian","searchText":"总线  cpu、内存、外设之间传输数据的公共通道 就像高速公路，所有车（数据）都走这条路，有带宽限制 总线带宽是系统瓶颈之一，数据传输量超过总线能力就堵车"},{"id":"t0187","term":"摩尔定律","en":null,"chapter":"ch4","section":null,"plain":"集成电路上晶体管数量每18-24个月翻一倍，性能翻倍价格不变","analogy":"就像同样的钱每年能买的面包多一倍，性价比持续提升","tip":"摩尔定律从1965年提出持续了50年，2015年后逐渐放缓，现在靠多核/3D封装/专用芯片延续","level":2,"tags":[],"py":"moer","pyFull":"moerdingl","searchText":"摩尔定律  集成电路上晶体管数量每18-24个月翻一倍，性能翻倍价格不变 就像同样的钱每年能买的面包多一倍，性价比持续提升 摩尔定律从1965年提出持续了50年，2015年后逐渐放缓，现在靠多核/3d封装/专用芯片延续"},{"id":"t0188","term":"缓存命中（Cache Hit）","en":null,"chapter":"ch4","section":null,"plain":"要找的数据恰好在缓存里，直接拿到，极快","analogy":"就像要的调料正好在灶台边，伸手就拿到","tip":"缓存命中率>95%时性能好；写代码时顺序访问内存、数据紧凑能提高命中率","level":2,"tags":[],"py":"huan","pyFull":"huancunmingzhong","searchText":"缓存命中（cache hit）  要找的数据恰好在缓存里，直接拿到，极快 就像要的调料正好在灶台边，伸手就拿到 缓存命中率>95%时性能好；写代码时顺序访问内存、数据紧凑能提高命中率"},{"id":"t0189","term":"缓存失效（Cache Miss）","en":null,"chapter":"ch4","section":null,"plain":"缓存里没有要的数据，得去内存拿，很慢（比缓存慢100倍）","analogy":"就像调料用完了，得跑去仓库拿，一等就是半天","tip":"三种Cache Miss：强制失效（第一次访问）、容量失效（缓存太小）、冲突失效（映射到同一位置）","level":2,"tags":[],"py":"huan","pyFull":"huancunshixiao","searchText":"缓存失效（cache miss）  缓存里没有要的数据，得去内存拿，很慢（比缓存慢100倍） 就像调料用完了，得跑去仓库拿，一等就是半天 三种cache miss：强制失效（第一次访问）、容量失效（缓存太小）、冲突失效（映射到同一位置）"},{"id":"t0190","term":"局部性原理","en":null,"chapter":"ch4","section":null,"plain":"程序倾向于访问最近用过的数据（时间局部性）和附近的数据（空间局部性）","analogy":"就像做菜，刚用过的盐等会儿还会用（时间），拿了盐就顺便拿旁边的酱油（空间）","tip":"这是缓存之所以有效的理论基础。写代码时利用好局部性原理能大幅提升性能","level":2,"tags":[],"py":"jubu","pyFull":"jubuxingyuanli","searchText":"局部性原理  程序倾向于访问最近用过的数据（时间局部性）和附近的数据（空间局部性） 就像做菜，刚用过的盐等会儿还会用（时间），拿了盐就顺便拿旁边的酱油（空间） 这是缓存之所以有效的理论基础。写代码时利用好局部性原理能大幅提升性能"},{"id":"t0191","term":"浮点数","en":null,"chapter":"ch4","section":null,"plain":"带小数点的数，用科学计数法存储（符号位+指数+尾数），有精度问题","analogy":"就像用有限位数的小数表示⅓，永远写不完，只能近似","tip":"0.1+0.2≠0.3！这是浮点数精度问题，比较浮点数要用差值小于epsilon","level":2,"tags":[],"py":"fudi","pyFull":"fudianshu","searchText":"浮点数  带小数点的数，用科学计数法存储（符号位+指数+尾数），有精度问题 就像用有限位数的小数表示⅓，永远写不完，只能近似 0.1+0.2≠0.3！这是浮点数精度问题，比较浮点数要用差值小于epsilon"},{"id":"t0192","term":"补码","en":null,"chapter":"ch4","section":null,"plain":"有符号整数的二进制表示方式，让减法可以用加法电路完成","analogy":"就像钟表，3点往前拨4小时等于3-4=-1≡11点（mod 12）","tip":"补码是计算机最巧妙的设计之一，不用为减法单独造电路","level":2,"tags":[],"py":"buma","pyFull":"buma","searchText":"补码  有符号整数的二进制表示方式，让减法可以用加法电路完成 就像钟表，3点往前拨4小时等于3-4=-1≡11点（mod 12） 补码是计算机最巧妙的设计之一，不用为减法单独造电路"},{"id":"t0193","term":"位运算","en":null,"chapter":"ch4","section":null,"plain":"直接操作二进制位：与(&)、或(","analogy":")、非(~)、异或(^)、左移(\u003c\u003c)、右移(>>)","tip":"就像开关操作，每个位是一个灯，独立控制","level":2,"tags":[],"py":"weiy","pyFull":"weiyunsuan","searchText":"位运算  直接操作二进制位：与(&)、或( )、非(~)、异或(^)、左移(\u003c\u003c)、右移(>>) 就像开关操作，每个位是一个灯，独立控制"},{"id":"t0194","term":"字节序（Endianness）","en":null,"chapter":"ch4","section":null,"plain":"多字节数据在内存中是高字节在前（大端）还是低字节在前（小端）","analogy":"就像日期写法，2026-08-09是大端（大单位在前），09/08/2026是小端","tip":"x86是小端，网络传输用大端（网络字节序），跨平台要注意转换","level":2,"tags":[],"py":"ziji","pyFull":"zijiexu","searchText":"字节序（endianness）  多字节数据在内存中是高字节在前（大端）还是低字节在前（小端） 就像日期写法，2026-08-09是大端（大单位在前），09/08/2026是小端 x86是小端，网络传输用大端（网络字节序），跨平台要注意转换"},{"id":"t0195","term":"DMA","en":null,"chapter":"ch4","section":null,"plain":"直接内存访问，外设直接和内存传输数据，不经过CPU","analogy":"就像快递直接送到家，不用主人（CPU）每次去邮局取","tip":"硬盘读写、网卡收发数据都用DMA，CPU只在开始和结束时介入，中间干别的","level":2,"tags":[],"py":"dma","pyFull":"dma","searchText":"dma  直接内存访问，外设直接和内存传输数据，不经过cpu 就像快递直接送到家，不用主人（cpu）每次去邮局取 硬盘读写、网卡收发数据都用dma，cpu只在开始和结束时介入，中间干别的"},{"id":"t0196","term":"操作系统（OS）","en":null,"chapter":"ch5","section":null,"plain":"管理硬件和软件资源的大管家，所有程序都在它上面跑","analogy":"就像大学校长，管教室（内存）、宿舍（硬盘）、食堂（CPU时间）分配，老师学生（程序）要资源都找它","tip":"三大主流：Windows（个人电脑）、Linux（服务器/程序员最爱）、macOS（苹果电脑）。学操作系统推荐从Linux入手","level":2,"tags":[],"py":"caoz","pyFull":"caozuoxitong","searchText":"操作系统（os）  管理硬件和软件资源的大管家，所有程序都在它上面跑 就像大学校长，管教室（内存）、宿舍（硬盘）、食堂（cpu时间）分配，老师学生（程序）要资源都找它 三大主流：windows（个人电脑）、linux（服务器/程序员最爱）、macos（苹果电脑）。学操作系统推荐从linux入手"},{"id":"t0197","term":"内核（Kernel）","en":null,"chapter":"ch5","section":null,"plain":"操作系统最核心的部分，直接管理硬件，其他程序通过内核间接操作硬件","analogy":"就像校长本人，最核心的管理者，直接拍板资源分配","tip":"Linux内核是开源的，可以读源码学习（推荐《Linux内核设计与实现》入门）","level":2,"tags":[],"py":"neih","pyFull":"neihe","searchText":"内核（kernel）  操作系统最核心的部分，直接管理硬件，其他程序通过内核间接操作硬件 就像校长本人，最核心的管理者，直接拍板资源分配 linux内核是开源的，可以读源码学习（推荐《linux内核设计与实现》入门）"},{"id":"t0198","term":"进程（Process）","en":null,"chapter":"ch5","section":null,"plain":"运行中的程序，拥有独立的内存空间，是资源分配的基本单位","analogy":"就像一个独立的店铺，有自己的门面（内存）、员工（线程）、原料（数据），和别的店铺互不干扰","tip":"一个程序可以开多个进程（Chrome每个标签页就是一个进程，一个崩了不影响其他）","level":2,"tags":[],"py":"jinc","pyFull":"jincheng","searchText":"进程（process）  运行中的程序，拥有独立的内存空间，是资源分配的基本单位 就像一个独立的店铺，有自己的门面（内存）、员工（线程）、原料（数据），和别的店铺互不干扰 一个程序可以开多个进程（chrome每个标签页就是一个进程，一个崩了不影响其他）"},{"id":"t0199","term":"线程（Thread）","en":null,"chapter":"ch5","section":null,"plain":"进程内的执行单元，同一个进程的线程共享内存空间，是CPU调度的基本单位","analogy":"就像店铺里的员工，共享店铺的一切（内存），但各自干各自的活","tip":"多线程共享数据需要加锁，否则会出竞态条件。线程比进程轻量，创建/切换开销小","level":2,"tags":[],"py":"xian","pyFull":"xiancheng","searchText":"线程（thread）  进程内的执行单元，同一个进程的线程共享内存空间，是cpu调度的基本单位 就像店铺里的员工，共享店铺的一切（内存），但各自干各自的活 多线程共享数据需要加锁，否则会出竞态条件。线程比进程轻量，创建/切换开销小"},{"id":"t0200","term":"协程（Coroutine）","en":null,"chapter":"ch5","section":null,"plain":"用户态的轻量级「线程」，由程序员自己调度不是操作系统调度，切换极快","analogy":"就像一个人同时做几道菜，炒两下A菜，趁它炖着去切B菜，自己安排时间","tip":"Go的goroutine、Python的asyncio、Kotlin的协程都很流行，高并发场景比线程高效","level":2,"tags":[],"py":"xiec","pyFull":"xiecheng","searchText":"协程（coroutine）  用户态的轻量级「线程」，由程序员自己调度不是操作系统调度，切换极快 就像一个人同时做几道菜，炒两下a菜，趁它炖着去切b菜，自己安排时间 go的goroutine、python的asyncio、kotlin的协程都很流行，高并发场景比线程高效"},{"id":"t0201","term":"并发（Concurrency）","en":null,"chapter":"ch5","section":null,"plain":"多个任务交替执行，看起来像同时跑，单核也能并发","analogy":"就像一个人同时聊几个微信，回完A回B，切换很快，看起来同时在聊","tip":"并发解决的是「多任务调度」问题，不要求真的同一时刻执行","level":2,"tags":[],"py":"bing","pyFull":"bingfa","searchText":"并发（concurrency）  多个任务交替执行，看起来像同时跑，单核也能并发 就像一个人同时聊几个微信，回完a回b，切换很快，看起来同时在聊 并发解决的是「多任务调度」问题，不要求真的同一时刻执行"},{"id":"t0202","term":"并行（Parallelism）","en":null,"chapter":"ch5","section":null,"plain":"多个任务真正同时跑，需要多核CPU","analogy":"就像多个人各聊各的微信，真正同时进行","tip":"并行必须多核，但并发单核就能做。Go语言的口号「不要通过共享内存通信，要通过通信共享内存」","level":2,"tags":[],"py":"bing","pyFull":"bingxing","searchText":"并行（parallelism）  多个任务真正同时跑，需要多核cpu 就像多个人各聊各的微信，真正同时进行 并行必须多核，但并发单核就能做。go语言的口号「不要通过共享内存通信，要通过通信共享内存」"},{"id":"t0203","term":"死锁（Deadlock）","en":null,"chapter":"ch5","section":null,"plain":"两个或多个进程互相等待对方释放资源，谁都走不了","analogy":"就像两个人狭路相逢，A等B让路，B等A让路，谁都不让，卡死了","tip":"死锁四个必要条件：互斥、占有且等待、不可抢占、循环等待。破坏任一条件就能避免","level":2,"tags":[],"py":"sisu","pyFull":"sisuo","searchText":"死锁（deadlock）  两个或多个进程互相等待对方释放资源，谁都走不了 就像两个人狭路相逢，a等b让路，b等a让路，谁都不让，卡死了 死锁四个必要条件：互斥、占有且等待、不可抢占、循环等待。破坏任一条件就能避免"},{"id":"t0204","term":"竞态条件（Race Condition）","en":null,"chapter":"ch5","section":null,"plain":"多个线程同时访问/修改共享数据，结果取决于执行顺序，不可预期","analogy":"就像两个人同时抢最后一张票，谁先抢到算谁的，结果不确定","tip":"这是多线程Bug中最难调试的一类，因为不一定能复现。解决方案：加锁、原子操作","level":2,"tags":[],"py":"jing","pyFull":"jingtaitiaojian","searchText":"竞态条件（race condition）  多个线程同时访问/修改共享数据，结果取决于执行顺序，不可预期 就像两个人同时抢最后一张票，谁先抢到算谁的，结果不确定 这是多线程bug中最难调试的一类，因为不一定能复现。解决方案：加锁、原子操作"},{"id":"t0205","term":"互斥锁（Mutex）","en":null,"chapter":"ch5","section":null,"plain":"保证同一时间只有一个线程能访问共享资源，其他线程等着","analogy":"就像厕所的门锁，一个人进去锁门，其他人只能在外面等","tip":"加锁范围要尽量小（锁粒度），锁大了影响性能，锁小了可能漏保护","level":2,"tags":[],"py":"huch","pyFull":"huchisuo","searchText":"互斥锁（mutex）  保证同一时间只有一个线程能访问共享资源，其他线程等着 就像厕所的门锁，一个人进去锁门，其他人只能在外面等 加锁范围要尽量小（锁粒度），锁大了影响性能，锁小了可能漏保护"},{"id":"t0206","term":"信号量（Semaphore）","en":null,"chapter":"ch5","section":null,"plain":"控制同时访问某个资源的线程数量，可以是1（等同互斥锁）或N（限流）","analogy":"就像停车场车位显示牌，显示还有N个车位，满了就不让进了","tip":"信号量=N个车位的停车场，互斥锁=1个车位的停车场","level":2,"tags":[],"py":"xinh","pyFull":"xinhaoliang","searchText":"信号量（semaphore）  控制同时访问某个资源的线程数量，可以是1（等同互斥锁）或n（限流） 就像停车场车位显示牌，显示还有n个车位，满了就不让进了 信号量=n个车位的停车场，互斥锁=1个车位的停车场"},{"id":"t0207","term":"临界区","en":null,"chapter":"ch5","section":null,"plain":"访问共享资源的那段代码，必须加锁保护，防止多个线程同时进入","analogy":"就像ATM机取钱的隔间，一次只能一个人进","tip":"临界区要尽量短，不要在里面做耗时操作（比如网络请求）","level":2,"tags":[],"py":"linj","pyFull":"linjiequ","searchText":"临界区  访问共享资源的那段代码，必须加锁保护，防止多个线程同时进入 就像atm机取钱的隔间，一次只能一个人进 临界区要尽量短，不要在里面做耗时操作（比如网络请求）"},{"id":"t0208","term":"上下文切换（Context Switch）","en":null,"chapter":"ch5","section":null,"plain":"CPU从一个进程/线程切换到另一个，要保存当前状态、恢复另一个的状态","analogy":"就像看书时被打断，先记住看到哪页了（保存上下文），处理完事情再翻回那页继续","tip":"上下文切换有开销（几千个CPU周期），线程太多时切换开销会很大","level":2,"tags":[],"py":"shan","pyFull":"shangxiawenqiehuan","searchText":"上下文切换（context switch）  cpu从一个进程/线程切换到另一个，要保存当前状态、恢复另一个的状态 就像看书时被打断，先记住看到哪页了（保存上下文），处理完事情再翻回那页继续 上下文切换有开销（几千个cpu周期），线程太多时切换开销会很大"},{"id":"t0209","term":"调度算法","en":null,"chapter":"ch5","section":null,"plain":"决定哪个进程/线程先用CPU、用多久","analogy":"就像餐厅叫号，不同算法决定先叫谁、每个客人吃多久","tip":"常见算法：先来先服务、短作业优先、时间片轮转、优先级调度、多级反馈队列（Linux实际用的）","level":2,"tags":[],"py":"diao","pyFull":"diaodusuanfa","searchText":"调度算法  决定哪个进程/线程先用cpu、用多久 就像餐厅叫号，不同算法决定先叫谁、每个客人吃多久 常见算法：先来先服务、短作业优先、时间片轮转、优先级调度、多级反馈队列（linux实际用的）"},{"id":"t0210","term":"虚拟内存","en":null,"chapter":"ch5","section":null,"plain":"让每个进程以为自己独占整个内存空间，实际是物理内存+磁盘的组合","analogy":"就像图书馆给每个读者一个大阅览桌，看起来桌子是自己的，放不下的书暂时放仓库","tip":"虚拟内存让每个进程有独立地址空间，互相不干扰，还能使用比实际物理内存更大的空间","level":2,"tags":[],"py":"xuni","pyFull":"xunineicun","searchText":"虚拟内存  让每个进程以为自己独占整个内存空间，实际是物理内存+磁盘的组合 就像图书馆给每个读者一个大阅览桌，看起来桌子是自己的，放不下的书暂时放仓库 虚拟内存让每个进程有独立地址空间，互相不干扰，还能使用比实际物理内存更大的空间"},{"id":"t0211","term":"页面置换","en":null,"chapter":"ch5","section":null,"plain":"内存不够用时，把不常用的页换到磁盘上，腾出空间给需要的页","analogy":"就像书桌满了，把暂时不用的书放回书架，腾出位置放新书","tip":"经典算法：FIFO（先进先出）、LRU（最近最少使用，最常用）、Clock（时钟算法）","level":2,"tags":[],"py":"yemi","pyFull":"yemianzhihuan","searchText":"页面置换  内存不够用时，把不常用的页换到磁盘上，腾出空间给需要的页 就像书桌满了，把暂时不用的书放回书架，腾出位置放新书 经典算法：fifo（先进先出）、lru（最近最少使用，最常用）、clock（时钟算法）"},{"id":"t0212","term":"缺页中断（Page Fault）","en":null,"chapter":"ch5","section":null,"plain":"要访问的内存页不在物理内存里（被换出去了或没加载），要从磁盘加载","analogy":"就像要看的书不在书桌上，要去书架上找，慢很多","tip":"磁盘比内存慢10万倍，缺页中断频繁时性能极差（「抖动」现象）","level":2,"tags":[],"py":"quey","pyFull":"queyezhongduan","searchText":"缺页中断（page fault）  要访问的内存页不在物理内存里（被换出去了或没加载），要从磁盘加载 就像要看的书不在书桌上，要去书架上找，慢很多 磁盘比内存慢10万倍，缺页中断频繁时性能极差（「抖动」现象）"},{"id":"t0213","term":"文件系统","en":null,"chapter":"ch5","section":null,"plain":"操作系统管理磁盘上文件的方式，决定文件怎么存、怎么找","analogy":"就像图书馆的分类编目系统，决定书放在哪个架子哪个位置","tip":"常见文件系统：Windows用NTFS，Linux用EXT4/XFS，macOS用APFS，U盘用FAT32/exFAT","level":2,"tags":[],"py":"wenj","pyFull":"wenjianxitong","searchText":"文件系统  操作系统管理磁盘上文件的方式，决定文件怎么存、怎么找 就像图书馆的分类编目系统，决定书放在哪个架子哪个位置 常见文件系统：windows用ntfs，linux用ext4/xfs，macos用apfs，u盘用fat32/exfat"},{"id":"t0214","term":"系统调用（Syscall）","en":null,"chapter":"ch5","section":null,"plain":"用户程序请求操作系统服务的接口，是用户态进入内核态的唯一方式","analogy":"就像学生找校长办事，不能直接闯进办公室，要走正规流程（申请）","tip":"常见系统调用：read/write（读写文件）、fork（创建进程）、open/close、mmap等","level":2,"tags":[],"py":"xito","pyFull":"xitongdiaoyong","searchText":"系统调用（syscall）  用户程序请求操作系统服务的接口，是用户态进入内核态的唯一方式 就像学生找校长办事，不能直接闯进办公室，要走正规流程（申请） 常见系统调用：read/write（读写文件）、fork（创建进程）、open/close、mmap等"},{"id":"t0215","term":"用户态/内核态","en":null,"chapter":"ch5","section":null,"plain":"CPU的两种运行模式：用户态权限小不能直接操作硬件，内核态权限大能操作一切","analogy":"就像学生和校长，学生（用户态）不能自己开教室门，要找后勤（内核态）开门","tip":"系统调用、中断、异常会从用户态切换到内核态，切换有开销","level":2,"tags":[],"py":"yong","pyFull":"yonghutaineihetai","searchText":"用户态/内核态  cpu的两种运行模式：用户态权限小不能直接操作硬件，内核态权限大能操作一切 就像学生和校长，学生（用户态）不能自己开教室门，要找后勤（内核态）开门 系统调用、中断、异常会从用户态切换到内核态，切换有开销"},{"id":"t0216","term":"守护进程（Daemon）","en":null,"chapter":"ch5","section":null,"plain":"后台运行的服务进程，不跟终端交互，开机自启","analogy":"就像物业，平时看不到它存在，但水电燃气它都管着","tip":"Linux名字以d结尾的通常是守护进程：sshd（远程登录）、mysqld（数据库）、httpd（Web服务）","level":2,"tags":[],"py":"shou","pyFull":"shouhujincheng","searchText":"守护进程（daemon）  后台运行的服务进程，不跟终端交互，开机自启 就像物业，平时看不到它存在，但水电燃气它都管着 linux名字以d结尾的通常是守护进程：sshd（远程登录）、mysqld（数据库）、httpd（web服务）"},{"id":"t0217","term":"Shell","en":null,"chapter":"ch5","section":null,"plain":"命令行解释器，你敲命令它帮你调用操作系统执行","analogy":"就像翻译官，你说人话（命令），它翻译成操作系统能懂的话","tip":"常见Shell：bash（默认）、zsh（更好用）、fish（智能提示）。学会Shell命令是Linux基本功","level":2,"tags":[],"py":"shel","pyFull":"shell","searchText":"shell  命令行解释器，你敲命令它帮你调用操作系统执行 就像翻译官，你说人话（命令），它翻译成操作系统能懂的话 常见shell：bash（默认）、zsh（更好用）、fish（智能提示）。学会shell命令是linux基本功"},{"id":"t0218","term":"管道（Pipe）","en":null,"chapter":"ch5","section":null,"plain":"把一个命令的输出作为另一个命令的输入，串联多个命令","analogy":"就像流水线，上一个工序的产品直接传给下一个工序","tip":"Linux哲学：小工具组合完成复杂任务。例：`cat log.txt","level":2,"tags":[],"py":"guan","pyFull":"guandao","searchText":"管道（pipe）  把一个命令的输出作为另一个命令的输入，串联多个命令 就像流水线，上一个工序的产品直接传给下一个工序 linux哲学：小工具组合完成复杂任务。例：`cat log.txt"},{"id":"t0219","term":"环境变量","en":null,"chapter":"ch5","section":null,"plain":"操作系统级别的全局变量，所有程序都能读取","analogy":"就像小区公告栏，所有住户（程序）都能看到公告内容","tip":"最常用的是PATH（命令搜索路径），设置环境变量能让你在任何目录运行某个程序","level":2,"tags":[],"py":"huan","pyFull":"huanjingbianliang","searchText":"环境变量  操作系统级别的全局变量，所有程序都能读取 就像小区公告栏，所有住户（程序）都能看到公告内容 最常用的是path（命令搜索路径），设置环境变量能让你在任何目录运行某个程序"},{"id":"t0220","term":"权限（Permission）","en":null,"chapter":"ch5","section":null,"plain":"文件/目录的访问控制：谁能读（r）、谁能写（w）、谁能执行（x）","analogy":"就像文件密级，谁能看、谁能改、谁能执行都有规定","tip":"Linux用三组rwx表示：文件所有者、所属组、其他人。例：chmod 755 file 表示rwxr-xr-x","level":2,"tags":[],"py":"quan","pyFull":"quanxian","searchText":"权限（permission）  文件/目录的访问控制：谁能读（r）、谁能写（w）、谁能执行（x） 就像文件密级，谁能看、谁能改、谁能执行都有规定 linux用三组rwx表示：文件所有者、所属组、其他人。例：chmod 755 file 表示rwxr-xr-x"},{"id":"t0221","term":"软链接/硬链接","en":null,"chapter":"ch5","section":null,"plain":"软链接=快捷方式（指向路径，删原文件就失效）；硬链接=同一个文件的另一个名字（指向磁盘数据，删一个另一个还在）","analogy":"软链接像书签指向某页（书被烧了书签没用）；硬链接像一个人两个名字（不管叫哪个都是同一个人）","tip":"ln -s 创建软链接，ln 创建硬链接。软链接可以跨文件系统，硬链接不行","level":2,"tags":[],"py":"ruan","pyFull":"ruanlianjieyinglianjie","searchText":"软链接/硬链接  软链接=快捷方式（指向路径，删原文件就失效）；硬链接=同一个文件的另一个名字（指向磁盘数据，删一个另一个还在） 软链接像书签指向某页（书被烧了书签没用）；硬链接像一个人两个名字（不管叫哪个都是同一个人） ln -s 创建软链接，ln 创建硬链接。软链接可以跨文件系统，硬链接不行"},{"id":"t0222","term":"I/O","en":null,"chapter":"ch5","section":null,"plain":"输入/输出，包括磁盘读写、网络收发、键盘输入、屏幕输出等","analogy":"就像收发快递，数据在你的程序和外部设备之间来回","tip":"I/O通常是性能瓶颈，因为磁盘/网络比CPU慢很多。高性能系统都要优化I/O","level":2,"tags":[],"py":"io","pyFull":"io","searchText":"i/o  输入/输出，包括磁盘读写、网络收发、键盘输入、屏幕输出等 就像收发快递，数据在你的程序和外部设备之间来回 i/o通常是性能瓶颈，因为磁盘/网络比cpu慢很多。高性能系统都要优化i/o"},{"id":"t0223","term":"同步I/O","en":null,"chapter":"ch5","section":null,"plain":"发起I/O请求后一直等着结果回来，期间什么都不干","analogy":"就像点外卖后一直站在门口等，什么都不干直到外卖到","tip":"编程简单但效率低，等待期间CPU闲着","level":2,"tags":[],"py":"tong","pyFull":"tongbuio","searchText":"同步i/o  发起i/o请求后一直等着结果回来，期间什么都不干 就像点外卖后一直站在门口等，什么都不干直到外卖到 编程简单但效率低，等待期间cpu闲着"},{"id":"t0224","term":"异步I/O","en":null,"chapter":"ch5","section":null,"plain":"发起I/O请求后不等，继续干别的事，I/O完成后通知你","analogy":"就像点外卖后继续看电视，外卖到了门铃响了再去拿","tip":"编程复杂但效率高，高性能服务器都用异步I/O（如Nginx、Node.js）","level":2,"tags":[],"py":"yibu","pyFull":"yibuio","searchText":"异步i/o  发起i/o请求后不等，继续干别的事，i/o完成后通知你 就像点外卖后继续看电视，外卖到了门铃响了再去拿 编程复杂但效率高，高性能服务器都用异步i/o（如nginx、node.js）"},{"id":"t0225","term":"阻塞/非阻塞","en":null,"chapter":"ch5","section":null,"plain":"调用函数时会不会卡住等结果。阻塞=卡住直到结果来；非阻塞=立刻返回（可能没结果）","analogy":"阻塞=打电话没人接一直等着；非阻塞=打一下没人接就挂，过会儿再打","tip":"阻塞/非阻塞是调用方式，同步/异步是通知机制，可以组合出四种I/O模型","level":2,"tags":[],"py":"zuse","pyFull":"zusefeizuse","searchText":"阻塞/非阻塞  调用函数时会不会卡住等结果。阻塞=卡住直到结果来；非阻塞=立刻返回（可能没结果） 阻塞=打电话没人接一直等着；非阻塞=打一下没人接就挂，过会儿再打 阻塞/非阻塞是调用方式，同步/异步是通知机制，可以组合出四种i/o模型"},{"id":"t0226","term":"I/O多路复用","en":null,"chapter":"ch5","section":null,"plain":"一个线程同时监控多个I/O事件，哪个就绪了处理哪个","analogy":"就像一个服务员同时照看多张桌子，哪桌叫服务员就去哪桌","tip":"select/poll/epoll是三种实现，epoll性能最好（Nginx/Redis都用epoll）","level":2,"tags":[],"py":"iodu","pyFull":"ioduolufuyong","searchText":"i/o多路复用  一个线程同时监控多个i/o事件，哪个就绪了处理哪个 就像一个服务员同时照看多张桌子，哪桌叫服务员就去哪桌 select/poll/epoll是三种实现，epoll性能最好（nginx/redis都用epoll）"},{"id":"t0227","term":"零拷贝（Zero-Copy）","en":null,"chapter":"ch5","section":null,"plain":"数据直接从磁盘/网络设备传输到目标，不经过用户态内存拷贝","analogy":"就像快递直达，不用先送到快递站再转一道，直接送到收件人手里","tip":"Kafka、Nginx、RocketMQ都用零拷贝技术提升性能，减少CPU拷贝和上下文切换","level":2,"tags":[],"py":"ling","pyFull":"lingkaobei","searchText":"零拷贝（zero-copy）  数据直接从磁盘/网络设备传输到目标，不经过用户态内存拷贝 就像快递直达，不用先送到快递站再转一道，直接送到收件人手里 kafka、nginx、rocketmq都用零拷贝技术提升性能，减少cpu拷贝和上下文切换"},{"id":"t0228","term":"PV操作/信号量","en":null,"chapter":"ch5","section":null,"plain":"P（wait，等待）=申请资源减1，V（signal，释放）加1，用于进程同步互斥","analogy":"就像停车场入口计数：进一辆车车位减1，出车加1，满了就等","tip":"408考研必考大题。P/V操作配经典题目（生产者消费者、读者写者）必练","level":2,"tags":[],"py":"pvca","pyFull":"pvcaozuoxinhaoliang","searchText":"pv操作/信号量  p（wait，等待）=申请资源减1，v（signal，释放）加1，用于进程同步互斥 就像停车场入口计数：进一辆车车位减1，出车加1，满了就等 408考研必考大题。p/v操作配经典题目（生产者消费者、读者写者）必练"},{"id":"t0229","term":"管程（Monitor）","en":null,"chapter":"ch5","section":null,"plain":"把同步逻辑封装成语言结构的机制，同一时刻只允许一个线程进入","analogy":"就像图书馆单间自习室：一次只放一个读者进，出来才进下一个","tip":"面试常问「信号量 vs 管程」：管程更高级，把PV操作封装成wait/notify","level":2,"tags":[],"py":"guan","pyFull":"guancheng","searchText":"管程（monitor）  把同步逻辑封装成语言结构的机制，同一时刻只允许一个线程进入 就像图书馆单间自习室：一次只放一个读者进，出来才进下一个 面试常问「信号量 vs 管程」：管程更高级，把pv操作封装成wait/notify"},{"id":"t0230","term":"银行家算法","en":null,"chapter":"ch5","section":null,"plain":"死锁避免算法：分配资源前先模拟「借了还能还吗」，还不上就不借","analogy":"就像银行放贷前审查：借钱人声称的需求+已借的钱不能超过总资产","tip":"408计算大题经典。流程：判断当前是否安全→安全才分配","level":2,"tags":[],"py":"yinh","pyFull":"yinhangjiasuanfa","searchText":"银行家算法  死锁避免算法：分配资源前先模拟「借了还能还吗」，还不上就不借 就像银行放贷前审查：借钱人声称的需求+已借的钱不能超过总资产 408计算大题经典。流程：判断当前是否安全→安全才分配"},{"id":"t0231","term":"分页/分段/段页式","en":null,"chapter":"ch5","section":null,"plain":"内存管理三种方式：分页（固定大小切块）、分段（按逻辑切段）、段页组合","analogy":"分页像切成等大的豆腐块，分段像按菜系分柜子，段页是先分柜再切块","tip":"虚拟内存实现的核心。要能画出来并会算逻辑地址↔物理地址转换","level":2,"tags":[],"py":"feny","pyFull":"fenyefenduanduanyeshi","searchText":"分页/分段/段页式  内存管理三种方式：分页（固定大小切块）、分段（按逻辑切段）、段页组合 分页像切成等大的豆腐块，分段像按菜系分柜子，段页是先分柜再切块 虚拟内存实现的核心。要能画出来并会算逻辑地址↔物理地址转换"},{"id":"t0232","term":"工作集与抖动","en":null,"chapter":"ch5","section":null,"plain":"工作集=进程最近正在用的页集合；抖动=频繁换页导致系统瘫痪","analogy":"就像书桌太小，每次拿书都要去书架换，时间全耗在换书上","tip":"408考纲词。解决：给足内存、防过度多道程序。考研必背定义","level":2,"tags":[],"py":"gong","pyFull":"gongzuojiyudoudong","searchText":"工作集与抖动  工作集=进程最近正在用的页集合；抖动=频繁换页导致系统瘫痪 就像书桌太小，每次拿书都要去书架换，时间全耗在换书上 408考纲词。解决：给足内存、防过度多道程序。考研必背定义"},{"id":"t0233","term":"页面置换算法","en":null,"chapter":"ch5","section":null,"plain":"内存不够时决定踢哪页出去：OPT（最优）/FIFO（先进先出）/LRU（最近最少用）/CLOCK","analogy":"就像书架满了要放新书：OPT=扔以后最用不上的，LRU=扔最久没翻的","tip":"408计算题必考缺页次数。LRU面试最爱问，手写LRU是高频手撕题","level":2,"tags":[],"py":"yemi","pyFull":"yemianzhihuansuanfa","searchText":"页面置换算法  内存不够时决定踢哪页出去：opt（最优）/fifo（先进先出）/lru（最近最少用）/clock 就像书架满了要放新书：opt=扔以后最用不上的，lru=扔最久没翻的 408计算题必考缺页次数。lru面试最爱问，手写lru是高频手撕题"},{"id":"t0234","term":"磁盘调度算法","en":null,"chapter":"ch5","section":null,"plain":"磁头寻道顺序优化：先来先服务（FCFS）、最短寻道（SSTF）、电梯算法（SCAN）","analogy":"就像电梯停靠策略：顺路带人比乱停乱走省时间","tip":"408考纲词，计算平均寻道长度。SCAN「电梯算法」名字要记住","level":2,"tags":[],"py":"cipa","pyFull":"cipandiaodusuanfa","searchText":"磁盘调度算法  磁头寻道顺序优化：先来先服务（fcfs）、最短寻道（sstf）、电梯算法（scan） 就像电梯停靠策略：顺路带人比乱停乱走省时间 408考纲词，计算平均寻道长度。scan「电梯算法」名字要记住"},{"id":"t0235","term":"文件描述符（fd）","en":null,"chapter":"ch5","section":null,"plain":"打开的文件在进程里的编号（0/1/2是标准输入/输出/错误）","analogy":"就像食堂打饭的餐票号码，凭号取餐","tip":"写代码天天见。Linux下「一切皆文件」都要靠 fd 引用","level":2,"tags":[],"py":"wenj","pyFull":"wenjianmiaoshufu","searchText":"文件描述符（fd）  打开的文件在进程里的编号（0/1/2是标准输入/输出/错误） 就像食堂打饭的餐票号码，凭号取餐 写代码天天见。linux下「一切皆文件」都要靠 fd 引用"},{"id":"t0236","term":"僵尸进程/孤儿进程","en":null,"chapter":"ch5","section":null,"plain":"僵尸进程=子进程结束但父进程没收尸（占坑）；孤儿进程=父进程先死被1号进程收养","analogy":"僵尸像没注销的空户口，孤儿像被好心人收养的娃","tip":"面试经典题。父进程要 wait() 收尸，否则僵尸累积","level":2,"tags":[],"py":"jian","pyFull":"jiangshijinchengguerjincheng","searchText":"僵尸进程/孤儿进程  僵尸进程=子进程结束但父进程没收尸（占坑）；孤儿进程=父进程先死被1号进程收养 僵尸像没注销的空户口，孤儿像被好心人收养的娃 面试经典题。父进程要 wait() 收尸，否则僵尸累积"},{"id":"t0237","term":"inode","en":null,"chapter":"ch5","section":null,"plain":"存放文件元数据（大小/权限/块位置）的结构，文件名只是目录里的一个指针","analogy":"就像图书馆的藏书卡：卡片记录书的信息和书的位置","tip":"理解 inode 才能懂「硬链接」「为什么删文件有时报空间不足」","level":2,"tags":[],"py":"inod","pyFull":"inode","searchText":"inode  存放文件元数据（大小/权限/块位置）的结构，文件名只是目录里的一个指针 就像图书馆的藏书卡：卡片记录书的信息和书的位置 理解 inode 才能懂「硬链接」「为什么删文件有时报空间不足」"},{"id":"t0238","term":"OSI七层模型","en":null,"chapter":"ch6","section":null,"plain":"网络通信的理论分层：物理层→数据链路层→网络层→传输层→会话层→表示层→应用层","analogy":"就像寄快递，写内容（应用）→打包（表示）→建立对话（会话）→选快递（传输）→查路线（网络）→转站点（链路）→公路运输（物理）","tip":"实际用的是TCP/IP四层模型，OSI是教学用的理论模型。面试必背","level":2,"tags":[],"py":"osiq","pyFull":"osiqicengmoxing","searchText":"osi七层模型  网络通信的理论分层：物理层→数据链路层→网络层→传输层→会话层→表示层→应用层 就像寄快递，写内容（应用）→打包（表示）→建立对话（会话）→选快递（传输）→查路线（网络）→转站点（链路）→公路运输（物理） 实际用的是tcp/ip四层模型，osi是教学用的理论模型。面试必背"},{"id":"t0239","term":"TCP/IP四层模型","en":null,"chapter":"ch6","section":null,"plain":"实际互联网使用的分层：网络接口层→网际层→传输层→应用层","analogy":"简化版的寄快递流程，实际操作没那么多层","tip":"每层有自己的协议：IP在网际层，TCP/UDP在传输层，HTTP/DNS在应用层","level":2,"tags":[],"py":"tcpi","pyFull":"tcpipsicengmoxing","searchText":"tcp/ip四层模型  实际互联网使用的分层：网络接口层→网际层→传输层→应用层 简化版的寄快递流程，实际操作没那么多层 每层有自己的协议：ip在网际层，tcp/udp在传输层，http/dns在应用层"},{"id":"t0240","term":"IP地址","en":null,"chapter":"ch6","section":null,"plain":"互联网上设备的「门牌号」，用来定位设备。IPv4是32位（如192.168.1.1），IPv6是128位","analogy":"就像家庭住址，告诉快递员送到哪里","tip":"IPv4只有约43亿个地址，已经不够用了，所以要NAT和IPv6。公网IP全球唯一，内网IP可以重复","level":2,"tags":[],"py":"ipdi","pyFull":"ipdizhi","searchText":"ip地址  互联网上设备的「门牌号」，用来定位设备。ipv4是32位（如192.168.1.1），ipv6是128位 就像家庭住址，告诉快递员送到哪里 ipv4只有约43亿个地址，已经不够用了，所以要nat和ipv6。公网ip全球唯一，内网ip可以重复"},{"id":"t0241","term":"端口（Port）","en":null,"chapter":"ch6","section":null,"plain":"一台机器上区分不同应用程序的编号，0-65535","analogy":"就像小区楼里的门牌号，IP是小区地址，端口是具体哪户人家","tip":"常见默认端口：HTTP=80，HTTPS=443，SSH=22，MySQL=3306，Redis=6379","level":2,"tags":[],"py":"duan","pyFull":"duankou","searchText":"端口（port）  一台机器上区分不同应用程序的编号，0-65535 就像小区楼里的门牌号，ip是小区地址，端口是具体哪户人家 常见默认端口：http=80，https=443，ssh=22，mysql=3306，redis=6379"},{"id":"t0242","term":"TCP","en":null,"chapter":"ch6","section":null,"plain":"传输控制协议：可靠、面向连接、有序，保证数据不丢不乱","analogy":"就像打电话，先接通（建立连接），说的话对方一定按顺序听到，挂了要说再见","tip":"TCP保证可靠靠：三次握手、四次挥手、序号确认、超时重传、流量控制、拥塞控制","level":2,"tags":[],"py":"tcp","pyFull":"tcp","searchText":"tcp  传输控制协议：可靠、面向连接、有序，保证数据不丢不乱 就像打电话，先接通（建立连接），说的话对方一定按顺序听到，挂了要说再见 tcp保证可靠靠：三次握手、四次挥手、序号确认、超时重传、流量控制、拥塞控制"},{"id":"t0243","term":"UDP","en":null,"chapter":"ch6","section":null,"plain":"用户数据报协议：不可靠、无连接、快，不保证到达不保证顺序","analogy":"就像发短信/寄平信，发出去就不管了，到不到、顺序对不对不保证，但快","tip":"UDP用于直播、游戏、DNS查询、视频通话这些「快比可靠重要」的场景","level":2,"tags":[],"py":"udp","pyFull":"udp","searchText":"udp  用户数据报协议：不可靠、无连接、快，不保证到达不保证顺序 就像发短信/寄平信，发出去就不管了，到不到、顺序对不对不保证，但快 udp用于直播、游戏、dns查询、视频通话这些「快比可靠重要」的场景"},{"id":"t0244","term":"三次握手","en":null,"chapter":"ch6","section":null,"plain":"TCP建立连接的过程：客户端发SYN→服务端回SYN+ACK→客户端回ACK","analogy":"就像打电话，「喂能听到吗？」「能听到你说吧。」「好的开始聊。」","tip":"为什么三次？两次的话服务器不知道客户端能不能收消息，四次没必要。面试必考","level":2,"tags":[],"py":"sanc","pyFull":"sanciwoshou","searchText":"三次握手  tcp建立连接的过程：客户端发syn→服务端回syn+ack→客户端回ack 就像打电话，「喂能听到吗？」「能听到你说吧。」「好的开始聊。」 为什么三次？两次的话服务器不知道客户端能不能收消息，四次没必要。面试必考"},{"id":"t0245","term":"四次挥手","en":null,"chapter":"ch6","section":null,"plain":"TCP断开连接的过程：主动方发FIN→被动方回ACK→被动方发FIN→主动方回ACK","analogy":"就像挂电话，「我说完了。」「好我知道了。」「我也说完了。」「好的拜拜。」","tip":"为什么四次？被动方可能还有数据没发完，所以ACK和FIN分开发。TIME_WAIT要等2MSL","level":2,"tags":[],"py":"sici","pyFull":"sicihuishou","searchText":"四次挥手  tcp断开连接的过程：主动方发fin→被动方回ack→被动方发fin→主动方回ack 就像挂电话，「我说完了。」「好我知道了。」「我也说完了。」「好的拜拜。」 为什么四次？被动方可能还有数据没发完，所以ack和fin分开发。time_wait要等2msl"},{"id":"t0246","term":"滑动窗口","en":null,"chapter":"ch6","section":null,"plain":"TCP流量控制机制：接收方告诉发送方自己能收多少，发送方按这个量发","analogy":"就像水管阀门，接收方说「我还能接10桶水」，发送方就最多发10桶","tip":"窗口大小动态调整，接收方处理得快窗口就开大，处理慢就开小","level":2,"tags":[],"py":"huad","pyFull":"huadongchuangkou","searchText":"滑动窗口  tcp流量控制机制：接收方告诉发送方自己能收多少，发送方按这个量发 就像水管阀门，接收方说「我还能接10桶水」，发送方就最多发10桶 窗口大小动态调整，接收方处理得快窗口就开大，处理慢就开小"},{"id":"t0247","term":"拥塞控制","en":null,"chapter":"ch6","section":null,"plain":"TCP防止网络堵死的机制：慢启动→拥塞避免→快重传→快恢复","analogy":"就像堵车，刚开始加速开（慢启动），发现开始堵就减速（拥塞避免）","tip":"流量控制防「接收方接不住」，拥塞控制防「网络扛不住」","level":2,"tags":[],"py":"yong","pyFull":"yongsekongzhi","searchText":"拥塞控制  tcp防止网络堵死的机制：慢启动→拥塞避免→快重传→快恢复 就像堵车，刚开始加速开（慢启动），发现开始堵就减速（拥塞避免） 流量控制防「接收方接不住」，拥塞控制防「网络扛不住」"},{"id":"t0248","term":"HTTP","en":null,"chapter":"ch6","section":null,"plain":"超文本传输协议，网页浏览用的应用层协议，基于TCP","analogy":"就像在餐厅点菜，你说「来份宫保鸡丁」（请求），服务员给你端上来（响应）","tip":"HTTP是明文传输，不安全。现在基本都用HTTPS了","level":2,"tags":[],"py":"http","pyFull":"http","searchText":"http  超文本传输协议，网页浏览用的应用层协议，基于tcp 就像在餐厅点菜，你说「来份宫保鸡丁」（请求），服务员给你端上来（响应） http是明文传输，不安全。现在基本都用https了"},{"id":"t0249","term":"HTTPS","en":null,"chapter":"ch6","section":null,"plain":"HTTP+SSL/TLS加密，数据传输加密，还能验证网站身份","analogy":"就像密语交谈，你和服务员用密码说话，旁边人听到了也听不懂","tip":"HTTPS=HTTP+TLS，端口443。比HTTP多了TLS握手过程，稍微慢一点但安全","level":2,"tags":[],"py":"http","pyFull":"https","searchText":"https  http+ssl/tls加密，数据传输加密，还能验证网站身份 就像密语交谈，你和服务员用密码说话，旁边人听到了也听不懂 https=http+tls，端口443。比http多了tls握手过程，稍微慢一点但安全"},{"id":"t0250","term":"SSL/TLS","en":null,"chapter":"ch6","section":null,"plain":"传输层加密协议，在HTTP和TCP之间，保证机密性、完整性、身份认证","analogy":"就像给信件加了密码锁，只有收发双方有钥匙，中途被拆开也看不懂","tip":"TLS 1.2和1.3是现在主流，SSL是旧名但大家还习惯叫SSL","level":2,"tags":[],"py":"sslt","pyFull":"ssltls","searchText":"ssl/tls  传输层加密协议，在http和tcp之间，保证机密性、完整性、身份认证 就像给信件加了密码锁，只有收发双方有钥匙，中途被拆开也看不懂 tls 1.2和1.3是现在主流，ssl是旧名但大家还习惯叫ssl"},{"id":"t0251","term":"数字证书","en":null,"chapter":"ch6","section":null,"plain":"CA机构颁发的证明网站身份的文件，包含公钥、域名、有效期等","analogy":"就像身份证，证明「我是我」，由权威机构（CA）盖章","tip":"浏览器访问HTTPS网站时会验证证书，证书无效会警告「不安全」","level":2,"tags":[],"py":"shuz","pyFull":"shuzizhengshu","searchText":"数字证书  ca机构颁发的证明网站身份的文件，包含公钥、域名、有效期等 就像身份证，证明「我是我」，由权威机构（ca）盖章 浏览器访问https网站时会验证证书，证书无效会警告「不安全」"},{"id":"t0252","term":"DNS","en":null,"chapter":"ch6","section":null,"plain":"域名系统，把好记的域名（baidu.com）翻译成IP地址","analogy":"就像电话本/通讯录，记住名字，自动查电话号码","tip":"DNS查询过程：浏览器缓存→系统缓存→hosts文件→本地DNS→根域名→顶级域→权威域","level":2,"tags":[],"py":"dns","pyFull":"dns","searchText":"dns  域名系统，把好记的域名（baidu.com）翻译成ip地址 就像电话本/通讯录，记住名字，自动查电话号码 dns查询过程：浏览器缓存→系统缓存→hosts文件→本地dns→根域名→顶级域→权威域"},{"id":"t0253","term":"CDN","en":null,"chapter":"ch6","section":null,"plain":"内容分发网络，把内容缓存到全国/全球各地的节点，用户就近访问","analogy":"就像连锁超市，不用每个顾客都去总仓库买，家门口的分店就有","tip":"静态资源（图片、视频、JS/CSS）放CDN加速很明显，动态内容不适合CDN","level":2,"tags":[],"py":"cdn","pyFull":"cdn","searchText":"cdn  内容分发网络，把内容缓存到全国/全球各地的节点，用户就近访问 就像连锁超市，不用每个顾客都去总仓库买，家门口的分店就有 静态资源（图片、视频、js/css）放cdn加速很明显，动态内容不适合cdn"},{"id":"t0254","term":"RESTful","en":null,"chapter":"ch6","section":null,"plain":"一种API设计风格：用URL表示资源，用HTTP方法（GET/POST/PUT/DELETE）表示操作","analogy":"就像图书馆操作，GET=查书，POST=新书入库，PUT=更新书信息，DELETE=下架书","tip":"REST是风格不是标准，核心是「资源」+「统一接口」，是现在最主流的API设计","level":2,"tags":[],"py":"rest","pyFull":"restful","searchText":"restful  一种api设计风格：用url表示资源，用http方法（get/post/put/delete）表示操作 就像图书馆操作，get=查书，post=新书入库，put=更新书信息，delete=下架书 rest是风格不是标准，核心是「资源」+「统一接口」，是现在最主流的api设计"},{"id":"t0255","term":"WebSocket","en":null,"chapter":"ch6","section":null,"plain":"全双工通信协议，建立连接后服务器能主动推消息给客户端","analogy":"就像打电话，接通后双方随时能说话，不用每次重新拨号","tip":"用于聊天、实时通知、股票行情、在线协作等需要服务器推送的场景","level":2,"tags":[],"py":"webs","pyFull":"websocket","searchText":"websocket  全双工通信协议，建立连接后服务器能主动推消息给客户端 就像打电话，接通后双方随时能说话，不用每次重新拨号 用于聊天、实时通知、股票行情、在线协作等需要服务器推送的场景"},{"id":"t0256","term":"Cookie","en":null,"chapter":"ch6","section":null,"plain":"存在浏览器里的小段数据，每次请求自动带上，用来记住用户状态","analogy":"就像超市会员卡，每次去超市都带着，超市扫一下就知道你是谁","tip":"Cookie有大小限制（约4KB），可以设置过期时间，有安全属性（HttpOnly/Secure）","level":2,"tags":[],"py":"cook","pyFull":"cookie","searchText":"cookie  存在浏览器里的小段数据，每次请求自动带上，用来记住用户状态 就像超市会员卡，每次去超市都带着，超市扫一下就知道你是谁 cookie有大小限制（约4kb），可以设置过期时间，有安全属性（httponly/secure）"},{"id":"t0257","term":"Session","en":null,"chapter":"ch6","section":null,"plain":"存在服务器端的用户会话数据，通过Cookie里的SessionID关联用户","analogy":"就像医院的病历本，存在医院（服务器），你拿个就诊卡（SessionID）去就能调出来","tip":"Session存在服务器占内存，用户多了有压力，分布式环境要做Session共享","level":2,"tags":[],"py":"sess","pyFull":"session","searchText":"session  存在服务器端的用户会话数据，通过cookie里的sessionid关联用户 就像医院的病历本，存在医院（服务器），你拿个就诊卡（sessionid）去就能调出来 session存在服务器占内存，用户多了有压力，分布式环境要做session共享"},{"id":"t0258","term":"Token/JWT","en":null,"chapter":"ch6","section":null,"plain":"令牌认证方式，把用户信息加密存在客户端，每次请求带Token","analogy":"就像门禁卡，卡里面有你的信息，刷卡就能进，不用每次查名单","tip":"JWT（JSON Web Token）是最常见的Token格式，适合前后端分离和分布式系统","level":2,"tags":[],"py":"toke","pyFull":"tokenjwt","searchText":"token/jwt  令牌认证方式，把用户信息加密存在客户端，每次请求带token 就像门禁卡，卡里面有你的信息，刷卡就能进，不用每次查名单 jwt（json web token）是最常见的token格式，适合前后端分离和分布式系统"},{"id":"t0259","term":"代理（Proxy）","en":null,"chapter":"ch6","section":null,"plain":"客户端不直接连服务器，通过中间人转发请求","analogy":"就像代购，你不直接去商店，让代购帮你买","tip":"正向代理代理客户端（翻墙用的就是），反向代理代理服务器（Nginx做的就是）","level":2,"tags":[],"py":"dail","pyFull":"daili","searchText":"代理（proxy）  客户端不直接连服务器，通过中间人转发请求 就像代购，你不直接去商店，让代购帮你买 正向代理代理客户端（翻墙用的就是），反向代理代理服务器（nginx做的就是）"},{"id":"t0260","term":"反向代理","en":null,"chapter":"ch6","section":null,"plain":"部署在服务器端，客户端不知道真实服务器是谁","analogy":"就像餐厅前台，你跟前台点菜，前台分配给后厨某个厨师，你不知道具体是谁做的","tip":"Nginx最常用作反向代理，还能做负载均衡、缓存、SSL卸载","level":2,"tags":[],"py":"fanx","pyFull":"fanxiangdaili","searchText":"反向代理  部署在服务器端，客户端不知道真实服务器是谁 就像餐厅前台，你跟前台点菜，前台分配给后厨某个厨师，你不知道具体是谁做的 nginx最常用作反向代理，还能做负载均衡、缓存、ssl卸载"},{"id":"t0261","term":"负载均衡","en":null,"chapter":"ch6","section":null,"plain":"把请求均匀分配到多台服务器上，避免单点过载","analogy":"就像银行叫号，多个窗口（服务器），取号系统（负载均衡器）分配客户","tip":"算法：轮询、加权轮询、最少连接、IP Hash。软件用Nginx/LVS，硬件用F5","level":2,"tags":[],"py":"fuza","pyFull":"fuzaijunheng","searchText":"负载均衡  把请求均匀分配到多台服务器上，避免单点过载 就像银行叫号，多个窗口（服务器），取号系统（负载均衡器）分配客户 算法：轮询、加权轮询、最少连接、ip hash。软件用nginx/lvs，硬件用f5"},{"id":"t0262","term":"网关（Gateway）","en":null,"chapter":"ch6","section":null,"plain":"系统的统一入口，负责路由、鉴权、限流、监控等","analogy":"就像小区大门，所有进出都走这里，保安查身份、控制人流量","tip":"API网关是微服务架构的标配：Spring Cloud Gateway、Kong、APISIX","level":2,"tags":[],"py":"wang","pyFull":"wangguan","searchText":"网关（gateway）  系统的统一入口，负责路由、鉴权、限流、监控等 就像小区大门，所有进出都走这里，保安查身份、控制人流量 api网关是微服务架构的标配：spring cloud gateway、kong、apisix"},{"id":"t0263","term":"防火墙（Firewall）","en":null,"chapter":"ch6","section":null,"plain":"控制进出网络的流量，按规则允许或阻止","analogy":"就像门禁系统，有卡的进，没卡的拦，可疑的报警","tip":"分网络层防火墙（iptables）和应用层防火墙（WAF）","level":2,"tags":[],"py":"fang","pyFull":"fanghuoqiang","searchText":"防火墙（firewall）  控制进出网络的流量，按规则允许或阻止 就像门禁系统，有卡的进，没卡的拦，可疑的报警 分网络层防火墙（iptables）和应用层防火墙（waf）"},{"id":"t0264","term":"NAT","en":null,"chapter":"ch6","section":null,"plain":"网络地址转换，把内网IP转换成公网IP，多个设备共用一个公网IP","analogy":"就像公司总机，外面的人打总机号码，总机转分机；里面的人打出去都显示总机号","tip":"NAT解决了IPv4地址不够用的问题，但也让P2P连接变复杂（需要打洞）","level":2,"tags":[],"py":"nat","pyFull":"nat","searchText":"nat  网络地址转换，把内网ip转换成公网ip，多个设备共用一个公网ip 就像公司总机，外面的人打总机号码，总机转分机；里面的人打出去都显示总机号 nat解决了ipv4地址不够用的问题，但也让p2p连接变复杂（需要打洞）"},{"id":"t0265","term":"子网掩码","en":null,"chapter":"ch6","section":null,"plain":"用来判断两个IP是否在同一个局域网内","analogy":"就像邮编，前几位相同就是同一个区域","tip":"IP和子网掩码做与运算得到网络地址，相同就是同一子网","level":2,"tags":[],"py":"ziwa","pyFull":"ziwangyanma","searchText":"子网掩码  用来判断两个ip是否在同一个局域网内 就像邮编，前几位相同就是同一个区域 ip和子网掩码做与运算得到网络地址，相同就是同一子网"},{"id":"t0266","term":"ARP","en":null,"chapter":"ch6","section":null,"plain":"地址解析协议，通过IP地址找MAC地址","analogy":"就像在教室喊「谁是张三？」，张三举手说「我是，我的MAC地址是xxx」","tip":"ARP只在同一局域网内工作，跨网段用路由","level":2,"tags":[],"py":"arp","pyFull":"arp","searchText":"arp  地址解析协议，通过ip地址找mac地址 就像在教室喊「谁是张三？」，张三举手说「我是，我的mac地址是xxx」 arp只在同一局域网内工作，跨网段用路由"},{"id":"t0267","term":"MAC地址","en":null,"chapter":"ch6","section":null,"plain":"网卡的物理地址，出厂时烧在网卡里，全球唯一","analogy":"就像身份证号，出生就定了，全球唯一不变","tip":"MAC地址工作在数据链路层，IP地址工作在网络层。交换机根据MAC转发，路由器根据IP转发","level":2,"tags":[],"py":"macd","pyFull":"macdizhi","searchText":"mac地址  网卡的物理地址，出厂时烧在网卡里，全球唯一 就像身份证号，出生就定了，全球唯一不变 mac地址工作在数据链路层，ip地址工作在网络层。交换机根据mac转发，路由器根据ip转发"},{"id":"t0268","term":"路由器（Router）","en":null,"chapter":"ch6","section":null,"plain":"在不同网络之间转发数据包，选择最佳路径","analogy":"就像交通枢纽，决定数据包走哪条路到目的地","tip":"路由器工作在网络层，连接不同网段。家里的「路由器」是路由+交换机+WiFi+DHCP的一体机","level":2,"tags":[],"py":"luyo","pyFull":"luyouqi","searchText":"路由器（router）  在不同网络之间转发数据包，选择最佳路径 就像交通枢纽，决定数据包走哪条路到目的地 路由器工作在网络层，连接不同网段。家里的「路由器」是路由+交换机+wifi+dhcp的一体机"},{"id":"t0269","term":"交换机（Switch）","en":null,"chapter":"ch6","section":null,"plain":"在局域网内转发数据帧，根据MAC地址决定发给谁","analogy":"就像公司内部快递员，知道每个人在哪个工位，信直接送到人","tip":"交换机工作在数据链路层，同一局域网内用交换机","level":2,"tags":[],"py":"jiao","pyFull":"jiaohuanji","searchText":"交换机（switch）  在局域网内转发数据帧，根据mac地址决定发给谁 就像公司内部快递员，知道每个人在哪个工位，信直接送到人 交换机工作在数据链路层，同一局域网内用交换机"},{"id":"t0270","term":"带宽（Bandwidth）","en":null,"chapter":"ch6","section":null,"plain":"网络通道的最大传输能力，单位bps（比特每秒）","analogy":"就像高速公路的车道数，车道越多带宽越大，同时能跑的车越多","tip":"带宽是「路有多宽」不是「车跑多快」。100M带宽实际下载速度≈12.5MB/s","level":2,"tags":[],"py":"daik","pyFull":"daikuan","searchText":"带宽（bandwidth）  网络通道的最大传输能力，单位bps（比特每秒） 就像高速公路的车道数，车道越多带宽越大，同时能跑的车越多 带宽是「路有多宽」不是「车跑多快」。100m带宽实际下载速度≈12.5mb/s"},{"id":"t0271","term":"延迟（Latency）","en":null,"chapter":"ch6","section":null,"plain":"数据从一端传到另一端花的时间，单位ms","analogy":"就像快递运输时间，路再宽（带宽大），距离远了还是要时间","tip":"延迟主要受距离、光速、网络设备处理时间影响。游戏玩家说的「ping值」就是延迟","level":2,"tags":[],"py":"yanc","pyFull":"yanchi","searchText":"延迟（latency）  数据从一端传到另一端花的时间，单位ms 就像快递运输时间，路再宽（带宽大），距离远了还是要时间 延迟主要受距离、光速、网络设备处理时间影响。游戏玩家说的「ping值」就是延迟"},{"id":"t0272","term":"丢包（Packet Loss）","en":null,"chapter":"ch6","section":null,"plain":"数据包在传输中丢失了，需要重传","analogy":"就像寄信寄丢了，要重寄一次","tip":"网络拥塞、硬件故障、信号差都会丢包。TCP会自动重传，UDP丢了就丢了","level":2,"tags":[],"py":"diub","pyFull":"diubao","searchText":"丢包（packet loss）  数据包在传输中丢失了，需要重传 就像寄信寄丢了，要重寄一次 网络拥塞、硬件故障、信号差都会丢包。tcp会自动重传，udp丢了就丢了"},{"id":"t0273","term":"抓包","en":null,"chapter":"ch6","section":null,"plain":"拦截并查看网络上传输的数据包内容，用于调试和分析","analogy":"就像在电话线上装窃听器，听双方说了什么","tip":"常用工具：Wireshark（全面）、Fiddler/Charles（HTTP抓包）、tcpdump（命令行）","level":2,"tags":[],"py":"zhua","pyFull":"zhuabao","searchText":"抓包  拦截并查看网络上传输的数据包内容，用于调试和分析 就像在电话线上装窃听器，听双方说了什么 常用工具：wireshark（全面）、fiddler/charles（http抓包）、tcpdump（命令行）"},{"id":"t0274","term":"ICMP","en":null,"chapter":"ch6","section":null,"plain":"「网际控制报文协议」，IP 层的报错小助手（ping 就靠它）","analogy":"就像快递的「查无此人退信」：包送不到，退信给你说明原因","tip":"408考纲词。ping/traceroute 底层都是 ICMP，报错类型是考点","level":2,"tags":[],"py":"icmp","pyFull":"icmp","searchText":"icmp  「网际控制报文协议」，ip 层的报错小助手（ping 就靠它） 就像快递的「查无此人退信」：包送不到，退信给你说明原因 408考纲词。ping/traceroute 底层都是 icmp，报错类型是考点"},{"id":"t0275","term":"Ping / Traceroute","en":null,"chapter":"ch6","section":null,"plain":"检查目标通不通/延迟多少；逐跳追踪数据包路径","analogy":"Ping 像敲门问在不在，Traceroute 像顺藤摸瓜查每一站","tip":"排查网络第一命令。Traceroute（Linux）≈ tracert（Windows）","level":2,"tags":[],"py":"ping","pyFull":"pingtraceroute","searchText":"ping / traceroute  检查目标通不通/延迟多少；逐跳追踪数据包路径 ping 像敲门问在不在，traceroute 像顺藤摸瓜查每一站 排查网络第一命令。traceroute（linux）≈ tracert（windows）"},{"id":"t0276","term":"DHCP","en":null,"chapter":"ch6","section":null,"plain":"动态主机配置协议：路由器自动给你的设备分配 IP","analogy":"就像酒店前台自动给你房卡：入住即分配，退房回收","tip":"家里路由器自动分配 IP 就是 DHCP。会问「IP 哪来的」=DHCP 干的","level":2,"tags":[],"py":"dhcp","pyFull":"dhcp","searchText":"dhcp  动态主机配置协议：路由器自动给你的设备分配 ip 就像酒店前台自动给你房卡：入住即分配，退房回收 家里路由器自动分配 ip 就是 dhcp。会问「ip 哪来的」=dhcp 干的"},{"id":"t0277","term":"子网划分与 CIDR","en":null,"chapter":"ch6","section":null,"plain":"把一段 IP 按前缀长度切成小块分配（如 192.168.1.0/24）","analogy":"就像小区分栋：/24 是整栋楼，/28 是一个单元","tip":"408计算题重点，必须会算。CIDR 用「IP/前缀长度」表示","level":2,"tags":[],"py":"ziwa","pyFull":"ziwanghuafenyucidr","searchText":"子网划分与 cidr  把一段 ip 按前缀长度切成小块分配（如 192.168.1.0/24） 就像小区分栋：/24 是整栋楼，/28 是一个单元 408计算题重点，必须会算。cidr 用「ip/前缀长度」表示"},{"id":"t0278","term":"VLAN","en":null,"chapter":"ch6","section":null,"plain":"虚拟局域网：一个交换机上逻辑隔离出多个「小局域网」","analogy":"就像同一栋楼用隔断分成多个独立办公室","tip":"公司组网标配。同一 VLAN 才能直接通信，不同 VLAN 要路由","level":2,"tags":[],"py":"vlan","pyFull":"vlan","searchText":"vlan  虚拟局域网：一个交换机上逻辑隔离出多个「小局域网」 就像同一栋楼用隔断分成多个独立办公室 公司组网标配。同一 vlan 才能直接通信，不同 vlan 要路由"},{"id":"t0279","term":"VPN 与隧道","en":null,"chapter":"ch6","section":null,"plain":"在公网上开一条加密「专线」，远程访问公司内网","analogy":"就像给快递加了保密信封+专线运输","tip":"远程办公/连校园网的场景。原理：数据包套数据包（隧道）","level":2,"tags":[],"py":"vpny","pyFull":"vpnyusuidao","searchText":"vpn 与隧道  在公网上开一条加密「专线」，远程访问公司内网 就像给快递加了保密信封+专线运输 远程办公/连校园网的场景。原理：数据包套数据包（隧道）"},{"id":"t0280","term":"路由协议","en":null,"chapter":"ch6","section":null,"plain":"路由器之间互相通报路况、选路的规则：RIP/OSPF/BGP","analogy":"就像城市间的高速路况播报：哪堵走哪绕","tip":"408考纲词。RIP 小网络距离向量、OSPF 大网络链路状态、BGP 互联网级","level":2,"tags":[],"py":"luyo","pyFull":"luyouxieyi","searchText":"路由协议  路由器之间互相通报路况、选路的规则：rip/ospf/bgp 就像城市间的高速路况播报：哪堵走哪绕 408考纲词。rip 小网络距离向量、ospf 大网络链路状态、bgp 互联网级"},{"id":"t0281","term":"广播风暴","en":null,"chapter":"ch6","section":null,"plain":"交换机环路导致广播帧无限循环，网络瘫痪","analogy":"就像传话游戏失去控制，一条消息无限复制传遍全楼","tip":"交换机环路/错误配置触发。防环机制：STP（生成树协议）","level":2,"tags":[],"py":"guan","pyFull":"guangbofengbao","searchText":"广播风暴  交换机环路导致广播帧无限循环，网络瘫痪 就像传话游戏失去控制，一条消息无限复制传遍全楼 交换机环路/错误配置触发。防环机制：stp（生成树协议）"},{"id":"t0282","term":"数据库（DB）","en":null,"chapter":"ch7","section":null,"plain":"有组织地存储数据的仓库，能快速存取、查询、修改","analogy":"就像图书馆，书（数据）按规则放好，能快速找到想要的书","tip":"Excel不是数据库！数据库支持并发访问、事务、查询语言，Excel不行","level":2,"tags":[],"py":"shuj","pyFull":"shujuku","searchText":"数据库（db）  有组织地存储数据的仓库，能快速存取、查询、修改 就像图书馆，书（数据）按规则放好，能快速找到想要的书 excel不是数据库！数据库支持并发访问、事务、查询语言，excel不行"},{"id":"t0283","term":"数据库管理系统（DBMS）","en":null,"chapter":"ch7","section":null,"plain":"管理数据库的软件，提供增删改查和管理功能","analogy":"就像图书馆管理系统，帮你找书、借书、还书、上架","tip":"常见DBMS：MySQL、PostgreSQL（关系型）；Redis、MongoDB（NoSQL）","level":2,"tags":[],"py":"shuj","pyFull":"shujukuguanlixitong","searchText":"数据库管理系统（dbms）  管理数据库的软件，提供增删改查和管理功能 就像图书馆管理系统，帮你找书、借书、还书、上架 常见dbms：mysql、postgresql（关系型）；redis、mongodb（nosql）"},{"id":"t0284","term":"关系型数据库（RDBMS）","en":null,"chapter":"ch7","section":null,"plain":"用表格存数据，表和表之间通过外键建立关系，用SQL查询","analogy":"就像Excel表格，行是记录，列是字段，表格之间可以关联","tip":"适合数据结构明确、需要事务保证的场景（银行、电商订单）","level":2,"tags":[],"py":"guan","pyFull":"guanxixingshujuku","searchText":"关系型数据库（rdbms）  用表格存数据，表和表之间通过外键建立关系，用sql查询 就像excel表格，行是记录，列是字段，表格之间可以关联 适合数据结构明确、需要事务保证的场景（银行、电商订单）"},{"id":"t0285","term":"NoSQL","en":null,"chapter":"ch7","section":null,"plain":"非关系型数据库，不固定表结构，灵活扩展，适合大数据高并发","analogy":"就像各种收纳盒，有的适合放书，有的适合放衣服，不都用表格","tip":"四大类：键值（Redis）、文档（MongoDB）、列族（HBase）、图（Neo4j）","level":2,"tags":[],"py":"nosq","pyFull":"nosql","searchText":"nosql  非关系型数据库，不固定表结构，灵活扩展，适合大数据高并发 就像各种收纳盒，有的适合放书，有的适合放衣服，不都用表格 四大类：键值（redis）、文档（mongodb）、列族（hbase）、图（neo4j）"},{"id":"t0286","term":"SQL","en":null,"chapter":"ch7","section":null,"plain":"结构化查询语言，操作关系型数据库的标准语言","analogy":"就像图书馆的查询指令，「帮我找所有计算机类、2024年后出版的书」","tip":"SQL是声明式语言：你说「要什么」而不是「怎么去找」，DBMS决定执行计划","level":2,"tags":[],"py":"sql","pyFull":"sql","searchText":"sql  结构化查询语言，操作关系型数据库的标准语言 就像图书馆的查询指令，「帮我找所有计算机类、2024年后出版的书」 sql是声明式语言：你说「要什么」而不是「怎么去找」，dbms决定执行计划"},{"id":"t0287","term":"表（Table）","en":null,"chapter":"ch7","section":null,"plain":"数据按行和列组织的二维结构，是关系型数据库的基本单元","analogy":"就像一张Excel表，有表头（字段名），每行一条记录","tip":"设计表结构是数据库开发的第一步，好的表设计减少很多后续麻烦","level":2,"tags":[],"py":"biao","pyFull":"biao","searchText":"表（table）  数据按行和列组织的二维结构，是关系型数据库的基本单元 就像一张excel表，有表头（字段名），每行一条记录 设计表结构是数据库开发的第一步，好的表设计减少很多后续麻烦"},{"id":"t0288","term":"主键（Primary Key）","en":null,"chapter":"ch7","section":null,"plain":"唯一标识表中一行记录的字段，不能重复不能为NULL","analogy":"就像身份证号，每个人唯一，不会重复","tip":"每张表必须有主键，常用自增ID或UUID做主键","level":2,"tags":[],"py":"zhuj","pyFull":"zhujian","searchText":"主键（primary key）  唯一标识表中一行记录的字段，不能重复不能为null 就像身份证号，每个人唯一，不会重复 每张表必须有主键，常用自增id或uuid做主键"},{"id":"t0289","term":"外键（Foreign Key）","en":null,"chapter":"ch7","section":null,"plain":"一张表中引用另一张表主键的字段，用来建立表与表之间的关系","analogy":"就像借书记录里的「读者ID」，指向读者表里的某个人","tip":"外键保证数据一致性（参照完整性），但高并发场景有时候故意不用外键（影响性能）","level":2,"tags":[],"py":"waij","pyFull":"waijian","searchText":"外键（foreign key）  一张表中引用另一张表主键的字段，用来建立表与表之间的关系 就像借书记录里的「读者id」，指向读者表里的某个人 外键保证数据一致性（参照完整性），但高并发场景有时候故意不用外键（影响性能）"},{"id":"t0290","term":"索引（Index）","en":null,"chapter":"ch7","section":null,"plain":"为了加速查询而建立的数据结构，类似书的目录","analogy":"就像字典的部首目录，不用翻遍整本字典，按目录直接翻到那页","tip":"索引加速查询但减慢写入（每次写入要更新索引），占额外空间。不要滥建索引！","level":2,"tags":[],"py":"suoy","pyFull":"suoyin","searchText":"索引（index）  为了加速查询而建立的数据结构，类似书的目录 就像字典的部首目录，不用翻遍整本字典，按目录直接翻到那页 索引加速查询但减慢写入（每次写入要更新索引），占额外空间。不要滥建索引！"},{"id":"t0291","term":"B+树","en":null,"chapter":"ch7","section":null,"plain":"数据库索引最常用的数据结构，多路平衡查找树，叶子节点链表相连","analogy":"就像多层级目录，一层层找下去，找到后还能顺着叶子顺序翻","tip":"B+树vs B树：B+树所有数据在叶子节点，非叶子只存索引；叶子链表方便范围查询","level":2,"tags":[],"py":"bshu","pyFull":"bshu","searchText":"b+树  数据库索引最常用的数据结构，多路平衡查找树，叶子节点链表相连 就像多层级目录，一层层找下去，找到后还能顺着叶子顺序翻 b+树vs b树：b+树所有数据在叶子节点，非叶子只存索引；叶子链表方便范围查询"},{"id":"t0292","term":"ACID","en":null,"chapter":"ch7","section":null,"plain":"事务四大特性：原子性（A）、一致性（C）、隔离性（I）、持久性（D）","analogy":"原子=要么全做要么不做；一致=数据始终合法；隔离=事务之间互不干扰；持久=提交了就不会丢","tip":"面试高频考点。记住ACID四个字母分别代表什么、什么含义","level":2,"tags":[],"py":"acid","pyFull":"acid","searchText":"acid  事务四大特性：原子性（a）、一致性（c）、隔离性（i）、持久性（d） 原子=要么全做要么不做；一致=数据始终合法；隔离=事务之间互不干扰；持久=提交了就不会丢 面试高频考点。记住acid四个字母分别代表什么、什么含义"},{"id":"t0293","term":"脏读（Dirty Read）","en":null,"chapter":"ch7","section":null,"plain":"读到了其他事务还没提交的数据，万一那个事务回滚了就是脏数据","analogy":"就像看别人还在写的草稿，人家可能会改，你看到的不一定是最终版","tip":"解决：隔离级别设为「读已提交」以上","level":2,"tags":[],"py":"zang","pyFull":"zangdu","searchText":"脏读（dirty read）  读到了其他事务还没提交的数据，万一那个事务回滚了就是脏数据 就像看别人还在写的草稿，人家可能会改，你看到的不一定是最终版 解决：隔离级别设为「读已提交」以上"},{"id":"t0294","term":"不可重复读","en":null,"chapter":"ch7","section":null,"plain":"同一个事务内两次读同一行数据，结果不一样（被其他事务修改并提交了）","analogy":"就像同一本书借两次，第二次发现内容被改了","tip":"解决：隔离级别设为「可重复读」（MySQL默认级别）","level":2,"tags":[],"py":"buke","pyFull":"bukechongfudu","searchText":"不可重复读  同一个事务内两次读同一行数据，结果不一样（被其他事务修改并提交了） 就像同一本书借两次，第二次发现内容被改了 解决：隔离级别设为「可重复读」（mysql默认级别）"},{"id":"t0295","term":"幻读","en":null,"chapter":"ch7","section":null,"plain":"同一个事务内两次查询返回的行数不一样（其他事务插入/删除了行）","analogy":"就像点名时点了两次，第二次多了几个人","tip":"解决：串行化隔离级别，或用间隙锁（Gap Lock）","level":2,"tags":[],"py":"huan","pyFull":"huandu","searchText":"幻读  同一个事务内两次查询返回的行数不一样（其他事务插入/删除了行） 就像点名时点了两次，第二次多了几个人 解决：串行化隔离级别，或用间隙锁（gap lock）"},{"id":"t0296","term":"隔离级别","en":null,"chapter":"ch7","section":null,"plain":"从低到高：读未提交→读已提交→可重复读→串行化，越安全越慢","analogy":"就像保密级别，越高级越安全但手续越麻烦","tip":"MySQL默认可重复读（RR），Oracle默认读已提交（RC）。级别越高并发性能越差","level":2,"tags":[],"py":"geli","pyFull":"gelijibie","searchText":"隔离级别  从低到高：读未提交→读已提交→可重复读→串行化，越安全越慢 就像保密级别，越高级越安全但手续越麻烦 mysql默认可重复读（rr），oracle默认读已提交（rc）。级别越高并发性能越差"},{"id":"t0297","term":"锁（Lock）","en":null,"chapter":"ch7","section":null,"plain":"防止多个事务同时修改同一数据造成冲突","analogy":"就像厕所门锁，进去了就锁门，别人等","tip":"分类：行锁 vs 表锁（锁的粒度），乐观锁 vs 悲观锁（锁的策略），共享锁 vs 排他锁","level":2,"tags":[],"py":"suo","pyFull":"suo","searchText":"锁（lock）  防止多个事务同时修改同一数据造成冲突 就像厕所门锁，进去了就锁门，别人等 分类：行锁 vs 表锁（锁的粒度），乐观锁 vs 悲观锁（锁的策略），共享锁 vs 排他锁"},{"id":"t0298","term":"乐观锁/悲观锁","en":null,"chapter":"ch7","section":null,"plain":"悲观锁假设会冲突，先锁了再说；乐观锁假设不会冲突，提交时检查","analogy":"悲观锁=上车就抢座锁上；乐观锁=先坐，下车时看座位有没有被别人占","tip":"读多用乐观锁（版本号/CAS），写多用悲观锁","level":2,"tags":[],"py":"legu","pyFull":"leguansuobeiguansuo","searchText":"乐观锁/悲观锁  悲观锁假设会冲突，先锁了再说；乐观锁假设不会冲突，提交时检查 悲观锁=上车就抢座锁上；乐观锁=先坐，下车时看座位有没有被别人占 读多用乐观锁（版本号/cas），写多用悲观锁"},{"id":"t0299","term":"范式（Normal Form）","en":null,"chapter":"ch7","section":null,"plain":"设计表结构的规范，减少数据冗余：1NF→2NF→3NF→BCNF","analogy":"就像整理衣柜，1NF=分类放，2NF=每类只放一类衣服，3NF=不要重复放","tip":"范式化减少冗余但查询要联表，实际开发经常适度反范式","level":2,"tags":[],"py":"fans","pyFull":"fanshi","searchText":"范式（normal form）  设计表结构的规范，减少数据冗余：1nf→2nf→3nf→bcnf 就像整理衣柜，1nf=分类放，2nf=每类只放一类衣服，3nf=不要重复放 范式化减少冗余但查询要联表，实际开发经常适度反范式"},{"id":"t0300","term":"反范式","en":null,"chapter":"ch7","section":null,"plain":"故意增加冗余数据，用空间换时间，减少联表查询提升性能","analogy":"就像把常用的东西放在多个地方，虽然占空间但拿起来快","tip":"高并发系统（电商、社交）大量使用反范式设计，但要注意冗余数据的一致性维护","level":2,"tags":[],"py":"fanf","pyFull":"fanfanshi","searchText":"反范式  故意增加冗余数据，用空间换时间，减少联表查询提升性能 就像把常用的东西放在多个地方，虽然占空间但拿起来快 高并发系统（电商、社交）大量使用反范式设计，但要注意冗余数据的一致性维护"},{"id":"t0301","term":"联表查询（JOIN）","en":null,"chapter":"ch7","section":null,"plain":"把多张表的数据按关联条件组合在一起查","analogy":"就像把借书记录、读者信息、书籍信息三张表拼在一起看","tip":"INNER JOIN（交集）、LEFT JOIN（左表全有）、RIGHT JOIN（右表全有）、FULL JOIN（并集）","level":2,"tags":[],"py":"lian","pyFull":"lianbiaochaxun","searchText":"联表查询（join）  把多张表的数据按关联条件组合在一起查 就像把借书记录、读者信息、书籍信息三张表拼在一起看 inner join（交集）、left join（左表全有）、right join（右表全有）、full join（并集）"},{"id":"t0302","term":"视图（View）","en":null,"chapter":"ch7","section":null,"plain":"虚拟表，本身不存数据，是一条预定义的SELECT查询语句","analogy":"就像一个固定的视角，从特定角度看数据，不用每次写复杂SQL","tip":"视图可以简化复杂查询、控制权限，但视图不提升性能","level":2,"tags":[],"py":"shit","pyFull":"shitu","searchText":"视图（view）  虚拟表，本身不存数据，是一条预定义的select查询语句 就像一个固定的视角，从特定角度看数据，不用每次写复杂sql 视图可以简化复杂查询、控制权限，但视图不提升性能"},{"id":"t0303","term":"存储过程（Stored Procedure）","en":null,"chapter":"ch7","section":null,"plain":"预编译在数据库里的SQL逻辑集合，可以像函数一样调用","analogy":"就像预制菜，提前备好，点单时热一下就能上","tip":"存储过程把业务逻辑放在数据库端，性能好但维护困难，互联网公司一般不推荐大量使用","level":2,"tags":[],"py":"cunc","pyFull":"cunchuguocheng","searchText":"存储过程（stored procedure）  预编译在数据库里的sql逻辑集合，可以像函数一样调用 就像预制菜，提前备好，点单时热一下就能上 存储过程把业务逻辑放在数据库端，性能好但维护困难，互联网公司一般不推荐大量使用"},{"id":"t0304","term":"触发器（Trigger）","en":null,"chapter":"ch7","section":null,"plain":"数据库里的事件监听器，满足条件（增删改）时自动执行预设操作","analogy":"就像报警器，有人开门就自动响","tip":"触发器隐蔽性强，出问题不好排查，大型系统慎用","level":2,"tags":[],"py":"chuf","pyFull":"chufaqi","searchText":"触发器（trigger）  数据库里的事件监听器，满足条件（增删改）时自动执行预设操作 就像报警器，有人开门就自动响 触发器隐蔽性强，出问题不好排查，大型系统慎用"},{"id":"t0305","term":"主从复制","en":null,"chapter":"ch7","section":null,"plain":"主库负责写，从库同步主库数据负责读，读写分离提高性能","analogy":"就像总店接订单（写），分店卖货（读），分店从总店拿货","tip":"主从复制还能做数据备份和故障切换，但有主从延迟问题","level":2,"tags":[],"py":"zhuc","pyFull":"zhucongfuzhi","searchText":"主从复制  主库负责写，从库同步主库数据负责读，读写分离提高性能 就像总店接订单（写），分店卖货（读），分店从总店拿货 主从复制还能做数据备份和故障切换，但有主从延迟问题"},{"id":"t0306","term":"分库分表","en":null,"chapter":"ch7","section":null,"plain":"数据量太大时把一个库拆成多个库（分库），一个表拆成多个表（分表）","analogy":"就像大公司分部门，一个部门管不过来就拆分","tip":"水平拆分（按行拆，如按用户ID取模）vs 垂直拆分（按列/功能拆，如用户库、订单库）","level":2,"tags":[],"py":"fenk","pyFull":"fenkufenbiao","searchText":"分库分表  数据量太大时把一个库拆成多个库（分库），一个表拆成多个表（分表） 就像大公司分部门，一个部门管不过来就拆分 水平拆分（按行拆，如按用户id取模）vs 垂直拆分（按列/功能拆，如用户库、订单库）"},{"id":"t0307","term":"读写分离","en":null,"chapter":"ch7","section":null,"plain":"写操作走主库，读操作走从库，分散压力","analogy":"就像读写在不同房间，写去登记处，读去查询台","tip":"要注意主从延迟导致刚写完读不到的问题","level":2,"tags":[],"py":"duxi","pyFull":"duxiefenli","searchText":"读写分离  写操作走主库，读操作走从库，分散压力 就像读写在不同房间，写去登记处，读去查询台 要注意主从延迟导致刚写完读不到的问题"},{"id":"t0308","term":"Redis","en":null,"chapter":"ch7","section":null,"plain":"最流行的内存键值数据库，用作缓存、排行榜、消息队列、分布式锁","analogy":"就像便利店，东西都在柜台里（内存），拿取极快，但店面小存不了太多","tip":"Redis是单线程但极快（内存操作+IO多路复用）。注意缓存穿透、击穿、雪崩问题","level":2,"tags":[],"py":"redi","pyFull":"redis","searchText":"redis  最流行的内存键值数据库，用作缓存、排行榜、消息队列、分布式锁 就像便利店，东西都在柜台里（内存），拿取极快，但店面小存不了太多 redis是单线程但极快（内存操作+io多路复用）。注意缓存穿透、击穿、雪崩问题"},{"id":"t0309","term":"缓存穿透","en":null,"chapter":"ch7","section":null,"plain":"查一个根本不存在的数据，缓存没有数据库也没有，请求直接打数据库","analogy":"就像有人点菜单上没有的菜，每次都要跑去厨房问，问了也没有","tip":"解决：布隆过滤器、缓存空值","level":2,"tags":[],"py":"huan","pyFull":"huancunchuantou","searchText":"缓存穿透  查一个根本不存在的数据，缓存没有数据库也没有，请求直接打数据库 就像有人点菜单上没有的菜，每次都要跑去厨房问，问了也没有 解决：布隆过滤器、缓存空值"},{"id":"t0310","term":"缓存击穿","en":null,"chapter":"ch7","section":null,"plain":"某个热点Key过期的瞬间，大量并发请求同时打到数据库","analogy":"就像明星刚出现在机场瞬间被粉丝包围，门口的保安（缓存）正好换班了","tip":"解决：热点数据永不过期、加互斥锁","level":2,"tags":[],"py":"huan","pyFull":"huancunjichuan","searchText":"缓存击穿  某个热点key过期的瞬间，大量并发请求同时打到数据库 就像明星刚出现在机场瞬间被粉丝包围，门口的保安（缓存）正好换班了 解决：热点数据永不过期、加互斥锁"},{"id":"t0311","term":"缓存雪崩","en":null,"chapter":"ch7","section":null,"plain":"大量缓存Key在同一时间过期，或缓存服务宕机，所有请求同时打数据库","analogy":"就像一群保安同时下班，所有粉丝同时冲进来","tip":"解决：过期时间加随机偏移、Redis集群高可用、多级缓存","level":2,"tags":[],"py":"huan","pyFull":"huancunxuebeng","searchText":"缓存雪崩  大量缓存key在同一时间过期，或缓存服务宕机，所有请求同时打数据库 就像一群保安同时下班，所有粉丝同时冲进来 解决：过期时间加随机偏移、redis集群高可用、多级缓存"},{"id":"t0312","term":"MongoDB","en":null,"chapter":"ch7","section":null,"plain":"文档型NoSQL数据库，数据存成BSON（二进制JSON）格式，Schema灵活","analogy":"就像一个大文件夹，每个文档（记录）结构可以不一样，想怎么存怎么存","tip":"适合内容管理、日志、社交网络等Schema经常变的场景","level":2,"tags":[],"py":"mong","pyFull":"mongodb","searchText":"mongodb  文档型nosql数据库，数据存成bson（二进制json）格式，schema灵活 就像一个大文件夹，每个文档（记录）结构可以不一样，想怎么存怎么存 适合内容管理、日志、社交网络等schema经常变的场景"},{"id":"t0313","term":"Elasticsearch","en":null,"chapter":"ch7","section":null,"plain":"分布式搜索引擎，倒排索引实现全文检索，也做日志分析","analogy":"就像书后面的索引表，记录每个词出现在哪几页","tip":"ELK Stack（Elasticsearch+Logstash+Kibana）是日志分析标配","level":2,"tags":[],"py":"elas","pyFull":"elasticsearch","searchText":"elasticsearch  分布式搜索引擎，倒排索引实现全文检索，也做日志分析 就像书后面的索引表，记录每个词出现在哪几页 elk stack（elasticsearch+logstash+kibana）是日志分析标配"},{"id":"t0314","term":"ORM","en":null,"chapter":"ch7","section":null,"plain":"对象关系映射，把数据库表映射成代码里的类/对象，不用手写SQL","analogy":"就像自动翻译，你用对象说话，ORM帮你翻译成SQL","tip":"MyBatis（半自动化，SQL自己写）、Hibernate/JPA（全自动）、SQLAlchemy（Python）","level":2,"tags":[],"py":"orm","pyFull":"orm","searchText":"orm  对象关系映射，把数据库表映射成代码里的类/对象，不用手写sql 就像自动翻译，你用对象说话，orm帮你翻译成sql mybatis（半自动化，sql自己写）、hibernate/jpa（全自动）、sqlalchemy（python）"},{"id":"t0315","term":"两段锁协议（2PL）","en":null,"chapter":"ch7","section":null,"plain":"并发控制规则：所有加锁操作在解锁之前，分「扩展期/收缩期」两段","analogy":"就像先点完菜再上菜：锁定阶段只加锁，解锁阶段只放锁","tip":"数据库原理教材核心（王珊版第11章）。是保证可串行化的经典协议","level":2,"tags":[],"py":"lian","pyFull":"liangduansuoxieyi","searchText":"两段锁协议（2pl）  并发控制规则：所有加锁操作在解锁之前，分「扩展期/收缩期」两段 就像先点完菜再上菜：锁定阶段只加锁，解锁阶段只放锁 数据库原理教材核心（王珊版第11章）。是保证可串行化的经典协议"},{"id":"t0316","term":"日志与恢复","en":null,"chapter":"ch7","section":null,"plain":"先记日志（redo/undo）再改数据，崩溃后靠日志重放或回滚","analogy":"就像记账先写草稿再誊正本，草稿在就能重誊","tip":"WAL原则的教材表述。检查点（Checkpoint）让恢复不用从头扫","level":2,"tags":[],"py":"rizh","pyFull":"rizhiyuhuifu","searchText":"日志与恢复  先记日志（redo/undo）再改数据，崩溃后靠日志重放或回滚 就像记账先写草稿再誊正本，草稿在就能重誊 wal原则的教材表述。检查点（checkpoint）让恢复不用从头扫"},{"id":"t0317","term":"查询优化器","en":null,"chapter":"ch7","section":null,"plain":"数据库自动挑选最快执行路径（走哪个索引、什么连接顺序）","analogy":"就像导航自动选路：同样到目的地，挑不堵的路线","tip":"EXPLAIN 出来的执行计划就是优化器的选择。面试优化 SQL 的本质=帮优化器做对选择","level":2,"tags":[],"py":"chax","pyFull":"chaxunyouhuaqi","searchText":"查询优化器  数据库自动挑选最快执行路径（走哪个索引、什么连接顺序） 就像导航自动选路：同样到目的地，挑不堵的路线 explain 出来的执行计划就是优化器的选择。面试优化 sql 的本质=帮优化器做对选择"},{"id":"t0318","term":"软件工程","en":null,"chapter":"ch8","section":null,"plain":"用工程化方法开发和维护软件，把「写代码」变成「造房子」","analogy":"就像建大楼，不能随便搭，要设计、施工、验收、维护","tip":"软件工程解决「多人协作写大型软件」的问题，核心是控制复杂度","level":2,"tags":[],"py":"ruan","pyFull":"ruanjiangongcheng","searchText":"软件工程  用工程化方法开发和维护软件，把「写代码」变成「造房子」 就像建大楼，不能随便搭，要设计、施工、验收、维护 软件工程解决「多人协作写大型软件」的问题，核心是控制复杂度"},{"id":"t0319","term":"需求分析","en":null,"chapter":"ch8","section":null,"plain":"搞清楚用户到底要什么，是软件开发最容易出问题的环节","analogy":"就像装修前沟通，客户说「简约风」，你得搞清楚他说的简约是什么样","tip":"需求做不好，后面全白干。产品经理和程序员的矛盾很多源于需求不明确","level":2,"tags":[],"py":"xuqi","pyFull":"xuqiufenxi","searchText":"需求分析  搞清楚用户到底要什么，是软件开发最容易出问题的环节 就像装修前沟通，客户说「简约风」，你得搞清楚他说的简约是什么样 需求做不好，后面全白干。产品经理和程序员的矛盾很多源于需求不明确"},{"id":"t0320","term":"瀑布模型","en":null,"chapter":"ch8","section":null,"plain":"线性开发流程：需求→设计→编码→测试→上线，一步一步走，不回头","analogy":"就像瀑布，水从上往下流，不会倒流","tip":"瀑布模型适合需求很明确的项目（航天、医疗），互联网项目很少用","level":2,"tags":[],"py":"pubu","pyFull":"pubumoxing","searchText":"瀑布模型  线性开发流程：需求→设计→编码→测试→上线，一步一步走，不回头 就像瀑布，水从上往下流，不会倒流 瀑布模型适合需求很明确的项目（航天、医疗），互联网项目很少用"},{"id":"t0321","term":"敏捷开发（Agile）","en":null,"chapter":"ch8","section":null,"plain":"小步快跑、反复迭代、拥抱变化，不追求一次做完","analogy":"就像自助餐，想吃什么先拿一点，好吃再拿，不好吃换别的","tip":"敏捷是一种理念不是方法，Scrum是最常用的敏捷实践","level":2,"tags":[],"py":"minj","pyFull":"minjiekaifa","searchText":"敏捷开发（agile）  小步快跑、反复迭代、拥抱变化，不追求一次做完 就像自助餐，想吃什么先拿一点，好吃再拿，不好吃换别的 敏捷是一种理念不是方法，scrum是最常用的敏捷实践"},{"id":"t0322","term":"Scrum","en":null,"chapter":"ch8","section":null,"plain":"最流行的敏捷方法：Sprint冲刺、每日站会、回顾会、产品待办列表","analogy":"就像短距离冲刺跑，每次冲2周，冲完回顾再冲下一次","tip":"三个角色：Product Owner（定优先级）、Scrum Master（流程守护者）、团队（干活）","level":2,"tags":[],"py":"scru","pyFull":"scrum","searchText":"scrum  最流行的敏捷方法：sprint冲刺、每日站会、回顾会、产品待办列表 就像短距离冲刺跑，每次冲2周，冲完回顾再冲下一次 三个角色：product owner（定优先级）、scrum master（流程守护者）、团队（干活）"},{"id":"t0323","term":"Sprint","en":null,"chapter":"ch8","section":null,"plain":"一个迭代周期，通常1-2周，要完成一批可交付的功能","analogy":"就像一期综艺节目，录2周，剪完播出，再录下一期","tip":"每个Sprint结束要有可演示的产品增量","level":2,"tags":[],"py":"spri","pyFull":"sprint","searchText":"sprint  一个迭代周期，通常1-2周，要完成一批可交付的功能 就像一期综艺节目，录2周，剪完播出，再录下一期 每个sprint结束要有可演示的产品增量"},{"id":"t0324","term":"看板（Kanban）","en":null,"chapter":"ch8","section":null,"plain":"可视化任务流程：To Do（待办）→Doing（进行中）→Done（完成）","analogy":"就像餐厅的订单板，哪些菜在做、哪些做好了一目了然","tip":"看板限制WIP（在制品数量），防止同时做太多事导致效率低下","level":2,"tags":[],"py":"kanb","pyFull":"kanban","searchText":"看板（kanban）  可视化任务流程：to do（待办）→doing（进行中）→done（完成） 就像餐厅的订单板，哪些菜在做、哪些做好了一目了然 看板限制wip（在制品数量），防止同时做太多事导致效率低下"},{"id":"t0325","term":"MVP（最小可行产品）","en":null,"chapter":"ch8","section":null,"plain":"用最少的功能做一个能用的版本，快速上线验证想法","analogy":"就像造车，先做个滑板（能用），再做自行车、摩托车，最后造汽车","tip":"MVP不是半成品，是「刚好能解决核心问题」的产品","level":2,"tags":[],"py":"mvp","pyFull":"mvp","searchText":"mvp（最小可行产品）  用最少的功能做一个能用的版本，快速上线验证想法 就像造车，先做个滑板（能用），再做自行车、摩托车，最后造汽车 mvp不是半成品，是「刚好能解决核心问题」的产品"},{"id":"t0326","term":"Git","en":null,"chapter":"ch8","section":null,"plain":"目前最流行的分布式版本控制系统，Linus Torvalds写的","analogy":"就像游戏的存档系统，随时存档、可以读档、可以开分支尝试不同路线","tip":"Git是程序员必须掌握的工具，常用命令：add、commit、push、pull、branch、merge","level":2,"tags":[],"py":"git","pyFull":"git","searchText":"git  目前最流行的分布式版本控制系统，linus torvalds写的 就像游戏的存档系统，随时存档、可以读档、可以开分支尝试不同路线 git是程序员必须掌握的工具，常用命令：add、commit、push、pull、branch、merge"},{"id":"t0327","term":"仓库（Repository）","en":null,"chapter":"ch8","section":null,"plain":"存代码的地方，有本地仓库和远程仓库（GitHub/GitLab/Gitee）","analogy":"就像网盘，本地有一份，云端同步一份","tip":"GitHub是全球最大开源社区，多在GitHub上做开源项目对求职帮助很大","level":2,"tags":[],"py":"cang","pyFull":"cangku","searchText":"仓库（repository）  存代码的地方，有本地仓库和远程仓库（github/gitlab/gitee） 就像网盘，本地有一份，云端同步一份 github是全球最大开源社区，多在github上做开源项目对求职帮助很大"},{"id":"t0328","term":"分支（Branch）","en":null,"chapter":"ch8","section":null,"plain":"从主线上分出来的独立开发线，不影响主线代码","analogy":"就像平行宇宙，在分支上随便改，满意了再合并回主线","tip":"常见分支策略：Git Flow（多分支复杂）、GitHub Flow（简单，一个main+feature分支）","level":2,"tags":[],"py":"fenz","pyFull":"fenzhi","searchText":"分支（branch）  从主线上分出来的独立开发线，不影响主线代码 就像平行宇宙，在分支上随便改，满意了再合并回主线 常见分支策略：git flow（多分支复杂）、github flow（简单，一个main+feature分支）"},{"id":"t0329","term":"合并（Merge）","en":null,"chapter":"ch8","section":null,"plain":"把一个分支的代码合并到另一个分支","analogy":"就像两条河汇合，两条支流的水汇到一起","tip":"两个分支改了同一行代码就会产生冲突，需要手动解决","level":2,"tags":[],"py":"hebi","pyFull":"hebing","searchText":"合并（merge）  把一个分支的代码合并到另一个分支 就像两条河汇合，两条支流的水汇到一起 两个分支改了同一行代码就会产生冲突，需要手动解决"},{"id":"t0330","term":"冲突（Conflict）","en":null,"chapter":"ch8","section":null,"plain":"两个分支修改了同一行代码，Git不知道听谁的，需要手动决定","analogy":"就像两个人改同一份文档的同一句话，改的不一样，要商量留哪个","tip":"解决冲突是日常操作，不要害怕，看清楚两边改了什么再决定","level":2,"tags":[],"py":"chon","pyFull":"chongtu","searchText":"冲突（conflict）  两个分支修改了同一行代码，git不知道听谁的，需要手动决定 就像两个人改同一份文档的同一句话，改的不一样，要商量留哪个 解决冲突是日常操作，不要害怕，看清楚两边改了什么再决定"},{"id":"t0331","term":"Pull Request（PR）","en":null,"chapter":"ch8","section":null,"plain":"提交代码合并请求，别人审核通过后才能合并到主分支","analogy":"就像投稿，写好了交给编辑审核，通过了才能发表","tip":"PR/Code Review是团队协作保证代码质量的核心机制","level":2,"tags":[],"py":"pull","pyFull":"pullrequest","searchText":"pull request（pr）  提交代码合并请求，别人审核通过后才能合并到主分支 就像投稿，写好了交给编辑审核，通过了才能发表 pr/code review是团队协作保证代码质量的核心机制"},{"id":"t0332","term":"Code Review","en":null,"chapter":"ch8","section":null,"plain":"同事帮你审查代码，找Bug、提改进建议","analogy":"就像互相批改作业，自己看不出的问题别人一眼就看到","tip":"Code Review不只是找Bug，还是团队知识共享、统一代码风格的方式","level":2,"tags":[],"py":"code","pyFull":"codereview","searchText":"code review  同事帮你审查代码，找bug、提改进建议 就像互相批改作业，自己看不出的问题别人一眼就看到 code review不只是找bug，还是团队知识共享、统一代码风格的方式"},{"id":"t0333","term":"CI/CD","en":null,"chapter":"ch8","section":null,"plain":"持续集成/持续部署：代码提交后自动搭、测试、部署","analogy":"就像自动化流水线，零件放上去自动组装、质检、包装、发货","tip":"CI=每次提交自动搭测试；CD=自动部署到生产环境。工具有Jenkins、GitLab CI、GitHub Actions","level":2,"tags":[],"py":"cicd","pyFull":"cicd","searchText":"ci/cd  持续集成/持续部署：代码提交后自动搭、测试、部署 就像自动化流水线，零件放上去自动组装、质检、包装、发货 ci=每次提交自动搭测试；cd=自动部署到生产环境。工具有jenkins、gitlab ci、github actions"},{"id":"t0334","term":"单元测试","en":null,"chapter":"ch8","section":null,"plain":"测试最小单元（函数/方法）是否正确","analogy":"就像测试每个零件，螺丝够不够结实、弹簧弹不弹","tip":"好的单元测试覆盖率高、运行快、不依赖外部系统。常用框架：JUnit（Java）、pytest（Python）、Jest（JS）","level":2,"tags":[],"py":"dany","pyFull":"danyuanceshi","searchText":"单元测试  测试最小单元（函数/方法）是否正确 就像测试每个零件，螺丝够不够结实、弹簧弹不弹 好的单元测试覆盖率高、运行快、不依赖外部系统。常用框架：junit（java）、pytest（python）、jest（js）"},{"id":"t0335","term":"集成测试","en":null,"chapter":"ch8","section":null,"plain":"把多个模块放一起测试，看它们配合有没有问题","analogy":"就像测试组装好的部件，零件单独都好，装在一起可能卡住","tip":"集成测试发现的是模块间接口的问题","level":2,"tags":[],"py":"jich","pyFull":"jichengceshi","searchText":"集成测试  把多个模块放一起测试，看它们配合有没有问题 就像测试组装好的部件，零件单独都好，装在一起可能卡住 集成测试发现的是模块间接口的问题"},{"id":"t0336","term":"回归测试","en":null,"chapter":"ch8","section":null,"plain":"改了代码后重新跑一遍所有测试，确保新改动没把旧功能搞坏","analogy":"就像汽车保养，换了机油后还要检查刹车、灯光有没有问题","tip":"自动化测试让回归测试成本极低，没有自动化测试的项目改代码就是「拆东墙补西墙」","level":2,"tags":[],"py":"huig","pyFull":"huiguiceshi","searchText":"回归测试  改了代码后重新跑一遍所有测试，确保新改动没把旧功能搞坏 就像汽车保养，换了机油后还要检查刹车、灯光有没有问题 自动化测试让回归测试成本极低，没有自动化测试的项目改代码就是「拆东墙补西墙」"},{"id":"t0337","term":"黑盒测试","en":null,"chapter":"ch8","section":null,"plain":"不看内部代码，只测输入输出对不对","analogy":"就像测电视，按遥控器看能不能换台，不用管里面电路怎么工作","tip":"黑盒测试关注功能正确性，不需要懂代码","level":2,"tags":[],"py":"heih","pyFull":"heiheceshi","searchText":"黑盒测试  不看内部代码，只测输入输出对不对 就像测电视，按遥控器看能不能换台，不用管里面电路怎么工作 黑盒测试关注功能正确性，不需要懂代码"},{"id":"t0338","term":"白盒测试","en":null,"chapter":"ch8","section":null,"plain":"知道内部代码结构，针对代码路径设计测试用例","analogy":"就像检修电路，知道每条线怎么走，逐段检测","tip":"白盒测试需要懂代码，能覆盖边界条件和异常路径","level":2,"tags":[],"py":"baih","pyFull":"baiheceshi","searchText":"白盒测试  知道内部代码结构，针对代码路径设计测试用例 就像检修电路，知道每条线怎么走，逐段检测 白盒测试需要懂代码，能覆盖边界条件和异常路径"},{"id":"t0339","term":"日志（Log）","en":null,"chapter":"ch8","section":null,"plain":"程序运行时记录的信息，用于排查问题","analogy":"就像飞机黑匣子，出事后查看记录，还原当时发生了什么","tip":"日志级别：DEBUG（调试信息）\u003c INFO（正常信息）\u003c WARN（警告）\u003c ERROR（错误）\u003c FATAL（致命）","level":2,"tags":[],"py":"rizh","pyFull":"rizhi","searchText":"日志（log）  程序运行时记录的信息，用于排查问题 就像飞机黑匣子，出事后查看记录，还原当时发生了什么 日志级别：debug（调试信息）\u003c info（正常信息）\u003c warn（警告）\u003c error（错误）\u003c fatal（致命）"},{"id":"t0340","term":"监控","en":null,"chapter":"ch8","section":null,"plain":"实时盯着程序运行状态：CPU、内存、QPS、响应时间、错误率","analogy":"就像医院的心电监护仪，实时显示生命体征，异常报警","tip":"常用监控：Prometheus+Grafana（指标）、ELK（日志）、SkyWalking（链路追踪）","level":2,"tags":[],"py":"jian","pyFull":"jiankong","searchText":"监控  实时盯着程序运行状态：cpu、内存、qps、响应时间、错误率 就像医院的心电监护仪，实时显示生命体征，异常报警 常用监控：prometheus+grafana（指标）、elk（日志）、skywalking（链路追踪）"},{"id":"t0341","term":"QPS/TPS","en":null,"chapter":"ch8","section":null,"plain":"QPS=每秒查询数，TPS=每秒事务数，衡量系统吞吐能力","analogy":"QPS就像餐厅每秒能接待几个客人，TPS是每秒能完成几桌菜","tip":"不同系统QPS差异大：小网站几十QPS，淘宝双十一几百万QPS","level":2,"tags":[],"py":"qpst","pyFull":"qpstps","searchText":"qps/tps  qps=每秒查询数，tps=每秒事务数，衡量系统吞吐能力 qps就像餐厅每秒能接待几个客人，tps是每秒能完成几桌菜 不同系统qps差异大：小网站几十qps，淘宝双十一几百万qps"},{"id":"t0342","term":"可用性","en":null,"chapter":"ch8","section":null,"plain":"系统正常服务的时间比例，99.9%=全年宕机8.76小时，5个9=5分钟","analogy":"就像电梯可用率，99%的时间能正常用，偶尔检修","tip":"互联网公司核心系统追求4个9（99.99%，全年宕机52分钟）以上","level":2,"tags":[],"py":"keyo","pyFull":"keyongxing","searchText":"可用性  系统正常服务的时间比例，99.9%=全年宕机8.76小时，5个9=5分钟 就像电梯可用率，99%的时间能正常用，偶尔检修 互联网公司核心系统追求4个9（99.99%，全年宕机52分钟）以上"},{"id":"t0343","term":"微服务","en":null,"chapter":"ch8","section":null,"plain":"把一个大应用拆成多个独立部署的小服务，各自管自己的业务","analogy":"就像公司分部门，人事部、财务部、技术部各自独立运作，通过API协作","tip":"微服务优点：独立部署、技术栈灵活、故障隔离；缺点：运维复杂、服务间调用复杂、分布式事务难题","level":2,"tags":[],"py":"weif","pyFull":"weifuwu","searchText":"微服务  把一个大应用拆成多个独立部署的小服务，各自管自己的业务 就像公司分部门，人事部、财务部、技术部各自独立运作，通过api协作 微服务优点：独立部署、技术栈灵活、故障隔离；缺点：运维复杂、服务间调用复杂、分布式事务难题"},{"id":"t0344","term":"单体应用（Monolith）","en":null,"chapter":"ch8","section":null,"plain":"所有功能打包在一个应用里，简单好部署，但大了不好维护","analogy":"就像一个大餐厅，前厅后厨收银都在一起，小餐厅效率高，大了管理混乱","tip":"创业公司从单体开始是合理的，微服务是「进化」出来的不是「设计」出来的","level":2,"tags":[],"py":"dant","pyFull":"dantiyingyong","searchText":"单体应用（monolith）  所有功能打包在一个应用里，简单好部署，但大了不好维护 就像一个大餐厅，前厅后厨收银都在一起，小餐厅效率高，大了管理混乱 创业公司从单体开始是合理的，微服务是「进化」出来的不是「设计」出来的"},{"id":"t0345","term":"容器（Container）","en":null,"chapter":"ch8","section":null,"plain":"把应用和依赖打包在一起，在哪都能跑，轻量级虚拟化","analogy":"就像集装箱，里面装什么不管，标准尺寸，装上船/火车/卡车都能运","tip":"Docker是容器标准。容器比虚拟机轻量（共享内核），启动快（秒级）","level":2,"tags":[],"py":"rong","pyFull":"rongqi","searchText":"容器（container）  把应用和依赖打包在一起，在哪都能跑，轻量级虚拟化 就像集装箱，里面装什么不管，标准尺寸，装上船/火车/卡车都能运 docker是容器标准。容器比虚拟机轻量（共享内核），启动快（秒级）"},{"id":"t0346","term":"Docker","en":null,"chapter":"ch8","section":null,"plain":"最流行的容器技术，统一了应用打包和部署的标准","analogy":"就像标准化集装箱，彻底解决「在我电脑上能跑」的问题","tip":"Docker核心概念：镜像（Image）=模板，容器（Container）=运行实例，Dockerfile=搭脚本","level":2,"tags":[],"py":"dock","pyFull":"docker","searchText":"docker  最流行的容器技术，统一了应用打包和部署的标准 就像标准化集装箱，彻底解决「在我电脑上能跑」的问题 docker核心概念：镜像（image）=模板，容器（container）=运行实例，dockerfile=搭脚本"},{"id":"t0347","term":"Kubernetes/K8s","en":null,"chapter":"ch8","section":null,"plain":"容器编排平台，管理大规模容器集群：部署、伸缩、升级、自愈","analogy":"就像港口调度系统，管理成千上万个集装箱（容器），自动安排位置、处理故障","tip":"K8s是云原生时代的操作系统。学习曲线较陡，但后端/运维方向必须掌握","level":2,"tags":[],"py":"kube","pyFull":"kubernetesks","searchText":"kubernetes/k8s  容器编排平台，管理大规模容器集群：部署、伸缩、升级、自愈 就像港口调度系统，管理成千上万个集装箱（容器），自动安排位置、处理故障 k8s是云原生时代的操作系统。学习曲线较陡，但后端/运维方向必须掌握"},{"id":"t0348","term":"云原生（Cloud Native）","en":null,"chapter":"ch8","section":null,"plain":"为云环境设计的应用开发方式：容器+微服务+DevOps+CI/CD","analogy":"就像为电商物流设计的商品，天生适合集装箱运输、自动化分拣","tip":"云原生是一套方法，不是某一个技术。CNCF（云原生计算基金会）维护环境","level":2,"tags":[],"py":"yuny","pyFull":"yunyuansheng","searchText":"云原生（cloud native）  为云环境设计的应用开发方式：容器+微服务+devops+ci/cd 就像为电商物流设计的商品，天生适合集装箱运输、自动化分拣 云原生是一套方法，不是某一个技术。cncf（云原生计算基金会）维护环境"},{"id":"t0349","term":"DevOps","en":null,"chapter":"ch8","section":null,"plain":"开发（Dev）和运维（Ops）一体化，打破壁垒，自动化交付","analogy":"就像餐厅厨师兼服务员，做菜上菜一条龙，减少沟通成本","tip":"DevOps是文化+工具+流程的结合，不是一个岗位名称","level":2,"tags":[],"py":"devo","pyFull":"devops","searchText":"devops  开发（dev）和运维（ops）一体化，打破壁垒，自动化交付 就像餐厅厨师兼服务员，做菜上菜一条龙，减少沟通成本 devops是文化+工具+流程的结合，不是一个岗位名称"},{"id":"t0350","term":"消息队列（MQ）","en":null,"chapter":"ch8","section":null,"plain":"在系统之间传递消息的中间件，用于解耦、削峰、异步","analogy":"就像邮局/快递，发件人把信放进邮局，收件人去取，不用直接见面","tip":"主流MQ：Kafka（高吞吐，大数据/日志）、RabbitMQ（功能丰富，业务系统）、RocketMQ（阿里开源，金融级）","level":2,"tags":[],"py":"xiao","pyFull":"xiaoxiduilie","searchText":"消息队列（mq）  在系统之间传递消息的中间件，用于解耦、削峰、异步 就像邮局/快递，发件人把信放进邮局，收件人去取，不用直接见面 主流mq：kafka（高吞吐，大数据/日志）、rabbitmq（功能丰富，业务系统）、rocketmq（阿里开源，金融级）"},{"id":"t0351","term":"RPC","en":null,"chapter":"ch8","section":null,"plain":"远程过程调用，像调用本地函数一样调用其他服务器上的服务","analogy":"就像打电话给同事帮忙，你不用管他在哪，拨号说话就行","tip":"常见RPC框架：gRPC（Google，HTTP/2）、Dubbo（阿里，Java）、Thrift（Facebook）","level":2,"tags":[],"py":"rpc","pyFull":"rpc","searchText":"rpc  远程过程调用，像调用本地函数一样调用其他服务器上的服务 就像打电话给同事帮忙，你不用管他在哪，拨号说话就行 常见rpc框架：grpc（google，http/2）、dubbo（阿里，java）、thrift（facebook）"},{"id":"t0352","term":"限流","en":null,"chapter":"ch8","section":null,"plain":"限制请求速率，防止突发流量把系统打垮","analogy":"就像景区限流，人太多就只出不进，保护景区不被挤爆","tip":"限流算法：计数器、滑动窗口、漏桶、令牌桶（最常用）","level":2,"tags":[],"py":"xian","pyFull":"xianliu","searchText":"限流  限制请求速率，防止突发流量把系统打垮 就像景区限流，人太多就只出不进，保护景区不被挤爆 限流算法：计数器、滑动窗口、漏桶、令牌桶（最常用）"},{"id":"t0353","term":"熔断（Circuit Breaker）","en":null,"chapter":"ch8","section":null,"plain":"下游服务故障时，暂时不请求它，直接返回错误，防止级联故障","analogy":"就像保险丝，电流太大就烧断，保护整条线路","tip":"熔断器三状态：关闭（正常）→打开（熔断，直接返回）→半开（试探恢复）","level":2,"tags":[],"py":"rong","pyFull":"rongduan","searchText":"熔断（circuit breaker）  下游服务故障时，暂时不请求它，直接返回错误，防止级联故障 就像保险丝，电流太大就烧断，保护整条线路 熔断器三状态：关闭（正常）→打开（熔断，直接返回）→半开（试探恢复）"},{"id":"t0354","term":"降级","en":null,"chapter":"ch8","section":null,"plain":"系统压力过大时，关掉非核心功能，保住核心功能可用","analogy":"就像停电时医院的策略，先保手术室和ICU，空调照明先关","tip":"双十一期间淘宝降级「推荐」「评价」等非核心功能，保「下单」「支付」","level":2,"tags":[],"py":"jian","pyFull":"jiangji","searchText":"降级  系统压力过大时，关掉非核心功能，保住核心功能可用 就像停电时医院的策略，先保手术室和icu，空调照明先关 双十一期间淘宝降级「推荐」「评价」等非核心功能，保「下单」「支付」"},{"id":"t0355","term":"幂等性","en":null,"chapter":"ch8","section":null,"plain":"同一个请求执行一次和执行多次结果完全一样","analogy":"就像电梯按钮，按一次和按十次结果一样，都是到那层","tip":"支付、下单等接口必须保证幂等，否则网络重试会导致重复扣款/下单","level":2,"tags":[],"py":"mide","pyFull":"midengxing","searchText":"幂等性  同一个请求执行一次和执行多次结果完全一样 就像电梯按钮，按一次和按十次结果一样，都是到那层 支付、下单等接口必须保证幂等，否则网络重试会导致重复扣款/下单"},{"id":"t0356","term":"技术债务","en":null,"chapter":"ch8","section":null,"plain":"为了赶进度写了凑合的代码，以后要花时间重构，欠了「债务」要还","analogy":"就像信用卡借钱，先用着爽，以后要还利息","tip":"适当借技术债务是正常的，但要有计划地还，否则债务越积越多最后「破产」（项目无法维护）","level":2,"tags":[],"py":"jish","pyFull":"jishuzhaiwu","searchText":"技术债务  为了赶进度写了凑合的代码，以后要花时间重构，欠了「债务」要还 就像信用卡借钱，先用着爽，以后要还利息 适当借技术债务是正常的，但要有计划地还，否则债务越积越多最后「破产」（项目无法维护）"},{"id":"t0357","term":"人工智能（AI）","en":null,"chapter":"ch9","section":null,"plain":"让机器模拟人类智能行为的技术总称：看、听、说、想、决策","analogy":"就像造一个「电子人」，能看（视觉）、能听（语音）、能想（推理）、能说（生成）","tip":"AI是个大概念，包含机器学习、深度学习、专家系统等。现在说的AI基本指深度学习","level":2,"tags":[],"py":"reng","pyFull":"rengongzhineng","searchText":"人工智能（ai）  让机器模拟人类智能行为的技术总称：看、听、说、想、决策 就像造一个「电子人」，能看（视觉）、能听（语音）、能想（推理）、能说（生成） ai是个大概念，包含机器学习、深度学习、专家系统等。现在说的ai基本指深度学习"},{"id":"t0358","term":"机器学习（ML）","en":null,"chapter":"ch9","section":null,"plain":"AI的核心分支，不手动写规则，让机器从数据中自动学规律","analogy":"就像教小孩认猫，不给「猫有四条腿两只耳朵」的规则，而是给1000张猫的照片让它自己总结","tip":"传统编程是「人写规则」，机器学习是「给数据和答案，机器自己学规则」","level":2,"tags":[],"py":"jiqi","pyFull":"jiqixuexi","searchText":"机器学习（ml）  ai的核心分支，不手动写规则，让机器从数据中自动学规律 就像教小孩认猫，不给「猫有四条腿两只耳朵」的规则，而是给1000张猫的照片让它自己总结 传统编程是「人写规则」，机器学习是「给数据和答案，机器自己学规则」"},{"id":"t0359","term":"深度学习（DL）","en":null,"chapter":"ch9","section":null,"plain":"机器学习的子集，用多层神经网络学习数据的复杂模式","analogy":"就像人脑分层处理信息，先看边缘，再看形状，再认眼睛鼻子，最后认出是猫","tip":"「深度」就是神经网络层数多，从几层到几百层。GPU让深网训练成为可能","level":2,"tags":[],"py":"shen","pyFull":"shenduxuexi","searchText":"深度学习（dl）  机器学习的子集，用多层神经网络学习数据的复杂模式 就像人脑分层处理信息，先看边缘，再看形状，再认眼睛鼻子，最后认出是猫 「深度」就是神经网络层数多，从几层到几百层。gpu让深网训练成为可能"},{"id":"t0360","term":"神经网络（Neural Network）","en":null,"chapter":"ch9","section":null,"plain":"模仿人脑神经元连接结构的数学模型，由输入层→隐藏层→输出层组成","analogy":"就像投票系统，每个「神经元」收到一些票（输入），加权计算后决定投不投给下一层（激活）","tip":"神经网络是深度学习的基础，但要理解它是数学模型不是真的模拟人脑","level":2,"tags":[],"py":"shen","pyFull":"shenjingwangluo","searchText":"神经网络（neural network）  模仿人脑神经元连接结构的数学模型，由输入层→隐藏层→输出层组成 就像投票系统，每个「神经元」收到一些票（输入），加权计算后决定投不投给下一层（激活） 神经网络是深度学习的基础，但要理解它是数学模型不是真的模拟人脑"},{"id":"t0361","term":"神经元/感知机","en":null,"chapter":"ch9","section":null,"plain":"神经网络的基本单元：输入加权求和→加偏置→过激活函数→输出","analogy":"就像一个小评委，综合各位选手（输入）的得分，加权后决定给不给通过","tip":"单个感知机只能画直线分类（线性可分），多层组合后能表达任意复杂函数","level":2,"tags":[],"py":"shen","pyFull":"shenjingyuanganzhiji","searchText":"神经元/感知机  神经网络的基本单元：输入加权求和→加偏置→过激活函数→输出 就像一个小评委，综合各位选手（输入）的得分，加权后决定给不给通过 单个感知机只能画直线分类（线性可分），多层组合后能表达任意复杂函数"},{"id":"t0362","term":"激活函数","en":null,"chapter":"ch9","section":null,"plain":"给神经元加入非线性能力，否则多层网络等价于一层（线性变换）","analogy":"就像投票的「阈值」，得分超过某值才通过（激活），否则不通过","tip":"常用激活函数：ReLU（最常用，x>0输出x）、Sigmoid（0~1概率）、Tanh（-1~1）、GELU（GPT用）","level":2,"tags":[],"py":"jihu","pyFull":"jihuohanshu","searchText":"激活函数  给神经元加入非线性能力，否则多层网络等价于一层（线性变换） 就像投票的「阈值」，得分超过某值才通过（激活），否则不通过 常用激活函数：relu（最常用，x>0输出x）、sigmoid（0~1概率）、tanh（-1~1）、gelu（gpt用）"},{"id":"t0363","term":"损失函数（Loss）","en":null,"chapter":"ch9","section":null,"plain":"衡量模型预测结果和真实答案差多少，是模型要最小化的目标","analogy":"就像考试分数，分越低（错题越少）越好","tip":"常见损失：交叉熵（分类）、均方误差MSE（回归）。训练过程就是最小化Loss","level":2,"tags":[],"py":"suns","pyFull":"sunshihanshu","searchText":"损失函数（loss）  衡量模型预测结果和真实答案差多少，是模型要最小化的目标 就像考试分数，分越低（错题越少）越好 常见损失：交叉熵（分类）、均方误差mse（回归）。训练过程就是最小化loss"},{"id":"t0364","term":"梯度下降","en":null,"chapter":"ch9","section":null,"plain":"优化算法：沿着梯度（斜率）反方向调整参数，一步步走到Loss最低点","analogy":"就像蒙着眼下山，每步感受脚下最陡的方向，往低处迈一步","tip":"梯度下降变体：SGD（随机）、Adam（自适应学习率，最常用）、学习率是步子大小","level":2,"tags":[],"py":"tidu","pyFull":"tiduxiajiang","searchText":"梯度下降  优化算法：沿着梯度（斜率）反方向调整参数，一步步走到loss最低点 就像蒙着眼下山，每步感受脚下最陡的方向，往低处迈一步 梯度下降变体：sgd（随机）、adam（自适应学习率，最常用）、学习率是步子大小"},{"id":"t0365","term":"反向传播（Backprop）","en":null,"chapter":"ch9","section":null,"plain":"高效计算梯度的方法：从输出层往回算每层参数的梯度，配合梯度下降更新","analogy":"就像考试回顾，从最终错题往前找哪一步思路错了，针对性改错","tip":"反向传播+梯度下降是神经网络训练的核心，理解链式法则就能理解反向传播","level":2,"tags":[],"py":"fanx","pyFull":"fanxiangchuanbo","searchText":"反向传播（backprop）  高效计算梯度的方法：从输出层往回算每层参数的梯度，配合梯度下降更新 就像考试回顾，从最终错题往前找哪一步思路错了，针对性改错 反向传播+梯度下降是神经网络训练的核心，理解链式法则就能理解反向传播"},{"id":"t0366","term":"Epoch","en":null,"chapter":"ch9","section":null,"plain":"把全部训练数据完整过一遍叫一个Epoch","analogy":"就像把整本书复习一遍，复习一轮就是一个Epoch","tip":"Epoch数太少学不好，太多会过拟合，通常几十到几百轮","level":2,"tags":[],"py":"epoc","pyFull":"epoch","searchText":"epoch  把全部训练数据完整过一遍叫一个epoch 就像把整本书复习一遍，复习一轮就是一个epoch epoch数太少学不好，太多会过拟合，通常几十到几百轮"},{"id":"t0367","term":"Batch Size","en":null,"chapter":"ch9","section":null,"plain":"一次训练用多少条样本，一批一批地算梯度更新参数","analogy":"就像吃饭，不是一口吃完一桌菜，而是一口一口吃","tip":"Batch大小影响训练速度和稳定性，常见32/64/128。太小震荡大，太大内存不够","level":2,"tags":[],"py":"batc","pyFull":"batchsize","searchText":"batch size  一次训练用多少条样本，一批一批地算梯度更新参数 就像吃饭，不是一口吃完一桌菜，而是一口一口吃 batch大小影响训练速度和稳定性，常见32/64/128。太小震荡大，太大内存不够"},{"id":"t0368","term":"学习率（Learning Rate）","en":null,"chapter":"ch9","section":null,"plain":"每次参数更新的步长大小，是最重要的超参数之一","analogy":"就如下山每步迈多大，步太大容易跨过山谷，步太小走太慢","tip":"学习率太大Loss震荡甚至发散，太小收敛慢。常用学习率衰减、Warmup策略","level":2,"tags":[],"py":"xuex","pyFull":"xuexil","searchText":"学习率（learning rate）  每次参数更新的步长大小，是最重要的超参数之一 就如下山每步迈多大，步太大容易跨过山谷，步太小走太慢 学习率太大loss震荡甚至发散，太小收敛慢。常用学习率衰减、warmup策略"},{"id":"t0369","term":"过拟合（Overfitting）","en":null,"chapter":"ch9","section":null,"plain":"模型在训练数据上表现极好，但在新数据上表现很差，学「死」了","analogy":"就像死记硬背答案，模拟考满分，高考遇到新题就不会了","tip":"解决：增加数据、正则化（L1/L2/Dropout）、早停（Early Stopping）、数据增强","level":2,"tags":[],"py":"guon","pyFull":"guonihe","searchText":"过拟合（overfitting）  模型在训练数据上表现极好，但在新数据上表现很差，学「死」了 就像死记硬背答案，模拟考满分，高考遇到新题就不会了 解决：增加数据、正则化（l1/l2/dropout）、早停（early stopping）、数据增强"},{"id":"t0370","term":"欠拟合（Underfitting）","en":null,"chapter":"ch9","section":null,"plain":"模型太简单，连训练数据都没学好","analogy":"就像根本没复习，模拟考也考不好，高考更不行","tip":"解决：用更复杂的模型、减少正则化、训练更久、加更多特征","level":2,"tags":[],"py":"qian","pyFull":"qiannihe","searchText":"欠拟合（underfitting）  模型太简单，连训练数据都没学好 就像根本没复习，模拟考也考不好，高考更不行 解决：用更复杂的模型、减少正则化、训练更久、加更多特征"},{"id":"t0371","term":"正则化","en":null,"chapter":"ch9","section":null,"plain":"防止过拟合的技术：给损失函数加惩罚项，让模型不要太「自信」","analogy":"就像考试不准写太多复杂公式，限制你答题的自由度，防止背答案","tip":"L1正则化产生稀疏解（特征选择），L2正则化让权重变小（权重衰减），Dropout随机丢弃神经元","level":2,"tags":[],"py":"zhen","pyFull":"zhengzehua","searchText":"正则化  防止过拟合的技术：给损失函数加惩罚项，让模型不要太「自信」 就像考试不准写太多复杂公式，限制你答题的自由度，防止背答案 l1正则化产生稀疏解（特征选择），l2正则化让权重变小（权重衰减），dropout随机丢弃神经元"},{"id":"t0372","term":"数据集划分","en":null,"chapter":"ch9","section":null,"plain":"训练集（训练用）、验证集（调参用）、测试集（最后评估用），一般7:1:2或6:2:2","analogy":"训练集=课本，验证集=模拟考，测试集=高考，模拟考用来调整学习方法，高考才是最终评价","tip":"绝对不能用测试集调参！那相当于偷看高考答案","level":2,"tags":[],"py":"shuj","pyFull":"shujujihuafen","searchText":"数据集划分  训练集（训练用）、验证集（调参用）、测试集（最后评估用），一般7:1:2或6:2:2 训练集=课本，验证集=模拟考，测试集=高考，模拟考用来调整学习方法，高考才是最终评价 绝对不能用测试集调参！那相当于偷看高考答案"},{"id":"t0373","term":"监督学习","en":null,"chapter":"ch9","section":null,"plain":"训练数据有标签（正确答案），学习输入到标签的映射","analogy":"就像做有答案的练习题，做题对答案，不断纠错","tip":"分类（预测类别：猫/狗）和回归（预测数值：房价）是监督学习两大任务","level":2,"tags":[],"py":"jian","pyFull":"jianduxuexi","searchText":"监督学习  训练数据有标签（正确答案），学习输入到标签的映射 就像做有答案的练习题，做题对答案，不断纠错 分类（预测类别：猫/狗）和回归（预测数值：房价）是监督学习两大任务"},{"id":"t0374","term":"无监督学习","en":null,"chapter":"ch9","section":null,"plain":"训练数据没有标签，让机器自己发现数据中的规律和结构","analogy":"就像给一堆混合的水果不告诉是什么，自己按颜色大小分类","tip":"聚类（K-Means）、降维（PCA）、生成模型（早期）都是无监督","level":2,"tags":[],"py":"wuji","pyFull":"wujianduxuexi","searchText":"无监督学习  训练数据没有标签，让机器自己发现数据中的规律和结构 就像给一堆混合的水果不告诉是什么，自己按颜色大小分类 聚类（k-means）、降维（pca）、生成模型（早期）都是无监督"},{"id":"t0375","term":"强化学习（RL）","en":null,"chapter":"ch9","section":null,"plain":"智能体通过与环境交互，根据奖励/惩罚学习最优策略","analogy":"就像训狗，做对了给零食（奖励），做错了不给，它慢慢学会做对的事","tip":"AlphaGo、游戏AI、机器人控制、自动驾驶决策都用强化学习","level":2,"tags":[],"py":"qian","pyFull":"qianghuaxuexi","searchText":"强化学习（rl）  智能体通过与环境交互，根据奖励/惩罚学习最优策略 就像训狗，做对了给零食（奖励），做错了不给，它慢慢学会做对的事 alphago、游戏ai、机器人控制、自动驾驶决策都用强化学习"},{"id":"t0376","term":"CNN（卷积神经网络）","en":null,"chapter":"ch9","section":null,"plain":"专门处理网格数据（如图像）的神经网络，用卷积核提取局部特征","analogy":"就像用放大镜在图片上滑动看，先看边缘纹理，再看眼睛鼻子，最后认出来是猫","tip":"经典CNN：LeNet→AlexNet→VGG→GoogLeNet→ResNet。ResNet的残差连接让深度网络能训练到上百层","level":2,"tags":[],"py":"cnn","pyFull":"cn
